<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${current.title} + ' | 첫출근'">약관 | 첫출근</title>
    <link rel="stylesheet" th:href="@{/css/policy/page.css}" />
    <link rel="stylesheet" th:href="@{/css/common.css}" />
</head><body>
<header th:replace="~{common/header :: header}"></header>
<div class="policy-page"><main class="policy-shell">

    <div class="policy-main">
        <div class="eyebrow" th:text="${current.consentType == '공개'} ? 'POLICY' : '동의 항목'">POLICY-01</div>
        <h1 class="page-title">약관 및 정책</h1>
        <p class="page-desc">회원가입에 사용되는 약관과 동의 내용을 확인할 수 있습니다.</p>

        <div class="policy-card">
            <nav class="policy-list">
                <a th:each="p : ${policies}"
                   th:href="@{/policy/{code}(code=${p.policyCode})}"
                   th:text="${p.title}"
                   th:classappend="${p.policyCode == current.policyCode} ? 'active' : ''">약관명</a>
            </nav>

            <section class="policy-detail" id="policy-content">
                <h2 th:text="${current.title}">약관명</h2>

                <p style="font-size:12.5px;color:var(--gray-500,#8a93a3);margin:-6px 0 18px;">
                    <span th:if="${current.audience}" th:text="'대상: ' + ${current.audience}"></span>
                    <span th:if="${current.consentType}" th:text="' · 구분: ' + ${current.consentType}"></span>
                    <span th:if="${current.effectiveFrom}" th:text="' · 시행일: ' + ${current.effectiveFrom}"></span>
                    <span th:if="${current.updatedAt}" th:text="' · 최종수정: ' + ${current.updatedAt}"></span>
                </p>

                <div class="clause">
                    <p style="white-space:pre-wrap;line-height:1.7;" th:text="${current.content}">본문 내용</p>
                </div>

                <div class="fine-print">
                    ※ 실제 화면에서는 관리자가 지정한 현재 부분 전체를 출력합니다.
                </div>
            </section>
        </div>
    </div>

    <aside class="policy-side">
        <div class="summary-card">
            <h3>약관 조회 안내</h3>
            <ul>
                <li>좌측 목록에서 원하는 약관을 선택하면 해당 본문이 즉시 표시됩니다</li>
                <li>회원가입 시 동의한 항목과 동일한 전체 내용입니다</li>
                <li>관리자가 수정하면 즉시 반영됩니다</li>
                <li>버전 이력 및 적용일 관리는 제공되지 않습니다</li>
            </ul>
        </div>
    </aside>

</main></div>
<footer th:replace="~{common/footer :: footer}"></footer>
<script th:src="@{/js/common.js}"></script>
</body></html>
