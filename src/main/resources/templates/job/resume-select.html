<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>지원 이력서 선택 | 첫출근</title><link rel="stylesheet" th:href="@{/css/common.css}" href="/css/common.css"><link rel="stylesheet" th:href="@{/css/job/common.css}" href="/css/job/common.css"></head>
<body>
<header th:replace="~{common/header :: header}"></header>
<main class="job-page application-page">
  <div class="application-heading"><h1>지원할 이력서를 선택해주세요</h1><p>기업에 제출할 이력서와 자기소개서를 확인할 수 있어요.</p></div>
  <div class="application-layout">
    <form class="application-card" th:action="@{/job/application/confirm}" method="get">
      <section class="application-section"><h2>이력서</h2>
        <label class="resume-option"><input type="radio" name="resumeId" value="1" checked><span class="resume-copy"><strong>백엔드 개발자 이력서</strong><small>2026.07.18 수정</small></span><span class="selected-label">선택됨</span></label>
        <label class="resume-option"><input type="radio" name="resumeId" value="2"><span class="resume-copy"><strong>신입 개발자 이력서</strong><small>2026.07.10 수정</small></span><span class="selected-label">선택</span></label>
      </section>
      <section class="application-section"><h2>자기소개서</h2><div class="document-row"><div><strong>성장 경험과 지원 동기</strong><small>2026.07.19 수정</small></div><a class="document-link" th:href="@{/my/cover-letter/list}">변경</a></div></section>
      <div class="notice-box"><strong>제출 전 확인해주세요</strong>지원 후에는 제출한 이력서와 자기소개서를 수정할 수 없어요.</div>
      <div class="application-actions"><a class="job-secondary-button" th:href="@{/job/detail}">취소</a><button class="job-primary-button" type="submit">선택 완료</button></div>
    </form>
    <aside class="application-side"><h3>지원 단계</h3><ol><li><strong>1. 이력서 선택</strong></li><li>2. 지원 내용 확인</li><li>3. 지원 완료</li></ol></aside>
  </div>
</main>
<footer th:replace="~{common/footer :: footer}"></footer><script th:src="@{/js/job.js}" src="/js/job.js"></script>
</body></html>
