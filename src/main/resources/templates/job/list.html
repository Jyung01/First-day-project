<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>채용공고 | 첫출근</title>

    <link rel="stylesheet"
          th:href="@{/css/common.css}"
          href="/css/common.css">

    <link rel="stylesheet"
          th:href="@{/css/job/common.css}"
          href="/css/job/common.css">

    <link rel="stylesheet"
          th:href="@{/css/job/list.css}"
          href="/css/job/list.css">

    <link rel="stylesheet"
          th:href="@{/css/modal/common.css}"
          href="/css/modal/common.css">
</head>

<body class="job-header-active"
      th:data-login-url="@{/auth/login}">

<header th:replace="~{common/header :: header}">
</header>

<main class="job-page">

    <section class="job-hero">
        <div class="job-container">

            <div class="job-hero-top">

                <div>
                    <h1>채용공고</h1>

                    <p>
                        나에게 맞는 새로운 기회를 찾아보세요.
                    </p>
                </div>

                <form class="job-search"
                      th:action="@{/job/search}"
                      method="get">

                    <input name="keyword"
                           th:value="${keyword}"
                           aria-label="공고명, 기업명 검색"
                           placeholder="공고명, 기업명 검색">

                    <input type="hidden"
                           name="sort"
                           th:value="${sort}">

                    <button type="submit">
                        검색
                    </button>
                </form>

            </div>

            <div th:replace="
                ~{job/fragments/filter :: filterBar}">
            </div>

        </div>
    </section>

    <div th:replace="
        ~{job/fragments/filter :: activeFilters}">
    </div>

    <section class="job-content">
        <div class="job-container">

            <a class="job-banner"
               th:if="${jobBanner != null}"
               th:href="${#strings.isEmpty(jobBanner.linkUrl)
                   ? null
                   : jobBanner.linkUrl}"
               th:aria-label="${jobBanner.altText}">
                <img th:src="${jobBanner.imageUrl}"
                     th:alt="${jobBanner.altText}">
            </a>

            <div class="job-section-head">
                <h2>전체 채용공고</h2>

                <span th:text="|총 ${jobPage.totalElements}건|">
                    총 0건
                </span>
            </div>

            <!-- 채용공고 목록 -->
            <div class="job-card-grid">

                <a class="job-card"
                   th:each="job, jobStat : ${jobs}"
                   th:href="@{/job/detail(
                       jobPostingId=${job.jobPostingId},
                       keyword=${keyword},
                       parentCategoryId=${parentCategoryId},
                       categoryId=${categoryIds},
                       region=${regions},
                       career=${careers},
                       education=${educations},
                       skillId=${skillIds},
                       sort=${sort},
                       page=${pageInfo.currentPage * 4
                           + (jobStat.index - jobStat.index % 3) / 3}
                   )}">

                    <!-- 기업 정보 -->
                    <div class="job-card-head">

                        <!-- logo_url이 있는 경우 -->
                        <img class="company-logo"
                             th:if="${!#strings.isEmpty(job.logoUrl)}"
                             th:src="${job.logoUrl}"
                             th:alt="|${job.companyName} 로고|">

                        <!-- logo_url이 없는 경우 기업명 첫 글자 -->
                        <span class="company-mark"
                              th:unless="${!#strings.isEmpty(job.logoUrl)}"
                              th:text="${
                                  !#strings.isEmpty(job.companyName)
                                  ? #strings.substring(
                                      job.companyName,
                                      0,
                                      1
                                  )
                                  : '회'
                              }">
                            회
                        </span>

                        <span class="company-name"
                              th:text="${job.companyName}">
                            기업명
                        </span>

                    </div>

                    <div class="job-card-actions">

                        <div class="job-badges">

                            <span class="job-badge hot"
                                  th:if="${job.hotPosting}">
                                HOT
                            </span>

                            <span class="job-badge new"
                                  th:if="${job.newPosting}">
                                NEW
                            </span>

                        </div>

                        <button class="bookmark"
                                type="button"
                                th:data-job-posting-id="${job.jobPostingId}"
                                th:data-job-title="${job.title}"
                                th:data-logged-in="${#authorization.expression('hasRole(''PERSONAL'')')}"
                                th:classappend="${job.bookmarked} ? ' active'"
                                th:text="${job.bookmarked} ? '♥' : '♡'"
                                th:attr="aria-pressed=${job.bookmarked}"
                                aria-label="관심 공고 등록">
                            ♡
                        </button>

                    </div>

                    <h3 th:text="${job.title}">
                        채용공고 제목
                    </h3>

                    <p class="job-meta">

                        <span th:if="${
                                  !#strings.isEmpty(job.workRegion)
                              }"
                              th:text="${job.workRegion}">
                            근무 지역
                        </span>

                        <span th:if="${
                                  !#strings.isEmpty(job.workRegion)
                                  and
                                  !#strings.isEmpty(job.careerType)
                              }">
                            ·
                        </span>

                        <span th:if="${
                                  !#strings.isEmpty(job.careerType)
                              }"
                              th:text="${job.careerType}">
                            경력 조건
                        </span>

                    </p>

                    <div class="job-tags">

                        <span class="job-tag"
                              th:if="${
                                  !#strings.isEmpty(
                                      job.employmentType
                                  )
                              }"
                              th:text="${job.employmentType}">
                            고용 형태
                        </span>

                        <span class="job-tag"
                              th:if="${
                                  !#strings.isEmpty(
                                      job.categoryName
                                  )
                              }"
                              th:text="${job.categoryName}">
                            직무 카테고리
                        </span>

                    </div>

                    <div class="job-card-foot">

                        <span th:text="|조회 ${job.viewCount}|">
                            조회 0
                        </span>

                        <span class="job-deadline"
                              th:classappend="${
                                  job.deadlineText == 'D-Day'
                                  ? ' today'
                                  : ''
                              }"
                              th:text="${job.deadlineText}">
                            D-8
                        </span>

                    </div>

                </a>

            </div>

            <!-- 조회 결과 없음 -->
            <div class="job-empty"
                 th:if="${#lists.isEmpty(jobs)}">

                현재 모집 중인 채용공고가 없습니다.

            </div>

            <!-- 페이지네이션: 5페이지 단위 -->
            <nav
                    class="pagination"
                    aria-label="채용공고 페이지"
            >
                <a
                        th:href="${pageInfo.hasPreviousBlock}
      ? @{/job/search(
          page=${pageInfo.previousBlockPage},
          keyword=${keyword},
          categoryId=${categoryIds},
          region=${regions},
          career=${careers},
          education=${educations},
          skillId=${skillIds},
          sort=${sort}
        )}
      : '#'"
                        th:classappend="${!pageInfo.hasPreviousBlock} ? 'is-disabled'"
                        th:attr="aria-disabled=${!pageInfo.hasPreviousBlock}"
                        aria-label="이전 페이지 그룹"
                >
                    ‹
                </a>

                <a
                        th:each="pageNumber : ${#numbers.sequence(
      pageInfo.startPage,
      pageInfo.endPage
    )}"
                        th:href="@{/job/search(
                          page=${pageNumber},
                          keyword=${keyword},
                          categoryId=${categoryIds},
                          region=${regions},
                          career=${careers},
                          education=${educations},
                          skillId=${skillIds},
                          sort=${sort}
                        )}"
                        th:classappend="${pageNumber == pageInfo.currentPage}
      ? 'active'"
                        th:attr="aria-current=${pageNumber == pageInfo.currentPage}
      ? 'page'"
                        th:text="${pageNumber + 1}"
                >
                    1
                </a>

                <a
                        th:href="${pageInfo.hasNextBlock}
      ? @{/job/search(
          page=${pageInfo.nextBlockPage},
          keyword=${keyword},
          categoryId=${categoryIds},
          region=${regions},
          career=${careers},
          education=${educations},
          skillId=${skillIds},
          sort=${sort}
        )}
      : '#'"
                        th:classappend="${!pageInfo.hasNextBlock} ? 'is-disabled'"
                        th:attr="aria-disabled=${!pageInfo.hasNextBlock}"
                        aria-label="다음 페이지 그룹"
                >
                    ›
                </a>
            </nav>

        </div>
    </section>

</main>

<footer th:replace="~{common/footer :: footer}">
</footer>

<div th:replace="~{modal/common/confirm-modal :: confirmModal}">
</div>

<script th:src="@{/js/common.js}"
        src="/js/common.js">
</script>

<script th:src="@{/js/job/common.js}"
        src="/js/job/common.js">
</script>

<script th:src="@{/js/job/filter.js}"
        src="/js/job/filter.js">
</script>

<script th:src="@{/js/job/bookmark.js}"
        src="/js/job/bookmark.js">
</script>

<script th:src="@{/js/modal.js}"
        src="/js/modal.js">
</script>

</body>
</html>
