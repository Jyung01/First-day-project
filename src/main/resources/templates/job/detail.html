<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${job.title + ' | 첫출근'}">채용공고 상세 | 첫출근</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/job/common.css}">
  <link rel="stylesheet" th:href="@{/css/job/list.css}">
  <link rel="stylesheet" th:href="@{/css/job/detail.css}">
  <link rel="stylesheet" th:href="@{/css/modal/common.css}">
  <link rel="stylesheet" th:href="@{/css/modal/job/resume-select-modal.css}">
</head>
<body class="job-header-active"
      th:data-login-url="@{/auth/login}">
<header th:replace="~{common/header :: header}"></header>

<main class="job-page">
  <section class="job-hero">
    <div class="job-container">
      <div class="job-hero-top">
        <h1>채용공고</h1>
        <form class="job-search" th:action="@{/job/search}" method="get">
          <input name="keyword"
                 th:value="${keyword}"
                 aria-label="공고명, 기업명 검색"
                 placeholder="공고명, 기업명 검색">
          <button type="submit">검색</button>
        </form>
      </div>
      <div th:replace="~{job/fragments/filter :: filterBar}"></div>
    </div>
  </section>
  <div th:replace="~{job/fragments/filter :: activeFilters}"></div>

  <section class="job-content">
    <div class="job-container job-split">
      <div class="job-list-column">
        <h2 class="job-result-count">
          검색 결과 <strong th:text="|${jobPage.totalElements}건|">0건</strong>
        </h2>

        <aside class="job-list-pane" aria-label="채용공고 목록">
          <a class="job-card"
             th:each="item : ${jobs}"
             th:classappend="${item.jobPostingId == job.jobPostingId} ? ' selected'"
             th:href="@{/job/detail(
               jobPostingId=${item.jobPostingId},
               keyword=${keyword},
               parentCategoryId=${parentCategoryId},
               categoryId=${categoryIds},
               region=${regions},
               career=${careers},
               education=${educations},
               skillId=${skillIds},
               sort=${sort},
               page=${pageInfo.currentPage}
             )}">
            <div class="job-card-head">
              <img class="company-logo"
                   th:if="${!#strings.isEmpty(item.logoUrl)}"
                   th:src="${item.logoUrl}"
                   th:alt="|${item.companyName} 로고|">
              <span class="company-mark"
                    th:unless="${!#strings.isEmpty(item.logoUrl)}"
                    th:text="${#strings.substring(item.companyName, 0, 1)}">기</span>
              <span class="company-name" th:text="${item.companyName}">기업명</span>
            </div>
            <div class="job-card-actions">
              <div class="job-badges">
                <span class="job-badge hot" th:if="${item.hotPosting}">HOT</span>
                <span class="job-badge new" th:if="${item.newPosting}">NEW</span>
              </div>
              <button class="bookmark"
                      type="button"
                      th:data-job-posting-id="${item.jobPostingId}"
                      th:data-logged-in="${personalMember}"
                      th:classappend="${item.bookmarked} ? ' active'"
                      th:text="${item.bookmarked} ? '♥' : '♡'"
                      th:attr="aria-pressed=${item.bookmarked}">♡</button>
            </div>
            <h3 th:text="${item.title}">공고 제목</h3>
            <p class="job-meta">
              <span th:text="${item.workRegion}">지역</span> ·
              <span th:text="${item.careerType}">경력</span>
            </p>
            <div class="job-tags">
              <span class="job-tag" th:text="${item.employmentType}">고용형태</span>
              <span class="job-tag" th:text="${item.categoryName}">직무</span>
            </div>
            <div class="job-card-foot">
              <span th:text="|조회 ${item.viewCount}|">조회 0</span>
              <span class="job-deadline" th:text="${item.deadlineText}">D-8</span>
            </div>
          </a>
        </aside>

        <nav class="pagination job-list-pagination" aria-label="채용공고 목록 페이지">
          <a th:href="${pageInfo.currentPage > 0}
             ? @{/job/detail(
                 jobPostingId=${job.jobPostingId},
                 keyword=${keyword},
                 parentCategoryId=${parentCategoryId},
                 categoryId=${categoryIds},
                 region=${regions},
                 career=${careers},
                 education=${educations},
                 skillId=${skillIds},
                 sort=${sort},
                 page=${pageInfo.currentPage - 1}
               )}
             : '#'"
             th:classappend="${pageInfo.currentPage == 0} ? ' is-disabled'"
             th:attr="aria-disabled=${pageInfo.currentPage == 0}"
             aria-label="이전 페이지">‹</a>

          <a th:each="pageNumber : ${#numbers.sequence(pageInfo.startPage, pageInfo.endPage)}"
             th:href="@{/job/detail(
               jobPostingId=${job.jobPostingId},
               keyword=${keyword},
               parentCategoryId=${parentCategoryId},
               categoryId=${categoryIds},
               region=${regions},
               career=${careers},
               education=${educations},
               skillId=${skillIds},
               sort=${sort},
               page=${pageNumber}
             )}"
             th:classappend="${pageNumber == pageInfo.currentPage} ? ' active'"
             th:text="${pageNumber + 1}">1</a>

          <a th:href="${pageInfo.currentPage + 1 lt pageInfo.totalPages}
             ? @{/job/detail(
                 jobPostingId=${job.jobPostingId},
                 keyword=${keyword},
                 parentCategoryId=${parentCategoryId},
                 categoryId=${categoryIds},
                 region=${regions},
                 career=${careers},
                 education=${educations},
                 skillId=${skillIds},
                 sort=${sort},
                 page=${pageInfo.currentPage + 1}
               )}
             : '#'"
             th:classappend="${pageInfo.currentPage + 1 ge pageInfo.totalPages}
                 ? ' is-disabled'"
             th:attr="aria-disabled=${pageInfo.currentPage + 1 ge pageInfo.totalPages}"
             aria-label="다음 페이지">›</a>
        </nav>
      </div>

      <article class="job-detail-panel">
        <div class="detail-main">
          <div class="job-card-head">
            <img class="company-logo"
                 th:if="${!#strings.isEmpty(job.companyLogoUrl)}"
                 th:src="${job.companyLogoUrl}"
                 th:alt="|${job.companyName} 로고|">
            <span class="company-mark"
                  th:unless="${!#strings.isEmpty(job.companyLogoUrl)}"
                  th:text="${#strings.substring(job.companyName, 0, 1)}">기</span>
            <div>
              <strong th:text="${job.companyName}">기업명</strong>
              <p class="job-meta">
                <span th:text="${job.workRegion}">근무 지역</span>
                ·
                <span th:text="${job.companyIndustry}">업종</span>
              </p>
            </div>
          </div>

          <div class="detail-top-actions">
            <div class="job-badges">
              <span class="job-badge hot" th:if="${job.hotPosting}">HOT</span>
              <span class="job-badge new" th:if="${job.newPosting}">NEW</span>
            </div>
            <button class="bookmark"
                    type="button"
                    th:data-job-posting-id="${job.jobPostingId}"
                    th:data-logged-in="${personalMember}"
                    th:classappend="${job.bookmarked} ? ' active'"
                    th:text="${job.bookmarked} ? '♥' : '♡'"
                    th:attr="aria-pressed=${job.bookmarked}"
                    th:aria-label="${job.bookmarked}
                        ? '관심 공고 해제'
                        : '관심 공고 등록'">♡</button>
          </div>

          <div class="detail-title-row">
            <div>
              <p class="detail-category" th:text="${job.category}">직무</p>
              <h1 th:text="${job.title}">채용공고 제목</h1>
            </div>
            <button class="report-button" type="button">신고</button>
          </div>

          <div class="detail-summary">
            <div><small>경력</small><strong th:text="${job.career}">경력</strong></div>
            <div><small>학력</small><strong th:text="${job.educationLevel}">학력</strong></div>
            <div><small>고용형태</small><strong th:text="${job.employmentType}">고용형태</strong></div>
            <div><small>마감일</small><strong class="job-deadline" th:text="${job.deadline}">마감일</strong></div>
          </div>
        </div>

        <div class="detail-tabs">
          <button class="active" type="button" data-detail-tab="job">채용 상세</button>
          <button type="button" data-detail-tab="company">기업정보</button>
        </div>

        <div class="detail-copy" data-job-copy>
          <section><h2>공고 소개</h2><p th:text="${job.introduction}"></p></section>
          <section><h2>주요 업무</h2><p th:text="${job.mainTasks}"></p></section>
          <section><h2>자격 요건</h2><p th:text="${job.qualifications}"></p></section>
          <section><h2>우대 사항</h2><p th:text="${job.preferredConditions}"></p></section>
          <section class="detail-skills" th:if="${!#lists.isEmpty(job.skills)}">
            <h2>기술 스택</h2>
            <div class="detail-skill-list">
              <span th:each="skill : ${job.skills}" th:text="${skill}">기술</span>
            </div>
          </section>
          <section th:if="${!#lists.isEmpty(job.benefits)}">
            <h2>복리후생</h2>
            <ul><li th:each="benefit : ${job.benefits}" th:text="${benefit}"></li></ul>
          </section>
          <section>
            <h2>근무 정보</h2>
            <p>근무지 · <span th:text="${job.workAddress}"></span></p>
            <p>급여 · <span th:text="${job.salary}"></span></p>
            <p>모집 인원 · <span th:text="|${job.headcount}명|"></span></p>
          </section>
        </div>

        <div class="detail-copy" data-company-copy hidden>
          <section><h2 th:text="${job.companyName}">기업명</h2><p th:text="${job.companyDescription}"></p></section>
          <section><h2>기업 소개</h2><p th:text="${job.companyIntroduction}"></p></section>
          <section><h2>기업 정보</h2><p th:text="|업종 ${job.companyIndustry} · ${job.companyAddress}|"></p></section>
        </div>

        <div class="detail-actions">
          <button class="job-primary-button"
                  type="button"
                  data-resume-modal-open
                  th:data-personal-member="${personalMember}"
                  th:data-job-posting-id="${job.jobPostingId}">지원하기</button>
        </div>
      </article>
    </div>
  </section>
</main>

<footer th:replace="~{common/footer :: footer}"></footer>
<div th:replace="~{modal/job/resume-select-modal :: resumeSelectModal}"></div>
<div th:replace="~{modal/common/confirm-modal :: confirmModal}"></div>
<script th:src="@{/js/job/detail.js}"></script>
<script th:src="@{/js/job/common.js}"></script>
<script th:src="@{/js/job/filter.js}"></script>
<script th:src="@{/js/job/bookmark.js}"></script>
<script th:src="@{/js/modal.js}"></script>
<script th:src="@{/js/modal/job/resume-select-modal.js}"></script>
</body>
</html>
