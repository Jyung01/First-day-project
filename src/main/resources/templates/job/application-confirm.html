<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>입사지원 확인 | 첫출근</title><link rel="stylesheet" th:href="@{/css/common.css}" href="/css/common.css"><link rel="stylesheet" th:href="@{/css/job/common.css}" href="/css/job/common.css"><link rel="stylesheet" th:href="@{/css/job/application.css}" href="/css/job/application.css"><link rel="stylesheet" th:href="@{/css/modal/common.css}" href="/css/modal/common.css"></head>
<body class="job-header-active">
<header th:replace="~{common/header :: header}"></header>
<main class="job-page application-page">
  <div class="application-heading"><h1>입사지원 확인</h1><p>제출할 내용을 마지막으로 확인해주세요.</p></div>
  <div class="application-layout">
    <form class="application-card" th:action="@{/job/application/complete}" method="get" data-application-form>
      <section class="application-section"><h2>지원 공고</h2><div class="posting-summary"><span class="company-mark">네</span><div><span class="company-name">네이버클라우드</span><strong>Java/Spring 백엔드 개발자</strong></div><span class="job-deadline">D-8</span></div></section>
      <section class="application-section"><h2>제출 이력서</h2><div class="document-row"><div><strong>백엔드 개발자 이력서</strong><small>2026.07.18 수정</small></div><a class="document-link" th:href="@{/my/resume/detail}">보기</a></div></section>
      <section class="application-section"><h2>제출 자기소개서</h2><div class="document-row"><div><strong>성장 경험과 지원 동기</strong><small>2026.07.19 수정</small></div><a class="document-link" th:href="@{/my/cover-letter/detail}">보기</a></div></section>
      <div class="agree-box"><label><input type="checkbox" required>지원서 제출 및 개인정보 제공에 동의합니다.</label><p>제출 후에는 지원 서류를 수정할 수 없습니다.</p></div>
      <div class="application-actions"><a class="job-secondary-button" th:href="@{/job/detail(apply=true)}">이전</a><button class="job-primary-button" type="submit">최종 지원하기</button></div>
    </form>
    <aside class="application-side"><h3>지원 전 확인</h3><ul><li>✓ 공고 정보</li><li>✓ 이력서 선택</li><li>✓ 자기소개서 선택</li><li>✓ 개인정보 제공 동의</li></ul></aside>
  </div>
</main>
<footer th:replace="~{common/footer :: footer}"></footer>
<div th:replace="~{modal/common/confirm-modal :: confirmModal}"></div>
<script th:src="@{/js/modal.js}" src="/js/modal.js"></script>
<script th:src="@{/js/job/application-confirm.js}" src="/js/job/application-confirm.js"></script>
</body></html>
