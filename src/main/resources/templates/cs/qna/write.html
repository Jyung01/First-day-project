<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1:1 문의 작성 | 첫출근 고객센터</title>
  <link rel="stylesheet" th:href="@{/css/cs/user-common.css}" />
  <link rel="stylesheet" th:href="@{/css/common.css}" />
</head>
<body>
<header th:replace="~{common/header :: header}"></header>
<div class="cs-page">
  <section class="hero">
    <div class="wrap">
      <p class="eyebrow">FIRST DAY HELP CENTER</p>
      <h1>고객센터</h1>
      <p>필요한 도움을 빠르고 편하게 확인하세요.</p>
    </div>
  </section>

  <main class="content-shell">
    <div class="wrap">

      <nav class="tabs">
        <a class="tab" th:href="@{/cs/notice}">공지사항</a>
        <a class="tab" th:href="@{/cs/faq}">자주 묻는 질문</a>
        <a class="tab active" th:href="@{/cs/qna}">1:1 문의</a>
      </nav>

      <div class="panel-head">
        <h2>1:1 문의 작성</h2>
      </div>

      <p class="required-note">* 필수 입력 항목</p>

      <form class="form-card" id="qnaWriteForm" onsubmit="return false;">
        <div class="form-row">
          <label>문의 유형 <span class="req">*</span></label>
          <select class="form-control" id="categoryId">
            <option value="">문의 유형을 선택해주세요.</option>
            <option th:each="c : ${categories}"
                    th:value="${c.inquiryCategoryId}"
                    th:text="${c.categoryName}"></option>
          </select>
        </div>

        <div class="form-row">
          <label>제목 <span class="req">*</span></label>
          <input type="text" class="form-control" id="titleInput" maxlength="100" placeholder="문의 제목을 입력해주세요. (최대 100자)" />
        </div>

        <div class="form-row">
          <label>문의 내용 <span class="req">*</span></label>
          <textarea class="form-control" id="contentInput" data-maxlength="1000" maxlength="1000" placeholder="문의 내용을 자세히 입력해주세요."></textarea>
          <p class="char-count" id="charCount">0 / 1,000</p>
        </div>

        <div class="form-row">
          <label>첨부파일</label>
          <div class="upload-box">
            <button type="button" class="upload-btn" disabled title="첨부파일 업로드는 준비 중입니다.">+ 파일 선택</button>
            <span class="upload-hint">JPG, PNG, PDF · 파일당 최대 10MB · 최대 3개</span>
          </div>
        </div>

        <p class="form-error" id="writeError" style="color:#e5484d;font-size:13px;display:none;margin-top:4px;"></p>

        <div class="form-actions">
          <a th:href="@{/cs/qna}" class="btn btn-outline">취소</a>
          <button type="button" class="btn btn-primary" id="submitBtn" onclick="submitInquiry()">문의 등록</button>
        </div>
      </form>

    </div>
  </main>
</div>

<!-- CS-MODAL-01 : 문의 등록 완료 -->
<div class="cs-modal-overlay" id="completeModalOverlay">
  <div class="cs-modal">
    <div class="cs-modal-icon success">✓</div>
    <p class="cs-modal-title">문의가 등록되었습니다</p>
    <p class="cs-modal-desc">문의가 정상적으로 등록되었습니다.<br />답변 상태는 1:1 문의 목록에서 확인할 수 있습니다.</p>
    <div class="cs-modal-actions">
      <button type="button" class="btn btn-primary" style="flex:none;padding:10px 24px;" onclick="goToList()">문의 목록 확인</button>
    </div>
  </div>
</div>

<style>
  .cs-modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(15,20,32,0.55);
    align-items:center;justify-content:center;z-index:200;
  }
  .cs-modal-overlay.open{display:flex;}
  .cs-modal{
    background:#fff;border-radius:14px;width:360px;max-width:88vw;
    padding:32px 26px 24px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.18);
  }
  .cs-modal-icon{
    width:44px;height:44px;border-radius:50%;margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;
  }
  .cs-modal-icon.warning{background:#fdeceb;color:#e5484d;}
  .cs-modal-icon.success{background:#e6f7ee;color:#1eaa6f;}
  .cs-modal-title{font-size:17px;font-weight:700;margin:0 0 10px;color:#1b1f27;}
  .cs-modal-desc{font-size:13.5px;line-height:1.6;color:#666f80;margin:0 0 22px;}
  .cs-modal-actions{display:flex;gap:8px;justify-content:center;}
  .cs-modal-actions .btn{padding:10px 0;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;}
  .cs-modal-actions .btn-primary{background:#1eaa6f;color:#fff;}
</style>

<footer th:replace="~{common/footer :: footer}"></footer>
<script th:src="@{/js/common.js}"></script>
<script th:inline="javascript">
  const CREATE_URL = /*[[@{/cs/qna}]]*/ '/cs/qna';
  const LIST_URL = /*[[@{/cs/qna}]]*/ '/cs/qna';

  document.getElementById('contentInput').addEventListener('input', (e) => {
    document.getElementById('charCount').textContent = `${e.target.value.length} / 1,000`;
  });

  function showWriteError(msg) {
    const err = document.getElementById('writeError');
    err.textContent = msg;
    err.style.display = 'block';
  }

  function clearWriteError() {
    const err = document.getElementById('writeError');
    err.style.display = 'none';
    err.textContent = '';
  }

  async function submitInquiry() {
    clearWriteError();

    const categoryId = document.getElementById('categoryId').value;
    const title = document.getElementById('titleInput').value.trim();
    const content = document.getElementById('contentInput').value.trim();

    if (!categoryId) { showWriteError('문의 유형을 선택해주세요.'); return; }
    if (!title) { showWriteError('제목을 입력해주세요.'); return; }
    if (!content) { showWriteError('문의 내용을 입력해주세요.'); return; }

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;

    try {
      const res = await fetch(CREATE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ categoryId, title, content })
      });

      if (res.status === 401) {
        // 세션 만료 등으로 로그인이 풀린 경우
        location.href = `/auth/login?redirectUrl=${encodeURIComponent(location.pathname)}`;
        return;
      }

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        showWriteError(err.message || '문의 등록 중 오류가 발생했습니다.');
        submitBtn.disabled = false;
        return;
      }

      document.getElementById('completeModalOverlay').classList.add('open');
    } catch (e) {
      showWriteError('문의 등록 중 오류가 발생했습니다.');
      submitBtn.disabled = false;
    }
  }

  function goToList() {
    location.href = LIST_URL;
  }
  // 등록 완료 모달은 배경 클릭으로 닫히지 않도록 별도 리스너를 두지 않습니다.
</script>
</body></html>
