<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>1:1 문의 작성 | 첫출근 고객센터</title>
<link rel="stylesheet" th:href="@{/css/cs/user-common.css}" />
<link rel="stylesheet" th:href="@{/css/common.css}" />
</head>
<body>
<header th:replace="~{common/header :: header}"></header>
<div class="cs-page">
<section class="hero">
  <div class="wrap">
    <p class="eyebrow">FIRST DAY HELP CENTER</p>
    <h1>고객센터</h1>
    <p>필요한 도움을 빠르고 편하게 확인하세요.</p>
  </div>
</section>

<main class="content-shell">
  <div class="wrap">

    <nav class="tabs">
      <a class="tab" th:href="@{/cs/notice}">공지사항</a>
      <a class="tab" th:href="@{/cs/faq}">자주 묻는 질문</a>
      <a class="tab active" th:href="@{/cs/qna}">1:1 문의</a>
    </nav>

    <div class="panel-head">
      <h2>1:1 문의 작성</h2>
    </div>

    <p class="required-note">* 필수 입력 항목</p>

    <form class="form-card" onsubmit="return false;">
      <div class="form-row">
        <label>문의 유형 <span class="req">*</span></label>
        <select class="form-control">
          <option value="">문의 유형을 선택해주세요.</option>
          <option>회원·계정</option>
          <option>채용공고</option>
          <option>지원·이력서</option>
          <option>기업서비스</option>
          <option>신고·기타</option>
        </select>
      </div>

      <div class="form-row">
        <label>제목 <span class="req">*</span></label>
        <input type="text" class="form-control" maxlength="100" placeholder="문의 제목을 입력해주세요. (최대 100자)" />
      </div>

      <div class="form-row">
        <label>문의 내용 <span class="req">*</span></label>
        <textarea class="form-control" data-maxlength="1000" maxlength="1000" placeholder="문의 내용을 자세히 입력해주세요."></textarea>
        <p class="char-count">0 / 1,000</p>
      </div>

      <div class="form-row">
        <label>첨부파일</label>
        <div class="upload-box">
          <button type="button" class="upload-btn">+ 파일 선택</button>
          <span class="upload-hint">JPG, PNG, PDF · 파일당 최대 10MB · 최대 3개</span>
        </div>
        <div class="file-chip">
          <div class="file-left">
            <span>🖼️</span>
            <span>error-screen.png</span>
            <span class="file-meta">2.4MB · 삭제 1/3</span>
          </div>
          <span class="remove">× 삭제</span>
        </div>
      </div>

      <div class="form-actions">
        <a th:href="@{/cs/qna}" class="btn btn-outline">취소</a>
        <a th:href="@{/cs/qna/detail}" class="btn btn-primary">문의 등록</a>
      </div>
    </form>

  </div>
</main>
</div>
<footer th:replace="~{common/footer :: footer}"></footer>
<script th:src="@{/js/common.js}"></script>
</body></html>
