<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1:1 문의 목록 | 첫출근 고객센터</title>
  <link rel="stylesheet" th:href="@{/css/cs/user-common.css}" />
  <link rel="stylesheet" th:href="@{/css/common.css}" />
</head>
<body>
<header th:replace="~{common/header :: header}"></header>
<div class="cs-page">
  <section class="hero">
    <div class="wrap">
      <p class="eyebrow">FIRST DAY HELP CENTER</p>
      <h1>고객센터</h1>
      <p>필요한 도움을 빠르고 편하게 확인하세요.</p>
    </div>
  </section>

  <main class="content-shell">
    <div class="wrap">

      <nav class="tabs">
        <a class="tab" th:href="@{/cs/notice}">공지사항</a>
        <a class="tab" th:href="@{/cs/faq}">자주 묻는 질문</a>
        <a class="tab active" th:href="@{/cs/qna}">1:1 문의</a>
      </nav>

      <div class="panel-head" style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <h2>1:1 문의</h2>
          <p class="panel-desc">내가 등록한 문의와 답변 상태를 확인할 수 있습니다.</p>
        </div>
        <button type="button" class="btn btn-primary" onclick="handleWriteClick()">+ 문의하기</button>
      </div>

      <div class="qna-toolbar" style="display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px;">
        <p class="total-count" style="margin:0;">전체 <span th:text="${totalCount}">0</span>건</p>

        <form method="get" th:action="@{/cs/qna}" style="display:flex;gap:8px;">
          <select name="status" onchange="this.form.submit()">
            <option value="" th:selected="${status == null or status == ''}">전체</option>
            <option value="PENDING" th:selected="${status == 'PENDING'}">답변대기</option>
            <option value="ANSWERED" th:selected="${status == 'ANSWERED'}">답변완료</option>
          </select>
        </form>
      </div>

      <div class="qna-list">
        <p th:if="${#lists.isEmpty(inquiries)}" class="empty-state" style="text-align:center;color:var(--gray-500,#8a94a6);padding:60px 0;">
          등록된 문의가 없습니다.
        </p>

        <a class="qna-item" th:each="inq : ${inquiries}"
           th:href="@{/cs/qna/detail(inquiryId=${inq.inquiryId})}"
           style="display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border,#e7e9ee);text-decoration:none;color:inherit;">
          <div>
            <p class="qna-category" style="margin:0 0 6px;font-size:13px;color:var(--gray-500,#8a94a6);" th:text="${inq.categoryName}">지원·이력서</p>
            <p class="qna-title" style="margin:0;font-size:15px;font-weight:600;" th:text="${inq.title}">문의 제목</p>
          </div>
          <div style="display:flex;align-items:center;gap:20px;">
          <span class="badge" th:if="${inq.status == '답변완료'}"
                style="background:#e6f7ee;color:#1eaa6f;padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:600;"
                th:text="${inq.statusLabel}">답변완료</span>
            <span class="badge" th:unless="${inq.status == '답변완료'}"
                  style="background:#fff4e5;color:#d98a1a;padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:600;"
                  th:text="${inq.statusLabel}">답변대기</span>
            <span class="qna-date" style="font-size:13px;color:var(--gray-500,#8a94a6);" th:text="${inq.createdAt}">2026.08.03</span>
          </div>
        </a>
      </div>

      <div class="pagination" th:if="${totalPages > 1}" style="display:flex;justify-content:center;gap:6px;margin-top:24px;">
        <a th:each="p : ${#numbers.sequence(0, totalPages - 1)}"
           th:href="@{/cs/qna(page=${p}, status=${status})}"
           th:text="${p + 1}"
           th:classappend="${p == currentPage} ? 'current' : ''"></a>
      </div>

      <p class="cs-notice" style="text-align:center;color:var(--gray-500,#8a94a6);font-size:12.5px;margin-top:30px;">
        ※ 개인회원·기업회원 모두 이용 가능하며, 로그인한 본인의 문의만 확인할 수 있습니다.
      </p>

    </div>
  </main>
</div>

<!-- 로그인 필요 모달 -->
<div class="cs-modal-overlay" id="loginModalOverlay">
  <div class="cs-modal">
    <div class="cs-modal-icon warning">!</div>
    <p class="cs-modal-title">로그인이 필요한 서비스입니다</p>
    <p class="cs-modal-desc">1:1 문의는 로그인 후 이용할 수 있어요.<br />개인회원·기업회원 모두 문의를 남길 수 있습니다.</p>
    <div class="cs-modal-actions">
      <button type="button" class="btn btn-outline" onclick="closeLoginModal()">취소</button>
      <button type="button" class="btn btn-primary" onclick="goToLogin()">로그인하기</button>
    </div>
  </div>
</div>

<style>
  .cs-modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(15,20,32,0.55);
    align-items:center;justify-content:center;z-index:200;
  }
  .cs-modal-overlay.open{display:flex;}
  .cs-modal{
    background:#fff;border-radius:14px;width:360px;max-width:88vw;
    padding:32px 26px 24px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.18);
  }
  .cs-modal-icon{
    width:44px;height:44px;border-radius:50%;margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;
  }
  .cs-modal-icon.warning{background:#fdeceb;color:#e5484d;}
  .cs-modal-icon.success{background:#e6f7ee;color:#1eaa6f;}
  .cs-modal-title{font-size:17px;font-weight:700;margin:0 0 10px;color:#1b1f27;}
  .cs-modal-desc{font-size:13.5px;line-height:1.6;color:#666f80;margin:0 0 22px;}
  .cs-modal-actions{display:flex;gap:8px;justify-content:center;}
  .cs-modal-actions .btn{flex:1;padding:10px 0;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;}
  .cs-modal-actions .btn-outline{background:#fff;border:1px solid #e2e5ea;color:#444b58;}
  .cs-modal-actions .btn-primary{background:#1eaa6f;color:#fff;}
</style>

<footer th:replace="~{common/footer :: footer}"></footer>
<script th:src="@{/js/common.js}"></script>
<script th:inline="javascript">
  const IS_LOGGED_IN = /*[[${loggedIn}]]*/ false;
  const WRITE_URL = /*[[@{/cs/qna/write}]]*/ '/cs/qna/write';
  const LOGIN_URL = /*[[@{/auth/login}]]*/ '/auth/login';

  function handleWriteClick() {
    if (IS_LOGGED_IN) {
      location.href = WRITE_URL;
    } else {
      document.getElementById('loginModalOverlay').classList.add('open');
    }
  }

  function closeLoginModal() {
    document.getElementById('loginModalOverlay').classList.remove('open');
  }

  function goToLogin() {
    location.href = `${LOGIN_URL}?redirectUrl=${encodeURIComponent(WRITE_URL)}`;
  }

  document.getElementById('loginModalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'loginModalOverlay') closeLoginModal();
  });
</script>
</body></html>
