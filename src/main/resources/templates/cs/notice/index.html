<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공지사항 | 첫출근 고객센터</title>
  <link rel="stylesheet" th:href="@{/css/cs/user-common.css}" />
  <link rel="stylesheet" th:href="@{/css/common.css}" />
</head>
<body>
<header th:replace="~{common/header :: header}"></header>
<div class="cs-page">
  <section class="hero">
    <div class="wrap">
      <p class="eyebrow">FIRST DAY HELP CENTER</p>
      <h1>고객센터</h1>
      <p>필요한 도움을 빠르고 편하게 확인하세요.</p>
    </div>
  </section>

  <main class="content-shell">
    <div class="wrap">

      <nav class="tabs">
        <a class="tab active" th:href="@{/cs/notice}">공지사항</a>
        <a class="tab" th:href="@{/cs/faq}">자주 묻는 질문</a>
        <a class="tab" th:href="@{/cs/qna}">1:1 문의</a>
      </nav>

      <div class="panel-head">
        <div>
          <h2>공지사항</h2>
          <p class="desc">첫출근의 새로운 소식과 서비스 안내를 전해드립니다.</p>
        </div>
        <form class="panel-tools" th:action="@{/cs/notice}" method="get">
          <div class="search-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" name="keyword" th:value="${keyword}" placeholder="제목을 검색해보세요" />
          </div>
        </form>
      </div>

      <table class="list-table">
        <thead>
        <tr>
          <th class="col-num">번호</th>
          <th>제목</th>
          <th class="col-date">등록일</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="notice : ${noticeList}" th:onclick="|location.href='@{/cs/notice/detail(id=${notice.noticeId})}'|">
          <td class="col-num">
            <span th:if="${notice.isPinned}" class="badge badge-pin">고정</span>
            <span th:unless="${notice.isPinned}" th:text="${notice.noticeId}">13</span>
          </td>
          <td class="title-cell"><a th:href="@{/cs/notice/detail(id=${notice.noticeId})}" th:text="${notice.title}">제목</a></td>
          <td class="col-date" th:text="${notice.createdAtText}">2026.07.18</td>
        </tr>
        <tr th:if="${#lists.isEmpty(noticeList)}">
          <td colspan="3" style="text-align:center;">등록된 공지사항이 없습니다.</td>
        </tr>
        </tbody>
      </table>

      <div class="pagination">
        <a th:if="${currentPage > 1}" th:href="@{/cs/notice(page=${currentPage - 1}, keyword=${keyword})}">‹</a>
        <a th:each="p : ${#numbers.sequence(1, noticePage.totalPages)}"
           th:classappend="${p == currentPage} ? 'current' : ''"
           th:href="@{/cs/notice(page=${p}, keyword=${keyword})}"
           th:text="${p}">1</a>
        <a th:if="${currentPage < noticePage.totalPages}" th:href="@{/cs/notice(page=${currentPage + 1}, keyword=${keyword})}">›</a>
      </div>

    </div>
  </main>
</div>
<footer th:replace="~{common/footer :: footer}"></footer>
<script th:src="@{/js/common.js}"></script>
</body></html>
