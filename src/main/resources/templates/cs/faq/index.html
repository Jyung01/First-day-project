<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자주 묻는 질문 | 첫출근 고객센터</title>
  <link rel="stylesheet" th:href="@{/css/cs/user-common.css}" />
  <link rel="stylesheet" th:href="@{/css/common.css}" />
</head>
<body>
<header th:replace="~{common/header :: header}"></header>
<div class="cs-page">
  <section class="hero">
    <div class="wrap">
      <p class="eyebrow">FIRST DAY HELP CENTER</p>
      <h1>고객센터</h1>
      <p>필요한 도움을 빠르고 편하게 확인하세요.</p>
    </div>
  </section>

  <main class="content-shell">
    <div class="wrap">

      <nav class="tabs">
        <a class="tab" th:href="@{/cs/notice}">공지사항</a>
        <a class="tab active" th:href="@{/cs/faq}">자주 묻는 질문</a>
        <a class="tab" th:href="@{/cs/qna}">1:1 문의</a>
      </nav>

      <div class="panel-head">
        <div>
          <h2>자주 묻는 질문</h2>
          <p class="desc">궁금한 내용을 검색하거나 분야별로 확인하세요.</p>
        </div>
      </div>

      <div class="search-box" style="max-width:100%;margin-bottom:4px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="faqSearchInput" placeholder="궁금한 내용을 입력해보세요." />
      </div>

      <div class="category-pills" id="categoryPills">
        <button class="pill active" data-category="">전체</button>
      </div>

      <div class="faq-list" id="faqList">
        <p class="empty-row">불러오는 중...</p>
      </div>

    </div>
  </main>
</div>
<footer th:replace="~{common/footer :: footer}"></footer>
<script th:src="@{/js/common.js}"></script>
<script th:inline="javascript">
  (function () {
    const API_BASE = /*[[@{/cs/faq}]]*/ '/cs/faq';

    let selectedCategoryId = '';
    let searchTimer = null;

    const el = {
      pills: document.getElementById('categoryPills'),
      list: document.getElementById('faqList'),
      search: document.getElementById('faqSearchInput'),
    };

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function loadCategories() {
      const res = await fetch(`${API_BASE}/api/categories`);
      const categories = await res.json();
      el.pills.innerHTML = '<button class="pill active" data-category="">전체</button>' +
              categories.map(c => `<button class="pill" data-category="${c.faqCategoryId}">${escapeHtml(c.categoryName)}</button>`).join('');
    }

    async function loadList() {
      const params = new URLSearchParams();
      if (selectedCategoryId) params.set('categoryId', selectedCategoryId);
      if (el.search.value.trim()) params.set('keyword', el.search.value.trim());

      el.list.innerHTML = '<p class="empty-row">불러오는 중...</p>';

      const res = await fetch(`${API_BASE}/api/list?${params.toString()}`);
      const items = await res.json();
      renderList(items);
    }

    function renderList(items) {
      if (!items || items.length === 0) {
        el.list.innerHTML = '<p class="empty-row">조건에 맞는 FAQ가 없습니다.</p>';
        return;
      }
      el.list.innerHTML = items.map((item, idx) => `
            <div class="faq-item${idx === 0 ? ' open' : ''}" data-id="${item.faqId}">
                <div class="faq-q">
                    <span class="q-badge">Q</span>
                    <span class="cat-tag">${escapeHtml(item.categoryName || '-')}</span>
                    <span>${escapeHtml(item.question)}</span>
                    <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <div class="faq-a">
                    <span class="a-badge">A</span>
                    <p>${escapeHtml(item.answer)}</p>
                </div>
            </div>
        `).join('');
    }

    el.pills.addEventListener('click', (e) => {
      const btn = e.target.closest('.pill');
      if (!btn) return;
      el.pills.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      selectedCategoryId = btn.dataset.category;
      loadList();
    });

    el.search.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(loadList, 300);
    });

    el.list.addEventListener('click', (e) => {
      const q = e.target.closest('.faq-q');
      if (!q) return;
      q.closest('.faq-item').classList.toggle('open');
    });

    (async function init() {
      await loadCategories();
      await loadList();
    })();
  })();
</script>
</body></html>
