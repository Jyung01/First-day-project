<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>비밀번호 재설정 | 첫출근</title>

    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <link rel="stylesheet" th:href="@{/css/auth/common.css}" />
    <link rel="stylesheet" th:href="@{/css/auth/account.css}" />
    <link rel="stylesheet" th:href="@{/css/modal/common.css}" />
</head>

<body>
<!-- 공통 헤더 -->
<header th:replace="~{common/header :: header}"></header>

<main class="auth-main account-main">
    <div class="auth-container account-container">
        <section class="auth-card account-card account-card-reset">
            <div class="auth-card-header account-header">
                <h1 class="auth-title">비밀번호 재설정</h1>

                <p class="auth-description">
                    본인 확인 후 새로운 비밀번호를 설정해주세요.
                </p>
            </div>

            <form
                    class="account-form"
                    data-reset-password-form
                    novalidate
            >
                <!-- 아이디 -->
                <div class="auth-field">
                    <label for="resetMemberId" class="auth-label">
                        아이디
                    </label>

                    <input
                            type="text"
                            id="resetMemberId"
                            name="memberId"
                            class="auth-input"
                            placeholder="아이디를 입력해주세요"
                            autocomplete="username"
                            required
                            data-reset-id
                    />
                </div>

                <!-- 이메일 -->
                <div class="auth-field">
                    <label for="resetEmail" class="auth-label">
                        이메일
                    </label>

                    <div class="account-input-action">
                        <input
                                type="email"
                                id="resetEmail"
                                name="email"
                                class="auth-input"
                                placeholder="example@email.com"
                                autocomplete="email"
                                required
                                data-reset-email
                        />

                        <button
                                type="button"
                                class="account-outline-button"
                                data-send-reset-code
                        >
                            인증번호 받기
                        </button>
                    </div>
                </div>

                <!-- 인증번호 -->
                <div class="auth-field">
                    <label for="resetCode" class="auth-label">
                        인증번호
                    </label>

                    <div class="account-input-action">
                        <input
                                type="text"
                                id="resetCode"
                                class="auth-input"
                                placeholder="6자리 인증번호"
                                maxlength="6"
                                inputmode="numeric"
                                data-reset-code
                                disabled
                        />

                        <button
                                type="button"
                                class="account-outline-button"
                                data-verify-reset-code
                                disabled
                        >
                            인증 확인
                        </button>
                    </div>
                </div>

                <p
                        class="account-message"
                        data-reset-email-message
                        aria-live="polite"
                ></p>

                <!-- 새 비밀번호 -->
                <div class="auth-field">
                    <label for="newPassword" class="auth-label">
                        새 비밀번호
                    </label>

                    <div class="account-password-wrap">
                        <input
                                type="password"
                                id="newPassword"
                                name="newPassword"
                                class="auth-input"
                                placeholder="영문·숫자·특수문자 조합 8자 이상"
                                minlength="8"
                                autocomplete="new-password"
                                required
                                data-new-password
                                disabled
                        />

                        <button
                                type="button"
                                class="account-password-toggle"
                                data-password-toggle
                                data-target="newPassword"
                        >
                            보기
                        </button>
                    </div>
                </div>

                <!-- 새 비밀번호 확인 -->
                <div class="auth-field">
                    <label for="newPasswordConfirm" class="auth-label">
                        새 비밀번호 확인
                    </label>

                    <div class="account-password-wrap">
                        <input
                                type="password"
                                id="newPasswordConfirm"
                                class="auth-input"
                                placeholder="비밀번호를 다시 입력해주세요"
                                minlength="8"
                                autocomplete="new-password"
                                required
                                data-new-password-confirm
                                disabled
                        />

                        <button
                                type="button"
                                class="account-password-toggle"
                                data-password-toggle
                                data-target="newPasswordConfirm"
                        >
                            보기
                        </button>
                    </div>
                </div>

                <p
                        class="account-message"
                        data-reset-password-message
                        aria-live="polite"
                ></p>

                <button
                        type="submit"
                        class="auth-primary-button account-submit-button"
                        disabled
                >
                    비밀번호 변경
                </button>
            </form>
        </section>
    </div>
</main>

<!-- 공통 푸터 -->
<footer th:replace="~{common/footer :: footer}"></footer>

<!-- 공통 확인 모달 -->
<div th:replace="~{modal/common/confirm-modal :: confirmModal}"></div>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/modal.js}"></script>
<script th:src="@{/js/auth/account.js}"></script>
</body>
</html>
