<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>로그인 | 첫출근</title>

        <!-- 사이트 전체 공통 CSS -->
        <link rel="stylesheet" th:href="@{/css/common.css}" />

        <!-- 로그인·회원가입 공통 CSS -->
        <link rel="stylesheet" th:href="@{/css/auth/common.css}" />

        <!-- 로그인 페이지 전용 CSS -->
        <link rel="stylesheet" th:href="@{/css/auth/login.css}" />

        <link rel="stylesheet" th:href="@{/css/modal/common.css}" />
    </head>

    <body>
        <!-- 공통 헤더 -->
        <header th:replace="~{common/header :: header}"></header>

        <main class="auth-main">
            <div class="auth-container login-container">
                <!-- 왼쪽 안내 영역 -->
                <section class="login-intro">
                    <div class="login-intro-content">
                        <h1 class="login-intro-title">
                            설레는 첫 출근을<br />
                            함께 준비해요
                        </h1>

                        <p class="login-intro-description">
                            채용공고 탐색부터 이력서와<br />
                            자기소개서 관리까지 한곳에서 시작하세요.
                        </p>
                    </div>
                </section>

                <!-- 오른쪽 로그인 영역 -->
                <section class="auth-card login-card">
                    <div class="auth-card-header">
                        <h2 class="auth-title">로그인</h2>
                        <p class="auth-description">첫출근 계정으로 서비스를 이용해보세요.</p>
                    </div>

                    <!-- 로그인 폼 -->
                    <form class="auth-form login-form" th:action="@{/login}" method="post">
                        <!-- 로그인 후 돌아갈 주소 -->
                        <input type="hidden"
                               name="returnUrl"
                               th:value="${param.returnUrl}" />

                        <!-- 아이디 -->
                        <div class="auth-field">
                            <label for="username" class="auth-label"> 아이디 </label>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                class="auth-input"
                                placeholder="아이디를 입력해주세요."
                                autocomplete="username"
                                required
                            />
                        </div>

                        <!-- 비밀번호 -->
                        <div class="auth-field">
                            <label for="password" class="auth-label"> 비밀번호 </label>

                            <div class="password-input-wrap">
                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="auth-input password-input"
                                    placeholder="비밀번호를 입력해주세요."
                                    autocomplete="current-password"
                                    required
                                />

                                <button
                                    type="button"
                                    class="password-toggle"
                                    id="passwordToggle"
                                    aria-label="비밀번호 표시"
                                >
                                    보기
                                </button>
                            </div>

                            <!-- 로그인 실패 메시지 -->
                            <p class="auth-error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>
                        </div>

                        <!-- 로그인 유지 / 계정 찾기 -->
                        <div class="login-options">
                            <label class="auth-checkbox">
                                <input type="checkbox" name="remember-me" class="auth-checkbox-input" />

                                <span class="auth-checkbox-box"></span>
                                <span class="auth-checkbox-text"> 로그인 상태 유지 </span>
                            </label>

                            <div class="login-find-links">
                                <a th:href="@{/auth/find-id}"> 아이디 찾기 </a>

                                <span class="login-link-divider">·</span>

                                <a th:href="@{/auth/reset-password}"> 비밀번호 재설정 </a>
                            </div>
                        </div>

                        <!-- 로그인 버튼 -->
                        <button type="submit" class="auth-primary-button">로그인</button>
                    </form>

                    <!-- 회원가입 이동 -->
                    <div class="login-signup">
                        <span>아직 회원이 아니신가요?</span>

                        <a th:href="@{/auth/member-type}" class="login-signup-link"> 회원가입 </a>
                    </div>
                </section>
            </div>
        </main>

        <!-- 공통 푸터 -->
        <footer th:replace="~{common/footer :: footer}"></footer>

        <!-- 공통 확인 모달 -->
        <div th:replace="~{modal/common/confirm-modal :: confirmModal}"></div>

        <script th:src="@{/js/modal.js}"></script>

        <!-- 공통 헤더·푸터 JS -->
        <script th:src="@{/js/common.js}"></script>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const passwordInput = document.getElementById("password");
                const passwordToggle = document.getElementById("passwordToggle");

                // 비밀번호 보기
                passwordToggle.addEventListener("click", function () {
                    const isPassword = passwordInput.type === "password";

                    passwordInput.type = isPassword ? "text" : "password";
                    passwordToggle.textContent = isPassword ? "숨기기" : "보기";
                    passwordToggle.setAttribute("aria-label", isPassword ? "비밀번호 숨기기" : "비밀번호 표시");
                });

                function showRestrictedAccountModal() {
                    showConfirmModal({
                        iconClass: "danger",
                        iconHtml: "!",

                        title: "이용이 제한된 계정입니다",
                        message:
                            "관리자에 의해 이용이 제한된 계정입니다.\n자세한 내용은 고객센터에 문의해주세요.",

                        leftText: "닫기",
                        rightText: "고객센터",

                        leftClass: "btn-outline",
                        rightClass: "btn-primary",

                        onLeft: function () {
                            // 모달만 닫기
                        },

                        onRight: function () {
                            window.location.href = "/cs/notice";
                        }
                    });
                }

                function showWithdrawnAccountModal() {
                    showConfirmModal({
                        iconClass: "success",
                        iconHtml: "✓",
                        title: "기업회원 탈퇴가 완료되었습니다",
                        message:
                            "모집 중 공고가 마감되고 계정이 안전하게 탈퇴 처리되었습니다.",
                        leftVisible: false,
                        rightText: "확인",
                        rightClass: "btn-primary"
                    });
                }

                function showPendingCompanyApprovalModal() {
                    showConfirmModal({
                        iconClass: "warning",
                        iconHtml: "!",
                        title: "기업회원 승인 대기 중입니다",
                        message:
                            "관리자 승인 완료 후 기업회원으로 로그인할 수 있습니다.\n승인 처리까지 잠시만 기다려주세요.",
                        leftVisible: false,
                        rightText: "확인",
                        rightClass: "btn-primary"
                    });
                }

                function showCompanyReapplyCompletedModal() {
                    showConfirmModal({
                        iconClass: "success",
                        iconHtml: "✓",
                        title: "재심사 요청이 완료되었습니다",
                        message:
                            "수정한 기업정보가 관리자에게 제출되었습니다.\n심사가 완료될 때까지 기업회원 로그인이 제한됩니다.",
                        leftVisible: false,
                        rightText: "확인",
                        rightClass: "btn-primary"
                    });
                }

                const queryParameters = new URLSearchParams(window.location.search);
                const companyApproval = queryParameters.get("companyApproval");
                const accountStatus = queryParameters.get("accountStatus");
                if (accountStatus === "withdrawn") {
                    showWithdrawnAccountModal();
                    queryParameters.delete("accountStatus");
                    const queryString = queryParameters.toString();
                    history.replaceState(
                        null,
                        "",
                        window.location.pathname + (queryString ? "?" + queryString : "")
                    );
                } else if (accountStatus === "restricted") {
                    showRestrictedAccountModal();
                    queryParameters.delete("accountStatus");
                    const queryString = queryParameters.toString();
                    history.replaceState(
                        null,
                        "",
                        window.location.pathname + (queryString ? "?" + queryString : "")
                    );
                } else if (companyApproval === "reapplied") {
                    showCompanyReapplyCompletedModal();
                    queryParameters.delete("companyApproval");
                    const queryString = queryParameters.toString();
                    history.replaceState(
                        null,
                        "",
                        window.location.pathname + (queryString ? "?" + queryString : "")
                    );
                } else if (companyApproval === "pending") {
                    showPendingCompanyApprovalModal();
                    queryParameters.delete("companyApproval");
                    const queryString = queryParameters.toString();
                    history.replaceState(
                        null,
                        "",
                        window.location.pathname + (queryString ? "?" + queryString : "")
                    );
                }
            });
        </script>
    </body>
</html>
