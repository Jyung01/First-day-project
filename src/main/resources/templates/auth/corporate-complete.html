<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>기업회원 가입 완료 | 첫출근</title>

    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <link rel="stylesheet" th:href="@{/css/auth/common.css}" />
    <link rel="stylesheet" th:href="@{/css/auth/complete.css}" />
</head>

<body>
<!-- 공통 헤더 -->
<header th:replace="~{common/header :: header}"></header>

<main class="auth-main complete-main">
    <div class="auth-container complete-container">
        <section class="auth-card complete-card">
            <!-- 완료 아이콘 -->
            <div class="complete-icon" aria-hidden="true">
                <span class="complete-check">✓</span>
            </div>

            <!--
              가입 단계에서 받는 값은 사업자번호·기업명·업종·규모·주소뿐이다.
              나머지 기업정보를 채우고 직접 심사를 요청해야 관리자 심사가 시작되므로,
              "승인만 기다리면 된다"고 읽히지 않도록 다음에 할 일을 안내한다.
            -->
            <!-- 완료 문구 -->
            <div class="complete-header">
                <h1 class="complete-title">
                    기업회원 가입 완료
                </h1>

                <p class="complete-description">
                    계정이 생성되었습니다.<br />
                    로그인해 기업정보를 입력한 뒤 심사를 요청해주세요.
                </p>
            </div>

            <!-- 다음 단계 -->
            <div class="complete-guide">
                <strong class="complete-guide-title">
                    다음 단계
                </strong>

                <p class="complete-guide-description">
                    로그인 → 기업정보 입력 후 저장 → 심사 요청
                </p>

                <p class="complete-guide-description">
                    심사를 요청해야 관리자 승인이 시작됩니다.
                    심사 중에는 기업정보를 수정할 수 없고 로그인이 제한됩니다.
                </p>
            </div>

            <!-- 로그인 이동 -->
            <div class="complete-actions">
                <a
                        th:href="@{/auth/login}"
                        class="complete-button complete-button-primary"
                >
                    로그인하고 기업정보 입력하기
                </a>
            </div>
        </section>
    </div>
</main>

<!-- 공통 푸터 -->
<footer th:replace="~{common/footer :: footer}"></footer>

<script th:src="@{/js/common.js}"></script>
</body>
</html>
