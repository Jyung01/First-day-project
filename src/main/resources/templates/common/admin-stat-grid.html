<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  고객센터 관리(공지사항/FAQ/1:1 문의) 3개 화면에서 공통으로 쓰는 상단 통계 카드.
  각 컨트롤러가 pendingCount, noticeCount, faqCount 세 값을 모두 model에 담아 넘겨야 한다.
  (하나라도 안 담으면 이 fragment에서 바로 빈 값/에러로 드러나므로, 예전처럼
  페이지마다 숫자가 하드코딩된 채 방치되는 걸 방지하기 위해 fragment로 통일함)
-->
<div th:fragment="statGrid(pendingCount, noticeCount, faqCount)" class="stat-grid">
    <div class="stat-card">
        <div class="label">미답변 문의</div>
        <div class="value" th:text="${pendingCount} + '건'">7건</div>
    </div>
    <div class="stat-card orange">
        <div class="label">공지사항</div>
        <div class="value" th:text="${noticeCount} + '건'">24건</div>
    </div>
    <div class="stat-card green">
        <div class="label">FAQ</div>
        <div class="value" th:text="${faqCount} + '건'">38건</div>
    </div>
</div>
</body>
</html>
