<aside class="mypage-side" th:fragment="myAside">
    <div class="mypage-side__profile">
        <div class="mypage-side__avatar">
            <img
                th:if="${mySidebarProfileImageUrl != null}"
                th:src="${mySidebarProfileImageUrl}"
                alt=""
                onerror="this.hidden=true; this.nextElementSibling.hidden=false"
            />

            <span
                th:text="${#strings.isEmpty(mySidebarName) ? '김' : #strings.substring(mySidebarName, 0, 1)}"
                th:hidden="${mySidebarProfileImageUrl != null}"
            >
                김
            </span>
        </div>

        <div class="mypage-side__info">
            <p class="mypage-side__name">
                <span th:text="${#strings.isEmpty(mySidebarName) ? '김첫출' : mySidebarName}"> 김첫출 </span>
                &nbsp;님
            </p>

            <p class="mypage-side__type" th:text="${#strings.isEmpty(memberType) ? '개인회원' : memberType}">
                개인회원
            </p>
        </div>
    </div>

    <nav class="mypage-side__nav">
        <a th:href="@{/my}" class="mypage-side__link" th:classappend="${activeMenu == 'home'} ? ' is-active' : ''">
            마이페이지 홈
        </a>

        <a
            th:href="@{/my/applications}"
            class="mypage-side__link"
            th:classappend="${activeMenu == 'applications'} ? ' is-active' : ''"
        >
            지원 내역
        </a>

        <a
            th:href="@{/my/saved-jobs}"
            class="mypage-side__link"
            th:classappend="${activeMenu == 'interestJobs'} ? ' is-active' : ''"
        >
            관심 공고
        </a>

        <a
            th:href="@{/my/saved-companies}"
            class="mypage-side__link"
            th:classappend="${activeMenu == 'interestCompanies'} ? ' is-active' : ''"
        >
            관심 기업
        </a>

        <a
            th:href="@{/my/resume}"
            class="mypage-side__link"
            th:classappend="${activeMenu == 'resumes'} ? ' is-active' : ''"
        >
            이력서 관리
        </a>

        <a
            th:href="@{/my/cover-letter}"
            class="mypage-side__link"
            th:classappend="${activeMenu == 'coverLetters'} ? ' is-active' : ''"
        >
            자기소개서 관리
        </a>

        <a
            th:href="@{/my/reviews}"
            class="mypage-side__link"
            th:classappend="${activeMenu == 'reviews'} ? ' is-active' : ''"
        >
            작성한 후기
        </a>

        <a
            th:href="@{/my/profile-edit}"
            class="mypage-side__link"
            th:classappend="${activeMenu == 'edit'} ? ' is-active' : ''"
        >
            개인정보 수정
        </a>
    </nav>
</aside>
