<header
        th:fragment="header"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        class="site-header">
    <div class="wrap header-inner">
        <a th:href="@{/}" class="header-logo" aria-label="첫출근 메인으로 이동">
            <img th:src="@{/images/header-logo.svg}" width="160" height="40"
                 alt="첫출근" class="header-logo__image"/>
        </a>

        <div class="mega-wrap" id="mega-wrap">
            <nav class="primary-nav">
                <button type="button" class="nav-hamburger" id="mega-btn"
                        aria-label="전체 메뉴 열기" aria-expanded="false" aria-controls="mega-panel">
                    <span class="hamburger-lines" aria-hidden="true">
                        <i></i><i></i><i></i>
                    </span>
                    <span class="hamburger-label">전체메뉴</span>
                </button>
                <a th:href="@{/job/list}" class="emph">채용공고</a>
                <a th:href="@{/company/list}">기업정보</a>
                <a th:href="@{/my/resume/list}">이력서</a>
                <a th:href="@{/salary/list}">연봉정보</a>
            </nav>

            <div class="mega-panel" id="mega-panel"
                 th:with="headerJobCategoryGroups=${@jobService.getActiveJobCategoryGroups()},
                          headerIndustryList=${@companyService.getIndustryList()},
                          headerCompanySizeList=${@companyService.getCompanySizeList()}">
                <div class="mega-service-grid">
                    <section class="mega-service-group">
                        <h3>채용공고 찾기</h3>
                        <a th:href="@{/job/list}">전체 채용공고</a>
                        <a th:href="@{/job/search(career='신입')}">신입 채용</a>
                        <a th:href="@{/job/search(career='경력')}">경력 채용</a>
                        <a th:href="@{/job/search(sort='deadline')}">마감 임박 공고</a>
                    </section>
                    <section class="mega-service-group">
                        <h3>기업 알아보기</h3>
                        <a th:href="@{/company/list}">전체 기업정보</a>
                        <a th:href="@{/my/saved-companies}">관심기업</a>
                        <div class="mega-company-filter" th:if="${!#lists.isEmpty(headerIndustryList)}">
                            <strong>업종별</strong>
                            <div>
                                <a th:each="industry : ${headerIndustryList}"
                                   th:href="@{/company/list(industry=${industry})}"
                                   th:text="${industry}">업종</a>
                            </div>
                        </div>
                        <div class="mega-company-filter" th:if="${!#lists.isEmpty(headerCompanySizeList)}">
                            <strong>기업 규모별</strong>
                            <div>
                                <a th:each="companySize : ${headerCompanySizeList}"
                                   th:href="@{/company/list(companySize=${companySize})}"
                                   th:text="${companySize}">기업 규모</a>
                            </div>
                        </div>
                    </section>
                    <section class="mega-service-group">
                        <h3>취업 준비</h3>
                        <a th:href="@{/my/resume/list}">이력서 관리</a>
                        <a th:href="@{/my/resume/form}">새 이력서 작성</a>
                        <a th:href="@{/salary/list}">연봉 비교</a>
                    </section>
                    <section class="mega-service-group">
                        <h3>나의 활동</h3>
                        <a th:href="@{/my/applications}">지원 현황</a>
                        <a th:href="@{/my/saved-jobs}">관심공고</a>
                        <a th:href="@{/my/saved-companies}">관심기업</a>
                        <a th:href="@{/my/reviews}">내가 작성한 후기</a>
                    </section>
                </div>

                <div class="mega-category-section">
                    <div class="mega-category-head">
                        <div>
                            <h3>직무별 채용공고</h3>
                            <p>직무를 선택하면 해당 카테고리의 공고만 모아볼 수 있어요.</p>
                        </div>
                        <a class="mega-all-jobs" th:href="@{/job/list}">전체 공고 보기</a>
                    </div>
                    <div class="mega-category-groups">
                        <section class="mega-category-group" th:each="group : ${headerJobCategoryGroups}">
                            <a class="mega-parent-category"
                               th:href="@{/job/search(parentCategoryId=${group.jobCategoryId})}"
                               th:text="${group.categoryName}">직군</a>
                            <div class="mega-child-categories">
                                <a th:each="child : ${group.children}"
                                   th:href="@{/job/search(categoryId=${child.jobCategoryId})}"
                                   th:text="${child.categoryName}">직무</a>
                            </div>
                        </section>
                    </div>
                    <p class="mega-category-empty" th:if="${#lists.isEmpty(headerJobCategoryGroups)}">
                        현재 사용 가능한 직무 카테고리가 없습니다.
                    </p>
                </div>
            </div>
        </div>

        <div class="header-right" aria-label="회원 메뉴" sec:authorize="isAnonymous()">
            <a th:href="@{/auth/login}" class="btn btn-ghost">로그인</a>
            <a th:href="@{/auth/member-type}" class="btn btn-primary">회원가입</a>
        </div>

        <div class="header-right" aria-label="회원 메뉴" sec:authorize="isAuthenticated()">
            <span class="header-user-name">
                <strong th:text="${#authentication.principal instanceof T(kr.co.firstdayproject.security.CustomUserDetails)
                    ? #authentication.principal.displayName : #authentication.name}">회원</strong>님
            </span>
            <form class="header-logout-form" th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-ghost">로그아웃</button>
            </form>
            <a sec:authorize="hasRole('PERSONAL')" th:href="@{/my}" class="btn btn-primary">마이페이지</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="btn btn-primary">관리자</a>
            <a sec:authorize="hasRole('COMPANY')" th:href="@{/corp}" class="btn btn-primary">기업관리</a>
        </div>
    </div>
</header>
