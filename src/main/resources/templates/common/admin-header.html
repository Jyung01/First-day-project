<header class="header" xmlns:th="http://www.thymeleaf.org" th:fragment="adminHeader">
    <div class="logo-box">
        <a th:href="@{/admin}" class="admin-logo">
            <!--
                headerLogoUrl이 아니라 footerLogoUrl을 쓰는 것이 의도된 설계다.
                헤더 로고는 밝은 배경용이라 어두운 관리자 헤더에서는 보이지 않는다.
                관리자 헤더는 공통 푸터와 같은 다크 배경이므로 푸터 로고를 공유한다.
                (관리자 > 사이트 설정 > 브랜드 이미지 관리의 "푸터 로고 이미지")
            -->
            <img
                    th:src="@{${siteSetting.footerLogoUrl != null && !#strings.isEmpty(siteSetting.footerLogoUrl)}
                            ? ${siteSetting.footerLogoUrl}
                            : '/images/common/logo-footer.png'}"
                    alt="첫출근 관리자"
                    class="admin-logo__image"
            />
        </a>

        <span class="admin-badge">관리자</span>
    </div>

    <nav class="top-menu">
        <a th:href="@{/}" class="top-menu__button">서비스 홈</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="top-menu__button">로그아웃</button>
        </form>
    </nav>
    <!-- CSRF 토큰을 fetch에 자동으로 붙인다. 화면별 스크립트보다 먼저 로드되어야 한다. -->
    <script th:src="@{/js/common/csrf.js}"></script>
</header>
