<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>연봉정보 수정</title>
    <link rel="stylesheet" th:href="@{/css/common.css}"/>
    <link rel="stylesheet" th:href="@{/css/salary/form-common.css}"/>
    <link rel="stylesheet" th:href="@{/css/modal/common.css}"/>
    <link rel="stylesheet" th:href="@{/css/modal/common/salary-create.css}"/>
    <script th:src="@{/js/modal.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <script th:src="@{/js/salary/edit.js}"></script>
    <script th:src="@{/js/salary/feedback-modal.js}"></script>
</head>
<body>
<header th:replace="~{common/header :: header}"></header>
<main class="salary-register-page">
    <section class="register-container">
        <div class="register-header">
            <div><h1>연봉정보 수정</h1><p>등록한 연봉정보를 수정합니다. 변경 내용은 익명 통계에 바로 반영됩니다.</p></div>
            <span class="register-policy">개인정보 · 로그인 완료</span>
        </div>

        <form th:action="@{/salary/edit}" th:object="${salaryRecordsDTO}" method="post" class="salary-form">
            <input type="hidden" th:field="*{salaryRecordId}">
            <div class="register-notice">
                <div class="notice-icon">✓</div>
                <div class="notice-content"><strong>개별 연봉은 공개되지 않습니다.</strong><p>수정된 값은 익명 통계에 바로 반영됩니다.</p></div>
            </div>

            <div class="form-grid">
                <div class="form-group"><label for="companyId">기업 <span>*</span></label>
                    <select id="companyId" th:field="*{companyId}" required><option value="">기업을 선택하세요</option><option th:each="company : ${companyOptions}" th:value="${company.companyId}" th:text="${company.companyName}"></option></select>
                </div>
                <div class="form-group"><label for="employmentStatus">재직 상태 <span>*</span></label>
                    <select id="employmentStatus" th:field="*{employmentStatus}" required><option value="현직원">현재 재직 중</option><option value="전직원">퇴사</option></select>
                </div>
                <div class="form-group"><label for="jobCategoryId">직무 <span>*</span></label>
                    <select id="jobCategoryId" th:field="*{jobCategoryId}" required><option value="">직무를 선택하세요</option><option th:each="job : ${jobCategoryOptions}" th:value="${job.jobCategoryId}" th:text="${job.categoryName}"></option></select>
                </div>
                <div class="form-group"><label for="careerYears">총 경력 <span>*</span></label>
                    <select id="careerYears" th:field="*{careerYears}" required><option th:each="year : ${#numbers.sequence(0, 50)}" th:value="${year}" th:text="${year == 0 ? '신입' : year + '년'}"></option></select>
                </div>
                <div class="form-group"><label for="employmentType">고용 형태 <span>*</span></label>
                    <select id="employmentType" th:field="*{employmentType}" required><option value="정규직">정규직</option><option value="계약직">계약직</option><option value="인턴">인턴</option><option value="프리랜서">프리랜서</option><option value="파견직">파견직</option><option value="기타">기타</option></select>
                </div>
                <div class="form-group"><label for="salaryYear">연봉 기준연도 <span>*</span></label>
                    <select id="salaryYear" th:field="*{salaryYear}" required><option th:each="year : ${#numbers.sequence(currentYear, currentYear - 10, -1)}" th:value="${year}" th:text="|${year}년|"></option></select>
                </div>
                <div class="form-group"><label for="baseSalary">세전 연봉 <span>*</span></label><div class="salary-input"><input type="number" id="baseSalary" th:field="*{baseSalary}" min="1" max="1000000" required/><span>만원</span></div></div>
                <div class="form-group"><label for="bonusAmount">성과급</label><div class="salary-input"><input type="number" id="bonusAmount" th:field="*{bonusAmount}" min="0" max="1000000"/><span>만원</span></div></div>
            </div>

            <div class="register-guide"><p>· 세금 공제 전의 연봉을 입력해주세요. · 성과급은 평균 연봉에 포함되지 않습니다.</p></div>
            <div class="agree-wrap"><label class="agree-check"><input type="checkbox" name="agree" value="true" required/><span>수정 내용이 실제 근무 정보이며 익명 통계 활용에 동의합니다. <span class="required">*</span></span></label><p class="agree-warning">필수 동의를 입력하고 수정 사항을 확인해주세요.</p></div>
            <div class="register-btn-group"><button type="button" class="cancel-btn" onclick="history.back()">취소</button><button type="submit" class="submit-btn">수정 내용 확인</button></div>
        </form>
    </section>
</main>
<div id="salaryFeedback" th:if="${errorMessage != null or successMessage != null}" th:data-message="${successMessage != null ? successMessage : errorMessage}" th:data-type="${successMessage != null ? 'success' : 'error'}"></div>
<footer th:replace="~{common/footer :: footer}"></footer>
<div th:replace="~{modal/common/confirm-modal :: confirmModal}"></div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
