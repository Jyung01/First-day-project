<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>연봉정보 수정</title>
    <!-- 메인 헤더 푸터 css -->
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <!-- 연봉정보 등록/수정 공통 폼 css -->
    <link rel="stylesheet" th:href="@{/css/salary/form-common.css}" />
</head>
<body>
<header th:replace="~{common/header :: header}"></header>

<main class="salary-register-page">
    <section class="register-container">
        <div class="register-header">
            <div>
                <h1>연봉정보 수정</h1>

                <p>
                    등록한 연봉정보를 수정합니다. 변경 내용은 익명 통계에 다시 반영됩니다.
                </p>
            </div>

            <a href="#" class="register-policy"> 개인정보 · 로그인 완료 </a>
        </div>

        <form action="#" method="post" class="salary-form">
            <div class="register-notice">
                <div class="notice-icon">✓</div>

                <div class="notice-content">
                    <strong>등록한 연봉은 계속 공개되지 않습니다. </strong>

                    <p>
                        수정된 값은 자동으로 익명 통계에 반영되며,
                        변경 전 연봉은 별도로 공개되지 않습니다.
                    </p>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="companyName"> 기업 <span>*</span> </label>

                    <div class="company-search">
                        <input
                                type="text"
                                id="companyName"
                                name="companyName"
                                value="네이버클라우드"
                        />

                        <button type="button">기업 변경</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="employmentStatus"> 재직 상태 <span>*</span> </label>

                    <select id="employmentStatus" name="employmentStatus">
                        <option value="" selected>현재 재직 중</option>

                        <option>퇴사</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="job"> 직무 <span>*</span> </label>

                    <select id="job" name="job">
                        <option selected>백엔드 개발</option>

                        <option>프론트엔드 개발</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="career"> 총 경력 <span>*</span> </label>

                    <select id="career" name="career">
                        <option selected>3년</option>

                        <option>4년</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="employmentType"> 고용 형태 <span>*</span> </label>

                    <select id="employmentType" name="employmentType">
                        <option selected>정규직</option>

                        <option>계약직</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="salaryYear"> 연봉 기준연도 <span>*</span> </label>

                    <select id="salaryYear" name="salaryYear">
                        <option selected>2026년</option>

                        <option>2025년</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="salary"> 세전 연봉 <span>*</span> </label>

                    <div class="salary-input">
                        <input
                                type="number"
                                id="salary"
                                name="salary"
                                value="5200"
                        />

                        <span>만원</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="bonus"> 성과금 </label>

                    <div class="salary-input">
                        <input
                                type="number"
                                id="bonus"
                                name="bonus"
                                value="300"
                        />

                        <span>만원</span>
                    </div>
                </div>
            </div>

            <div class="register-guide">
                <p>
                    · 세금 공제 전의 연봉을 입력해주세요. · 성과급은 실제 수령액이
                    평균 연봉에는 포함되지 않습니다.
                </p>

                <p>
                    · 비정상적으로 크거나 작은 값은 관리자 검토 후 제외될 수 있습니다.
                </p>
            </div>

            <div class="agree-wrap">
                <label class="agree-check">
                    <input type="checkbox" name="agree" />

                    <span>
                본인이 실제 근무한 기업의 연봉정보이며, 익명 통계 활용에
                동의합니다. <span class="required">*</span>
              </span>
                </label>

                <p class="agree-warning">
                    필수 동의를 입력하고 수정 사항을 확인해주세요.
                </p>
            </div>

            <div class="register-btn-group">
                <button type="button" class="cancel-btn">취소</button>

                <button type="submit" class="submit-btn">수정 내용 확인</button>
            </div>
        </form>
    </section>
</main>

<!-- ============ 푸터 (공통 영역) ============ -->
<footer th:replace="~{common/footer :: footer}"></footer>
<!-- 공통 헤더·푸터 불러오기 -->
<script th:src="@{../js/common.js}"></script>
</body>
</html>
