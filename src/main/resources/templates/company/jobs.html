<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>기업 - 채용공고</title>
    <!-- 메인 헤더 푸터 css -->
    <link rel="stylesheet" th:href="@{/css/common.css}"/>
    <!-- 기업 채용공고 css -->
    <link rel="stylesheet" th:href="@{/css/company/jobs.css}"/>
    <!-- 기업 공통 css -->
    <link rel="stylesheet" th:href="@{/css/company/common.css}"/>
    <!-- 모달 css -->
    <link rel="stylesheet" th:href="@{/css/modal/common.css}"/>
    <link rel="stylesheet" th:href="@{/css/modal/common/salary-create.css}"/>
    <link rel="stylesheet" th:href="@{/css/modal/common/report-modal.css}"/>
    <!-- 모달 js -->
    <script th:src="@{/js/modal.js}"></script>
    <script th:src="@{/js/modal/common/report-modal.js}"></script>

    <script th:src="@{/js/company/detail.js}"></script>
    <script th:src="@{/js/company/jobs.js}"></script>


    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

</head>
<body>
<header th:replace="~{common/header :: header}"></header>

<main class="company-detail-main">

    <!-- =========================
         기업 헤더
    ========================== -->
    <section class="company-profile">

        <div class="profile-left">

            <div class="company-logo">
                <img th:src="${company.logoUrl}" alt="기업 로고" style="width: 100%; height: 100%; object-fit: cover;"
                     th:if="${company.logoUrl != null}">
                <span th:if="${company.logoUrl == null}"
                      th:text="${#strings.substring(company.companyName, 0, 1)}">네</span>
            </div>

            <div class="company-summary">

                <h2 th:text="${company.companyName}">네이버클라우드</h2>

                <p class="company-category">
                    <span th:text="${company.industryName}">IT 서비스</span> · <span th:text="${company.addressLine1}">서울 강남</span>
                    · <span th:text="${company.companySize}">중견기업</span>
                </p>

                <div class="company-rating">

                    <span>
                        ⭐ <span th:text="${company.averageRating != null ? company.averageRating : '4.5'}">4.5</span>
                    </span>

                    <span>
                        리뷰 <span th:text="${company.reviewCount}">328</span>개
                    </span>

                    <span>
                        진행 중 공고 <span th:text="${company.jobPostingCount}">12</span>개
                    </span>

                </div>

            </div>

        </div>

        <div class="profile-right">

            <button class="wish-btn"
                    th:data-company-id="${company.companyId}"
                    th:classappend="${isWished} ? ' active'">

                <i th:class="${isWished} ? 'fa-solid fa-heart' : 'fa-regular fa-heart'"></i>

                관심기업

            </button>

            <button class="report-btn"
                    data-report-type="company"
                    th:data-target-id="${company.companyId}"
                    th:data-target-name="${company.companyName}">

                신고

            </button>

        </div>

    </section>


    <!-- =========================
            탭
    ========================== -->

    <section class="company-tab">

        <a class="tab-btn "
           th:href="@{/company/detail(companyId=${company.companyId})}">
            기업소개
        </a>

        <a class="tab-btn active"
           th:href="@{/company/jobs(companyId=${company.companyId})}">
            채용공고
        </a>

        <a class="tab-btn"
           th:href="@{/company/reviews(companyId=${company.companyId})}">
            기업리뷰
        </a>

        <a class="tab-btn"
           th:href="@{/company/interview-reviews(companyId=${company.companyId})}">
            면접후기
        </a>

    </section>


    <!-- 제목 -->
    <section class="recruit-section">

        <div class="section-title">

            <h3>진행 중 채용공고</h3>

            <span th:text="|총 ${#lists.size(recruitList)}건|">총 0건</span>

        </div>

        <div class="recruit-grid">

            <article class="recruit-card"
                     th:each="recruit : ${recruitList}">

                <!-- 상단 -->
                <div class="card-header">

                    <span class="deadline"
                          th:text="'D-' + ${recruit.dday}">
                        D-13
                    </span>

                    <button class="bookmark-btn"
                            type="button"
                            th:data-job-posting-id="${recruit.jobPostingId}"
                            th:data-logged-in="${personalMember}"
                            th:classappend="${savedJobPostingIds.contains(recruit.jobPostingId)} ? ' active'"
                            th:attr="aria-pressed=${savedJobPostingIds.contains(recruit.jobPostingId)}"
                            aria-label="관심 공고 등록">
                        <i th:class="${savedJobPostingIds.contains(recruit.jobPostingId)} ? 'fa-solid fa-heart' : 'fa-regular fa-heart'"></i>
                    </button>

                </div>

                <!-- 회사 -->
                <div class="company-info">

                    <span class="company-name"
                          th:text="${recruit.companyName}">
                        네이버클라우드
                    </span>

                </div>

                <!-- 제목 -->
                <h4 class="recruit-title"
                    th:text="${recruit.title}">
                    Java / Spring 백엔드 개발자
                </h4>

                <!-- 기술 -->
                <div class="skill-list">

                    <span th:each="skill : ${recruit.skillList}"
                          th:text="${skill}">
                        Java
                    </span>

                </div>

                <!-- 정보 -->
                <ul class="recruit-info">

                    <li>
                        <i class="fa-solid fa-briefcase"></i>

                        <span th:text="${recruit.careerType}"></span>

                        <span th:if="${recruit.minExperienceYears != null}">
                    &nbsp;<span th:text="${recruit.minExperienceYears}"></span>년↑
                </span>

                    </li>

                    <li>
                        <i class="fa-solid fa-location-dot"></i>

                        <span th:text="${recruit.workRegion}"></span>

                    </li>

                    <li>
                        <i class="fa-solid fa-graduation-cap"></i>

                        <span th:text="${recruit.educationLevel}"></span>

                    </li>

                    <li>
                        <i class="fa-solid fa-coins"></i>

                        <span th:text="${recruit.salaryText}"></span>

                    </li>

                </ul>

                <a th:href="@{/job/detail(jobPostingId=${recruit.jobPostingId})}"
                   class="apply-btn">

                    지원하기

                </a>

            </article>

        </div>

    </section>


</main>
<!-- ============ 푸터 (공통 영역) ============ -->
<footer th:replace="~{common/footer :: footer}"></footer>

<!-- 모달 불러오기 -->
<div th:replace="~{modal/common/confirm-modal :: confirmModal}"></div>
<div th:replace="~{modal/common/report-modal :: reportModal}"></div>

<!-- 공통 헤더·푸터 불러오기 -->
<script th:src="@{../js/common.js}"></script>
</body>
</html>
