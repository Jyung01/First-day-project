<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>기업 - 면접후기</title>
    <!-- 메인 헤더 푸터 css -->
    <link rel="stylesheet" th:href="@{/css/common.css}"/>
    <!-- 기업 기업리뷰 css -->
    <link rel="stylesheet" th:href="@{/css/company/reviews.css}"/>
    <!--  기업 기업리뷰등록 css -->
    <link rel="stylesheet" th:href="@{/css/company/interview-reviews.css}"/>
    <!-- 기업 공통 css -->
    <link rel="stylesheet" th:href="@{/css/company/common.css}"/>
    <!-- 모달 css -->
    <link rel="stylesheet" th:href="@{/css/modal/common.css}"/>
    <link rel="stylesheet" th:href="@{/css/modal/common/salary-create.css}"/>
    <!-- 모달 js -->
    <script th:src="@{/js/modal.js}"></script>
    <script th:src="@{/js/modal/company/review-write.js}"></script>
    <script th:src="@{/js/company/review-write.js}"></script>

    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
</head>
<body>
<header th:replace="~{common/header :: header}"></header>

<main class="review-create-main company-detail-main">
    <div class="review-form-container">

        <!-- 상단 타이틀 영역 -->
        <div class="form-header">
            <div>
                <h2>기업리뷰 작성</h2>
                <p>입사 완료 이력이 확인된 기업에만 리뷰를 작성할 수 있습니다.</p>
            </div>
            <div class="verification-badge">
                ✓ 입사 완료 이력 확인됨
            </div>
        </div>

        <!-- 리뷰 작성 폼 -->
        <form id="companyReviewForm"
              th:action="${formAction != null ? formAction : '/company/review/write'}"
              th:object="${companyReviewsDTO}"
              method="post">

            <!-- hidden -->
            <input type="hidden" th:field="*{companyId}">
            <input type="hidden" th:field="*{companyReviewId}">
            <input type="hidden" th:field="*{authorUserId}">
            <input type="hidden" th:field="*{eligibilityApplicationId}">
            <input type="hidden" th:field="*{jobCategoryId}">

            <input type="hidden" th:field="*{careerGrowthRating}" value="5">
            <input type="hidden" th:field="*{workSatisfactionRating}" value="5">
            <input type="hidden" th:field="*{compensationRating}" value="5">
            <input type="hidden" th:field="*{cultureRating}" value="5">

            <div class="form-row">
                <div class="form-group">
                    <label>기업</label>
                    <input type="text"
                           th:value="${companyName}"
                           readonly
                           class="readonly-input">
                </div>
                <div class="form-group">
                    <label>재직 상태</label>
                    <input type="text"
                           th:field="*{employmentStatus}"
                           readonly
                           class="readonly-input">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>직무</label>
                    <input type="text"
                           th:value="${jobCategoryName}"
                           readonly
                           class="readonly-input">
                </div>
                <div class="form-group">
                    <label>재직 기간</label>
                    <input type="text"
                           name="employmentPeriod"
                           placeholder="예: 3년">
                </div>
            </div>

            <!-- 항목별 평점 -->
            <div class="form-group full-width">
                <label>항목별 평점</label>

                <div class="rating-grid-box">

                    <div class="rating-item">
                        <span>커리어 성장</span>

                        <div class="star-rating" data-target="careerGrowthRating">
                            <i class="fa-solid fa-star active" data-score="1"></i>
                            <i class="fa-solid fa-star active" data-score="2"></i>
                            <i class="fa-solid fa-star active" data-score="3"></i>
                            <i class="fa-solid fa-star active" data-score="4"></i>
                            <i class="fa-solid fa-star active" data-score="5"></i>
                        </div>

                        <strong class="rating-val">5점</strong>
                    </div>

                    <div class="rating-item">
                        <span>업무 만족</span>

                        <div class="star-rating" data-target="workSatisfactionRating">
                            <i class="fa-solid fa-star active" data-score="1"></i>
                            <i class="fa-solid fa-star active" data-score="2"></i>
                            <i class="fa-solid fa-star active" data-score="3"></i>
                            <i class="fa-solid fa-star active" data-score="4"></i>
                            <i class="fa-solid fa-star active" data-score="5"></i>
                        </div>

                        <strong class="rating-val">5점</strong>
                    </div>

                    <div class="rating-item">
                        <span>급여·복지</span>

                        <div class="star-rating" data-target="compensationRating">
                            <i class="fa-solid fa-star active" data-score="1"></i>
                            <i class="fa-solid fa-star active" data-score="2"></i>
                            <i class="fa-solid fa-star active" data-score="3"></i>
                            <i class="fa-solid fa-star active" data-score="4"></i>
                            <i class="fa-solid fa-star active" data-score="5"></i>
                        </div>

                        <strong class="rating-val">5점</strong>
                    </div>

                    <div class="rating-item">
                        <span>조직문화</span>

                        <div class="star-rating" data-target="cultureRating">
                            <i class="fa-solid fa-star active" data-score="1"></i>
                            <i class="fa-solid fa-star active" data-score="2"></i>
                            <i class="fa-solid fa-star active" data-score="3"></i>
                            <i class="fa-solid fa-star active" data-score="4"></i>
                            <i class="fa-solid fa-star active" data-score="5"></i>
                        </div>

                        <strong class="rating-val">5점</strong>
                    </div>

                </div>

                <p class="rating-helper">
                    종합 평점은 항목 평균으로 자동 계산:
                    <span id="avgScore">4.5</span>점
                </p>
            </div>

            <!-- 장점 / 아쉬운 점 -->
            <div class="form-row">
                <div class="form-group full-width">
                    <label>장점</label>
                    <textarea th:field="*{pros}"
                              placeholder="기업에서 좋았던 점을 구체적으로 작성해주세요."
                              rows="4"></textarea>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group full-width">
                    <label>아쉬운 점</label>
                    <textarea th:field="*{cons}"
                              placeholder="개선되었으면 하는 점을 작성해주세요."
                              rows="4"></textarea>
                </div>
            </div>

            <!-- 한 줄 요약 -->
            <div class="form-row">
                <div class="form-group full-width">
                    <label>한 줄 요약</label>
                    <input type="text"
                           th:field="*{summary}"
                           placeholder="후기를 한 문장으로 요약해주세요.">
                </div>
            </div>

            <div class="notice-text">
                모든 기업리뷰는 익명으로 공개됩니다.
            </div>

            <div class="info-box">
                후기는 익명으로 등록 즉시 공개됩니다. 작성자 계정은 작성 자격 확인과 수정 관리에만 사용됩니다.
            </div>

            <!-- 버튼 영역 -->
            <div class="form-actions">
                <button type="button" class="btn-cancel" onclick="history.back();">취소</button>
                <button type="submit" class="btn-submit" th:text="${isEdit == true ? '기업리뷰 수정' : '기업리뷰 등록'}">기업리뷰 등록</button>
            </div>

        </form>
    </div>
</main>

<script th:if="${errorMessage}" th:inline="javascript">
    document.addEventListener("DOMContentLoaded", () => showConfirmModal({
        iconClass: "danger", iconHtml: '<i class="fa-solid fa-exclamation"></i>',
        title: "처리할 수 없습니다", message: [[${errorMessage}]],
        leftVisible: false, rightText: "확인", rightClass: "btn-primary"
    }));
</script>

<!-- ============ 푸터 (공통 영역) ============ -->
<footer th:replace="~{common/footer :: footer}"></footer>

<!-- 모달 불러오기 -->
<div th:replace="~{modal/common/confirm-modal :: confirmModal}"></div>

<!-- 공통 헤더·푸터 불러오기 -->
<script th:src="@{../js/common.js}"></script>
</body>
</html>
