<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>기업 - 기업목록</title>
    <!-- 메인 헤더 푸터 css -->
    <link rel="stylesheet" th:href="@{/css/common.css}"/>
    <!-- 기업 목록 css -->
    <link rel="stylesheet" th:href="@{/css/company/list.css}"/>
    <!-- 모달 css -->
    <link rel="stylesheet" th:href="@{/css/modal/common.css}"/>
    <link rel="stylesheet" th:href="@{/css/modal/common/salary-create.css}"/>
    <!-- 모달 js -->
    <script th:src="@{/js/modal.js}"></script>

    <script th:src="@{/js/company/list.js}"></script>
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

</head>
<body>
<header th:replace="~{common/header :: header}"></header>

<main class="company-main">

    <!-- 검색 영역 -->
    <section class="company-search-section">

        <div class="search-top">
            <div class="title-box">
                <h2>기업정보</h2>
                <p>나와 맞는 기업을 찾고 채용 정보를 확인해보세요.</p>
            </div>

            <form class="search-form"
                  th:action="@{/company/list}"
                  method="get">

                <div class="keyword-search">
                    <input type="text"
                           name="keyword"
                           th:value="${search.keyword}"
                           placeholder="기업명 · 업종 · 키워드 검색">

                    <button type="submit">
                        검색
                    </button>
                </div>

                <div class="filter-group">

                    <select name="industry">
                        <option value="">업종 전체</option>

                        <option th:each="industry : ${industryList}"
                                th:value="${industry}"
                                th:text="${industry}"
                                th:selected="${industry == search.industry}">
                        </option>
                    </select>

                    <select name="region">
                        <option value="">지역 전체</option>

                        <option th:each="region : ${regionList}"
                                th:value="${region}"
                                th:text="${region}"
                                th:selected="${region == search.region}">
                        </option>
                    </select>

                    <select name="companySize">
                        <option value="">기업 규모</option>

                        <option th:each="size : ${companySizeList}"
                                th:value="${size}"
                                th:text="${size}"
                                th:selected="${size == search.companySize}">
                        </option>
                    </select>

                    <select name="jobCategory">
                        <option value="">직무 전체</option>

                        <option th:each="job : ${jobCategoryList}"
                                th:value="${job.categoryName}"
                                th:text="${job.categoryName}"
                                th:selected="${job.categoryName == search.jobCategory}">
                        </option>
                    </select>

                </div>

            </form>

        </div>

    </section>


    <!-- 광고 -->
    <section class="company-banner">

        <div class="banner-box">
            <span>COMPANY_LIST</span>
            <p>관리자 등록 기업 배너 (광고 1280 × 120)</p>
        </div>

    </section>


    <!-- 기업 목록 -->
    <section class="company-list-section">

        <div class="section-header">

            <h3>전체 기업</h3>

            <span class="company-count">
                총 <span th:text="${companyCount}"></span>개
            </span>

        </div>

        <div class="company-grid" th:if="${!#lists.isEmpty(companyList)}">

            <a th:each="company : ${companyList}"
               th:href="@{/company/detail(companyId=${company.companyId})}"
               class="company-card">

                <div class="card-top">

                    <img class="company-logo"
                         th:src="${company.logoUrl}"
                         alt="기업 로고">

                    <button class="wish-btn">
                        <i class="fa-regular fa-heart"></i>
                    </button>

                </div>

                <h4 th:text="${company.companyName}"></h4>

                <p class="company-info">
                    <span th:text="${company.industryName}"></span>
                    ·
                    <span th:text="${company.addressLine1}"></span>
                </p>

                <span class="recruit-badge"
                      th:if="${company.hasJobPosting == 1}">
            채용중
        </span>

                <div class="company-score"
                     th:if="${company.averageRating != null}">
                    ⭐
                    <span th:text="${company.averageRating}"></span>
                    · 리뷰
                    <span th:text="${company.reviewCount}"></span>개
                </div>

                <div class="card-line"  th:if="${company.averageRating != null}"></div>

                <p class="company-review"
                   th:if="${!#strings.isEmpty(company.summary)}"
                   th:text="${company.summary}">
                </p>

            </a>

        </div>
        <!-- 검색 결과 없을 때 -->
        <div class="empty-result"
             th:if="${#lists.isEmpty(companyList)}">
            검색 결과가 없습니다.
        </div>

        <!-- 페이지네이션 -->
        <div class="pagination">

            <!-- 이전 -->
            <button
                    th:if="${ph.startPage > 1}"
                    th:onclick="|location.href='@{/company/list(page=${ph.startPage - 1})}'|">
                &lt;
            </button>

            <!-- 페이지 번호 -->
            <button
                    th:each="page : ${#numbers.sequence(ph.startPage, ph.endPage)}"
                    th:text="${page}"
                    th:classappend="${page == ph.currentPage} ? ' active' : ''"
                    th:onclick="|location.href='@{/company/list(page=${page})}'|">
            </button>

            <!-- 다음 -->
            <button
                    th:if="${ph.endPage < ph.lastPage}"
                    th:onclick="|location.href='@{/company/list(page=${ph.endPage + 1})}'|">
                &gt;
            </button>

        </div>

    </section>

</main>


<!-- ============ 푸터 (공통 영역) ============ -->
<footer th:replace="~{common/footer :: footer}"></footer>

<!-- 모달 불러오기 -->
<div th:replace="~{modal/common/confirm-modal :: confirmModal}"></div>

<!-- 공통 헤더·푸터 불러오기 -->
<script th:src="@{../js/common.js}"></script>
</body>
</html>
