<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>배너 관리</title>
    <link rel="stylesheet" th:href="@{/css/admin/common.css}"/>
    <link rel="stylesheet" th:href="@{/css/admin/review/common.css}"/>
    <link rel="stylesheet" th:href="@{/css/admin/banner/common.css}"/>
    <link rel="stylesheet" th:href="@{/css/modal/admin/admin-modal.css}"/>
    <link rel="stylesheet" th:href="@{/css/modal/common.css}"/>
    <script th:src="@{/js/modal.js}" defer></script>
    <script th:src="@{/js/admin/banner.js}" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
</head>
<body>
<div class="wrapper">
    <header th:replace="~{common/admin-header :: adminHeader}"></header>

    <div class="container">
        <aside th:replace="~{common/admin-aside :: adminAside}"></aside>

        <main class="content">
            <div class="page-top">
                <div class="page-title">
                    <h2>배너 관리</h2>
                    <p>배너 이미지와 노출 기간, 우선순위를 관리합니다.</p>
                </div>
                <button class="add-btn" id="openBannerModal" type="button">+ 배너 등록</button>
            </div>

            <section class="review-box">
                <div class="review-tab">
                    <button class="tab-btn active" type="button" data-tab="all">전체</button>
                    <button class="tab-btn" type="button" data-tab="main">메인</button>
                    <button class="tab-btn" type="button" data-tab="job">채용공고</button>
                    <button class="tab-btn" type="button" data-tab="companies">기업정보</button>
                </div>

                <p class="banner-guide">권장 크기: 메인 1920 × 320, 채용공고·기업정보 1280 × 120. 같은 위치와 기간이 겹치면 작은 우선순위 번호가 먼저 노출됩니다.</p>

                <div class="banner-list">
                    <article class="banner-card" th:each="banner : ${banners}" th:attr="data-type=${banner.placement}">
                        <div class="banner-thumb">
                            <img th:src="${banner.imageUrl}" th:alt="${banner.altText}"/>
                        </div>

                        <div class="banner-info">
                            <h3 th:text="${banner.bannerName}">배너 제목</h3>
                            <p>노출 위치 <span th:text="${banner.placement == 'main' ? '메인' : (banner.placement == 'job' ? '채용공고' : '기업정보')}">메인</span></p>
                            <p>노출 기간 <span th:text="${banner.startsAt != null ? #temporals.format(banner.startsAt, 'yyyy.MM.dd') : '상시'}">상시</span> ~ <span th:text="${banner.endsAt != null ? #temporals.format(banner.endsAt, 'yyyy.MM.dd') : '상시'}">상시</span></p>
                            <p>배너 우선순위 <span th:text="${banner.displayOrder}">0</span></p>
                        </div>

                        <div class="banner-status">
                            <span class="status" th:classappend="${banner.isActive} ? ' on' : ' off'" th:text="${banner.isActive} ? '노출 중' : '숨김'">노출 중</span>
                            <div class="banner-action">
                                <a href="#" class="edit-banner-btn" th:attr="data-banner-id=${banner.bannerId}">수정</a>
                                <a href="#" class="hide-banner-btn" th:attr="data-banner-id=${banner.bannerId}" th:text="${banner.isActive} ? '숨김' : '노출'">숨김</a>
                            </div>
                        </div>
                    </article>

                    <div class="banner-empty" th:if="${#lists.isEmpty(banners)}">등록된 배너가 없습니다.</div>
                </div>
            </section>
        </main>
    </div>

    <footer th:replace="~{common/admin-footer :: adminFooter}"></footer>
    <div th:replace="~{modal/admin/banner-form :: bannerModal}"></div>
    <div th:replace="~{modal/common/confirm-modal :: confirmModal}"></div>
</div>
</body>
</html>
