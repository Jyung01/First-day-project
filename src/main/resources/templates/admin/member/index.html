<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>회원 관리 | 첫출근 관리자</title>

        <link rel="stylesheet" th:href="@{/css/admin/common.css}" />
        <link rel="stylesheet" th:href="@{/css/modal/admin/admin-modal.css}" />
        <link rel="stylesheet" th:href="@{/css/admin/management.css}" />
    </head>

    <body>
        <div class="wrapper">
            <!-- 관리자 헤더 -->
            <header th:replace="~{common/admin-header :: adminHeader}"></header>

            <div class="container">
                <!-- 관리자 사이드바 -->
                <aside th:replace="~{common/admin-aside :: adminAside}"></aside>

                <!-- 회원 관리 콘텐츠 -->
                <main class="content management-content">
                    <section class="management-heading">
                        <h1>회원 관리</h1>

                        <p>개인회원 계정과 이용 상태를 관리합니다.</p>
                    </section>

                    <!-- 통계 -->
                    <section class="management-stats">
                        <article class="management-stat-card">
                            <span>누적 개인회원</span>
                            <strong th:text="|${statistics.totalCount}명|">0명</strong>
                            <small>탈퇴 회원 포함</small>
                        </article>

                        <article class="management-stat-card">
                            <span>오늘 가입</span>
                            <strong th:text="|${statistics.todayCount}명|">0명</strong>
                            <small>신규 개인회원</small>
                        </article>

                        <article class="management-stat-card">
                            <span>이용 정지</span>
                            <strong th:text="|${statistics.suspendedCount}명|">0명</strong>
                            <small>관리자 조치 계정</small>
                        </article>
                    </section>

                    <!-- 회원 목록 -->
                    <section class="management-panel">
                        <div class="management-tabs" role="tablist" aria-label="회원 상태">
                            <a
                                class="management-tab"
                                role="tab"
                                th:classappend="${selectedStatus == 'ALL'} ? ' is-active'"
                                th:attr="aria-selected=${selectedStatus == 'ALL'}"
                                th:href="@{/admin/member(status='ALL',keyword=${keyword},page=1)}"
                                data-member-status="ALL"
                            >
                                전체
                            </a>

                            <a
                                class="management-tab"
                                role="tab"
                                th:classappend="${selectedStatus == 'ACTIVE'} ? ' is-active'"
                                th:attr="aria-selected=${selectedStatus == 'ACTIVE'}"
                                th:href="@{/admin/member(status='ACTIVE',keyword=${keyword},page=1)}"
                                data-member-status="ACTIVE"
                            >
                                정상
                            </a>

                            <a
                                class="management-tab"
                                role="tab"
                                th:classappend="${selectedStatus == 'SUSPENDED'} ? ' is-active'"
                                th:attr="aria-selected=${selectedStatus == 'SUSPENDED'}"
                                th:href="@{/admin/member(status='SUSPENDED',keyword=${keyword},page=1)}"
                                data-member-status="SUSPENDED"
                            >
                                이용정지
                            </a>

                            <a
                                class="management-tab"
                                role="tab"
                                th:classappend="${selectedStatus == 'WITHDRAWN'} ? ' is-active'"
                                th:attr="aria-selected=${selectedStatus == 'WITHDRAWN'}"
                                th:href="@{/admin/member(status='WITHDRAWN',keyword=${keyword},page=1)}"
                                data-member-status="WITHDRAWN"
                            >
                                탈퇴
                            </a>
                        </div>

                        <form
                            class="management-search management-search--member"
                            method="get"
                            th:action="@{/admin/member}"
                        >
                            <input type="hidden" name="status" th:value="${selectedStatus}" />

                            <input
                                type="search"
                                class="management-search-input"
                                name="keyword"
                                placeholder="아이디 · 이름 · 이메일 · 전화번호 검색"
                                th:value="${keyword}"
                            />

                            <button type="submit" class="management-search-button">검색</button>

                            <span class="management-total" th:text="|총 ${memberPage.totalElements}건|">총 0건</span>
                        </form>

                        <div class="management-table-wrap">
                            <table class="management-table management-table--member">
                                <thead>
                                    <tr>
                                        <th>회원번호</th>
                                        <th>로그인 아이디</th>
                                        <th>이름</th>
                                        <th>이메일</th>
                                        <th>가입일</th>
                                        <th>상태</th>
                                        <th>최근 로그인</th>
                                        <th>관리</th>
                                    </tr>
                                </thead>

                                <tbody>
                                    <tr th:each="member : ${memberPage.content}">
                                        <td th:text="${member.userId}">1004</td>
                                        <td th:text="${member.loginId}">jobseeker04</td>
                                        <td th:text="${member.name}">박서준</td>
                                        <td
                                            th:text="${member.email}"
                                            th:title="${member.email}"
                                        >seojun@email.com</td>
                                        <td th:text="${#temporals.format(member.createdAt, 'yy.MM.dd')}">
                                            26.08.10
                                        </td>
                                        <td>
                                            <span
                                                th:if="${member.statusCode == 'ACTIVE'}"
                                                class="status-text is-active"
                                            >정상</span>
                                            <span
                                                th:if="${member.statusCode == 'SUSPENDED'}"
                                                class="status-text is-suspended"
                                            >이용정지</span>
                                            <span
                                                th:if="${member.statusCode == 'WITHDRAWN'}"
                                                class="status-text is-withdrawn"
                                            >탈퇴</span>
                                        </td>
                                        <td
                                            th:text="${member.lastLoginAt == null
                                                ? '-'
                                                : #temporals.format(member.lastLoginAt, 'yy.MM.dd HH:mm')}"
                                        >-</td>
                                        <td>
                                            <button
                                                type="button"
                                                class="management-detail-link"
                                                data-member-detail-open
                                                th:attr="data-member-detail-url=@{/admin/member/{memberId}(memberId=${member.userId})}"
                                            >
                                                상세
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <p class="management-empty" th:if="${memberPage.empty}">조건에 맞는 회원이 없습니다.</p>

                        <nav
                            class="management-pagination"
                            th:if="${memberPage.totalPages > 1}"
                            aria-label="회원 목록 페이지"
                        >
                            <a
                                th:if="${!memberPage.first}"
                                th:href="@{/admin/member(status=${selectedStatus},keyword=${keyword},page=${memberPage.number})}"
                                aria-label="이전 페이지"
                            >‹</a>
                            <a
                                th:each="pageNumber : ${#numbers.sequence(startPage, endPage)}"
                                th:classappend="${pageNumber == memberPage.number + 1} ? ' is-current'"
                                th:attr="aria-current=${pageNumber == memberPage.number + 1} ? 'page'"
                                th:href="@{/admin/member(status=${selectedStatus},keyword=${keyword},page=${pageNumber})}"
                                th:text="${pageNumber}"
                            >1</a>
                            <a
                                th:if="${!memberPage.last}"
                                th:href="@{/admin/member(status=${selectedStatus},keyword=${keyword},page=${memberPage.number + 2})}"
                                aria-label="다음 페이지"
                            >›</a>
                        </nav>
                    </section>
                </main>
            </div>

            <!-- 관리자 푸터 -->
            <footer th:replace="~{common/admin-footer :: adminFooter}"></footer>
        </div>

        <div th:replace="~{modal/admin/member-detail :: memberDetailModal}"></div>

        <script th:src="@{/js/modal/admin/member-detail.js}"></script>
    </body>
</html>
