<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>기업 관리 | 첫출근 관리자</title>

        <link rel="stylesheet" th:href="@{/css/admin/common.css}" />
        <link rel="stylesheet" th:href="@{/css/admin/management.css}" />
        <link rel="stylesheet" th:href="@{/css/modal/admin/admin-modal.css}" />
    </head>

    <body>
        <div class="wrapper">
            <header th:replace="~{common/admin-header :: adminHeader}"></header>

            <div class="container">
                <aside th:replace="~{common/admin-aside :: adminAside}"></aside>

                <main class="content management-content">
                    <section class="management-heading">
                        <h1>기업 관리</h1>
                        <p>기업 가입 심사와 승인 상태, 공개 정보를 관리합니다.</p>
                    </section>

                    <section class="management-stats">
                        <article class="management-stat-card">
                            <span>승인 대기</span>
                            <strong th:text="|${statistics.pendingCount}건|">0건</strong>
                            <small th:text="|신규 ${statistics.newReviewCount} · 재심사 ${statistics.reReviewCount}|">
                                신규 0 · 재심사 0
                            </small>
                        </article>

                        <article class="management-stat-card">
                            <span>승인 기업</span>
                            <strong th:text="|${statistics.approvedCount}개|">0개</strong>
                            <small>현재 정상 이용 중</small>
                        </article>

                        <article class="management-stat-card">
                            <span>반려 기업</span>
                            <strong th:text="|${statistics.rejectedCount}건|">0건</strong>
                            <small>정보 수정·재심사 가능</small>
                        </article>
                    </section>

                    <section class="management-panel">
                        <div class="management-tabs" role="tablist" aria-label="기업 상태">
                            <a
                                class="management-tab"
                                role="tab"
                                th:classappend="${selectedStatus == 'ALL'} ? ' is-active'"
                                th:attr="aria-selected=${selectedStatus == 'ALL'}"
                                th:href="@{/admin/company(status='ALL',keyword=${keyword},page=1)}"
                            >전체</a>
                            <a
                                class="management-tab"
                                role="tab"
                                th:classappend="${selectedStatus == 'PENDING'} ? ' is-active'"
                                th:attr="aria-selected=${selectedStatus == 'PENDING'}"
                                th:href="@{/admin/company(status='PENDING',keyword=${keyword},page=1)}"
                            >승인 대기</a>
                            <a
                                class="management-tab"
                                role="tab"
                                th:classappend="${selectedStatus == 'APPROVED'} ? ' is-active'"
                                th:attr="aria-selected=${selectedStatus == 'APPROVED'}"
                                th:href="@{/admin/company(status='APPROVED',keyword=${keyword},page=1)}"
                            >승인</a>
                            <a
                                class="management-tab"
                                role="tab"
                                th:classappend="${selectedStatus == 'REJECTED'} ? ' is-active'"
                                th:attr="aria-selected=${selectedStatus == 'REJECTED'}"
                                th:href="@{/admin/company(status='REJECTED',keyword=${keyword},page=1)}"
                            >반려</a>
                            <a
                                class="management-tab"
                                role="tab"
                                th:classappend="${selectedStatus == 'SUSPENDED'} ? ' is-active'"
                                th:attr="aria-selected=${selectedStatus == 'SUSPENDED'}"
                                th:href="@{/admin/company(status='SUSPENDED',keyword=${keyword},page=1)}"
                            >이용정지</a>
                            <a
                                class="management-tab"
                                role="tab"
                                th:classappend="${selectedStatus == 'WITHDRAWN'} ? ' is-active'"
                                th:attr="aria-selected=${selectedStatus == 'WITHDRAWN'}"
                                th:href="@{/admin/company(status='WITHDRAWN',keyword=${keyword},page=1)}"
                            >탈퇴</a>
                        </div>

                        <form
                            class="management-search management-search--company"
                            method="get"
                            th:action="@{/admin/company}"
                        >
                            <input type="hidden" name="status" th:value="${selectedStatus}" />

                            <input
                                type="search"
                                class="management-search-input"
                                name="keyword"
                                placeholder="기업명 · 사업자번호 검색"
                                th:value="${keyword}"
                            />

                            <button type="submit" class="management-search-button">검색</button>

                            <span class="management-total" th:text="|총 ${companyPage.totalElements}건|">
                                총 0건
                            </span>
                        </form>

                        <div class="management-table-wrap">
                            <table class="management-table management-table--company">
                                <thead>
                                    <tr>
                                        <th>번호</th>
                                        <th>기업명</th>
                                        <th>사업자번호</th>
                                        <th>담당자</th>
                                        <th>신청일</th>
                                        <th>심사유형</th>
                                        <th>상태</th>
                                        <th>관리</th>
                                    </tr>
                                </thead>

                                <tbody>
                                    <tr th:each="company : ${companyPage.content}">
                                        <td th:text="${company.companyNumber}">C-0001</td>
                                        <td th:text="${company.companyName}" th:title="${company.companyName}">
                                            기업명
                                        </td>
                                        <td th:text="${company.businessNumber}" th:title="${company.businessNumber}">
                                            000-00-00000
                                        </td>
                                        <td th:text="${company.managerName}">담당자</td>
                                        <td th:text="${company.requestedAt == null
                                            ? '-'
                                            : #temporals.format(company.requestedAt, 'yy.MM.dd')}">
                                            -
                                        </td>
                                        <td th:text="${company.reviewTypeLabel}">신규 심사</td>
                                        <td>
                                            <span
                                                class="status-text"
                                                th:classappend="| is-${#strings.toLowerCase(company.statusCode)}|"
                                                th:text="${company.statusLabel}"
                                            >승인 대기</span>
                                        </td>
                                        <td>
                                            <button
                                                type="button"
                                                class="management-detail-link"
                                                data-company-detail-open
                                                th:attr="data-company-detail-url=@{/admin/company/{companyId}(companyId=${company.companyId})}"
                                                th:text="${company.statusCode == 'PENDING'
                                                    ? (company.reviewTypeCode == 'REVIEW' ? '재심사' : '심사')
                                                    : '상세'}"
                                            >상세</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <p class="management-empty" th:if="${companyPage.empty}">
                            조건에 맞는 기업이 없습니다.
                        </p>

                        <nav
                            class="management-pagination"
                            th:if="${companyPage.totalPages > 1}"
                            aria-label="기업 목록 페이지"
                        >
                            <a
                                th:if="${!companyPage.first}"
                                th:href="@{/admin/company(status=${selectedStatus},keyword=${keyword},page=${companyPage.number})}"
                                aria-label="이전 페이지"
                            >‹</a>
                            <a
                                th:each="pageNumber : ${#numbers.sequence(startPage, endPage)}"
                                th:classappend="${pageNumber == companyPage.number + 1} ? ' is-current'"
                                th:attr="aria-current=${pageNumber == companyPage.number + 1} ? 'page'"
                                th:href="@{/admin/company(status=${selectedStatus},keyword=${keyword},page=${pageNumber})}"
                                th:text="${pageNumber}"
                            >1</a>
                            <a
                                th:if="${!companyPage.last}"
                                th:href="@{/admin/company(status=${selectedStatus},keyword=${keyword},page=${companyPage.number + 2})}"
                                aria-label="다음 페이지"
                            >›</a>
                        </nav>
                    </section>
                </main>
            </div>

            <footer th:replace="~{common/admin-footer :: adminFooter}"></footer>
        </div>

        <div th:replace="~{modal/admin/company-approval :: companyApprovalModal}"></div>

        <script th:src="@{/js/modal/admin/company-approval.js}"></script>
    </body>
</html>
