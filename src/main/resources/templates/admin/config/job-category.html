<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>직무 카테고리 | 첫출근 관리자</title>
    <link rel="stylesheet" th:href="@{/css/admin/common.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/config/common.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/config/job-skill.css}" />
    <link rel="stylesheet" th:href="@{/css/modal/common.css}" />
    <link rel="stylesheet" th:href="@{/css/modal/admin/admin-modal.css}" />
    <link
      rel="stylesheet"
      th:href="@{/css/modal/admin/config/config-modal.css}"
    />
  </head>
  <body>
    <form
      id="jobCategoryCreateForm"
      th:action="@{/admin/config/job-category}"
      method="post"
      hidden
    >
      <input name="categoryType" data-category-form-type />
      <input name="categoryName" data-category-form-name />
      <input name="parentId" data-category-form-parent />
    </form>
    <form
      id="jobCategoryEditForm"
      th:action="@{/admin/config/job-category/edit}"
      method="post"
      hidden
    >
      <input name="categoryId" data-category-edit-id />
      <input name="categoryName" data-category-edit-name />
      <input name="parentId" data-category-edit-parent />
    </form>
    <form
      id="jobCategoryDeleteForm"
      th:action="@{/admin/config/job-category/delete}"
      method="post"
      hidden
    >
      <input name="categoryId" data-category-delete-id />
    </form>
    <form
      id="jobCategoryRestoreForm"
      th:action="@{/admin/config/job-category/restore}"
      method="post"
      hidden
    >
      <input name="categoryId" data-category-restore-id />
    </form>
    <form
      id="jobCategoryReorderForm"
      th:action="@{/admin/config/job-category/reorder}"
      method="post"
      hidden
    >
      <input name="parentId" data-sort-form-parent />
    </form>
    <div
      th:if="${restoreCategoryId}"
      data-category-restore-prompt
      th:attr="data-category-id=${restoreCategoryId},data-category-name=${restoreCategoryName},data-category-depth=${restoreCategoryDepth}"
      hidden
    ></div>
    <div class="wrapper">
      <header th:replace="~{common/admin-header :: adminHeader}"></header>
      <div class="container">
        <aside th:replace="~{common/admin-aside :: adminAside}"></aside>
        <main class="admin-operation">
          <p
            class="config-feedback config-feedback--success"
            th:if="${configMessage}"
            th:text="${configMessage}"
          ></p>
          <p
            class="config-feedback config-feedback--error"
            th:if="${configError}"
            th:text="${configError}"
          ></p>
          <div class="operation-heading">
            <div>
              <h1>직무·기술 관리</h1>
              <p>
                회원 프로필·채용공고·검색에서 공통으로 사용하는 직무 분류를
                관리합니다.
              </p>
            </div>
            <button
              class="operation-primary"
              data-modal-open="category"
              data-modal-title="카테고리 등록"
            >
              + 카테고리 등록
            </button>
          </div>
          <nav class="config-tabs">
            <a
              class="config-tab is-active"
              th:href="@{/admin/config/job-category}"
            >
              직무 카테고리
            </a>
            <a class="config-tab" th:href="@{/admin/config/skill}">
              기술 스택
            </a>
          </nav>
          <section class="operation-stats">
            <article class="operation-stat">
              <span>1차 카테고리</span>
              <strong th:text="|${#lists.size(rootCategories)}개|">0개</strong>
            </article>
            <article class="operation-stat">
              <span>2차 카테고리</span>
              <strong th:text="|${activeChildCategoryCount}개|">0개</strong>
            </article>
            <article class="operation-stat">
              <span>사용 건수</span>
              <strong
                th:text="|${#numbers.formatInteger(totalJobCategoryUsageCount, 1, 'COMMA')}건|"
              >
                0건
              </strong>
            </article>
          </section>
          <div class="config-grid">
            <section class="config-box">
              <h2>1차 카테고리</h2>
              <div
                class="config-list"
                data-category-list
                data-sort-list
                data-sort-form-id="jobCategoryReorderForm"
              >
                <div
                  class="config-category-item"
                  th:each="category : ${rootCategories}"
                  th:classappend="${selectedRootCategory != null and selectedRootCategory.jobCategoryId == category.jobCategoryId} ? ' is-active'"
                  th:attr="data-sort-id=${category.jobCategoryId}"
                  data-sort-item
                >
                  <button
                    type="button"
                    class="config-drag-handle"
                    th:attr="aria-label=|${category.categoryName} 순서 변경|"
                    title="드래그하여 순서 변경"
                  ></button>
                  <a
                    class="config-category-select"
                    th:href="@{/admin/config/job-category(categoryId=${category.jobCategoryId})}"
                  >
                    <strong th:text="${category.categoryName}">
                      개발·데이터
                    </strong>
                    <small
                      th:text="|${childCountsByRoot.getOrDefault(category.jobCategoryId, 0)}개|"
                    >
                      0개
                    </small>
                  </a>
                  <div class="config-category-actions">
                    <button
                      class="config-category-action"
                      data-modal-open="category"
                      data-modal-title="1차 카테고리 수정"
                      data-category-level="primary"
                      th:attr="aria-label=|${category.categoryName} 수정|,data-modal-value=${category.categoryName},data-modal-id=${category.jobCategoryId}"
                    >
                      수정
                    </button>
                    <button
                      class="config-category-action config-category-action--delete"
                      data-modal-open="category-delete"
                      data-category-level="primary"
                      th:attr="aria-label=|${category.categoryName} 삭제|,data-modal-value=${category.categoryName},data-modal-id=${category.jobCategoryId}"
                    >
                      삭제
                    </button>
                  </div>
                </div>
                <p
                  class="config-empty"
                  th:if="${#lists.isEmpty(rootCategories)}"
                >
                  등록된 1차 카테고리가 없습니다.
                </p>
              </div>
            </section>
            <section
              class="config-box"
              data-category-detail
              data-sort-list
              data-sort-form-id="jobCategoryReorderForm"
              th:attr="data-sort-parent-id=${selectedRootCategory != null ? selectedRootCategory.jobCategoryId : ''}"
            >
              <h2
                data-category-title
                th:text="${selectedRootCategory != null} ? |${selectedRootCategory.categoryName} 하위 직무| : '하위 직무'"
              >
                하위 직무
              </h2>
              <div class="config-row config-row--head">
                <span aria-hidden="true"></span>
                <span>직무명</span>
                <span>사용 건수</span>
                <span>관리</span>
              </div>
              <div
                th:each="category : ${childCategories}"
                class="config-row"
                th:attr="data-sort-id=${category.jobCategoryId}"
                data-sort-item
              >
                <button
                  type="button"
                  class="config-drag-handle"
                  th:attr="aria-label=|${category.categoryName} 순서 변경|"
                  title="드래그하여 순서 변경"
                ></button>
                <strong th:text="${category.categoryName}">백엔드 개발</strong>
                <span
                  th:text="|${#numbers.formatInteger(jobCategoryUsageCounts.getOrDefault(category.jobCategoryId, 0), 1, 'COMMA')}건|"
                >
                  0건
                </span>
                <div class="config-actions">
                  <button
                    class="table-action"
                    data-modal-open="category"
                    data-modal-title="카테고리 수정"
                    data-category-level="secondary"
                    th:attr="data-modal-value=${category.categoryName},data-modal-id=${category.jobCategoryId},data-parent-category=${selectedRootCategory.categoryName},data-parent-id=${selectedRootCategory.jobCategoryId},data-usage-count=${jobCategoryUsageCounts.getOrDefault(category.jobCategoryId, 0)}"
                  >
                    수정
                  </button>
                  <button
                    class="table-action table-action--delete"
                    data-modal-open="category-delete"
                    data-category-level="secondary"
                    th:attr="data-modal-value=${category.categoryName},data-modal-id=${category.jobCategoryId}"
                  >
                    삭제
                  </button>
                </div>
              </div>
              <p
                class="config-empty"
                th:if="${#lists.isEmpty(childCategories)}"
              >
                등록된 하위 직무가 없습니다.
              </p>
            </section>
          </div>
          <p class="operation-note">
            회원 희망 직무·채용공고에서 사용 중인 직무는 삭제할 수 없습니다.
          </p>
        </main>
      </div>
      <footer th:replace="~{common/admin-footer :: adminFooter}"></footer>
    </div>
    <select data-root-category-source hidden>
      <option
        th:each="category : ${rootCategories}"
        th:value="${category.jobCategoryId}"
        th:text="${category.categoryName}"
      ></option>
    </select>
    <div th:replace="~{modal/common/confirm-modal :: confirmModal}"></div>
    <div th:replace="~{modal/common/form-modal :: formModal}"></div>
    <script th:src="@{/js/modal.js}"></script>
    <script th:src="@{/js/admin/config/sortable.js}"></script>
    <script th:src="@{/js/modal/admin/config/config-modal.js}"></script>
  </body>
</html>
