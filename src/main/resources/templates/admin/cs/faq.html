<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAQ 관리 | 첫출근 관리자</title>
    <link rel="stylesheet" th:href="@{/css/admin/common.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/section-common.css}" />
    <link rel="stylesheet" th:href="@{/css/modal/common.css}" />
    <link rel="stylesheet" th:href="@{/css/modal/admin/admin-modal.css}" />
    <link rel="stylesheet" th:href="@{/css/modal/admin/cs/faq-modal.css}" />
</head>
<body>
<div class="wrapper">
    <header th:replace="~{common/admin-header :: adminHeader}"></header>
    <div class="container">
        <aside th:replace="~{common/admin-aside :: adminAside}"></aside>
        <main class="admin-section">
            <div class="page-header-row">
                <div class="page-header"><h1>고객센터 관리 · FAQ</h1><p>공지사항·FAQ를 관리하고 회원 문의에 답변합니다.</p></div>
                <button type="button" class="btn btn-primary" id="btnOpenCreate">+ FAQ 등록</button>
            </div>
            <div th:replace="~{common/admin-stat-grid :: statGrid(${pendingCount}, ${noticeCount}, ${faqCount})}"></div>
            <div class="panel">
                <nav class="tabs" aria-label="고객센터 관리 메뉴">
                    <a class="tab" th:href="@{/admin/cs/notice}">공지사항</a>
                    <a class="tab active" th:href="@{/admin/cs/faq}">FAQ</a>
                    <a class="tab" th:href="@{/admin/cs/qna}">1:1 문의</a>
                </nav>
                <div class="filter-bar">
                    <select id="filterCategory" aria-label="카테고리">
                        <option value="">카테고리 전체</option>
                    </select>
                    <input type="text" id="filterKeyword" placeholder="질문 검색" aria-label="질문 검색" />
                    <button type="button" class="btn-search" id="btnSearch">검색</button>
                    <span class="result-count">총 <span id="resultCount">0</span>건</span>
                </div>
                <div class="table-wrap">
                    <table class="data-table">
                        <thead><tr><th>번호</th><th>카테고리</th><th>질문</th><th>등록일</th><th>수정일</th><th>관리</th></tr></thead>
                        <tbody id="faqTableBody">
                        <tr><td colspan="6" class="empty-row">불러오는 중...</td></tr>
                        </tbody>
                    </table>
                </div>
                <nav class="pagination" id="pagination" aria-label="FAQ 페이지"></nav>
            </div>
        </main>
    </div>
    <footer th:replace="~{common/admin-footer :: adminFooter}"></footer>
</div>

<!-- FAQ 등록/수정 모달 -->
<div class="admin-modal" id="faqModal">
    <div class="admin-modal__backdrop" id="faqModalBackdrop"></div>
    <section class="admin-modal__dialog faq-modal" role="dialog" aria-modal="true" aria-labelledby="faqModalTitle">
        <header class="admin-modal__header">
            <h2 id="faqModalTitle">FAQ 등록</h2>
            <button type="button" class="admin-modal__close" id="btnModalClose" aria-label="닫기">&times;</button>
        </header>
        <div class="admin-modal__body faq-modal-body">
            <input type="hidden" id="faqId" />
            <div class="faq-form-row">
                <label for="faqCategorySelect">카테고리</label>
                <select id="faqCategorySelect"></select>
            </div>
            <div class="faq-form-row">
                <label for="faqQuestion">질문</label>
                <input type="text" id="faqQuestion" placeholder="질문을 입력하세요" maxlength="500" />
            </div>
            <div class="faq-form-row">
                <label for="faqAnswer">답변</label>
                <textarea id="faqAnswer" rows="6" placeholder="답변을 입력하세요"></textarea>
            </div>
            <p class="faq-modal-hint">등록하면 사용자 FAQ 목록에 즉시 노출되며, 수정 내용도 바로 반영됩니다.</p>
        </div>
        <div class="admin-modal__footer faq-modal-footer">
            <button type="button" class="admin-modal-button admin-modal-button--outline" id="btnModalCancel">취소</button>
            <button type="button" class="admin-modal-button admin-modal-button--primary" id="btnModalSave">저장</button>
        </div>
    </section>
</div>

<div th:replace="~{modal/common/confirm-modal :: confirmModal}"></div>
<script th:src="@{/js/modal.js}"></script>
<script th:src="@{/js/common.js}"></script>
<script th:inline="javascript">
    (function () {
        const API_BASE = /*[[@{/admin/cs/faq}]]*/ '/admin/cs/faq';

        let currentPage = 1;
        let categories = [];
        document.getElementById('confirmModal')?.classList.add('admin-common-modal');

        const el = {
            filterCategory: document.getElementById('filterCategory'),
            filterKeyword: document.getElementById('filterKeyword'),
            btnSearch: document.getElementById('btnSearch'),
            tableBody: document.getElementById('faqTableBody'),
            pagination: document.getElementById('pagination'),
            resultCount: document.getElementById('resultCount'),
            statFaqCount: document.querySelector('.stat-grid .stat-card.green .value'),
            modal: document.getElementById('faqModal'),
            modalTitle: document.getElementById('faqModalTitle'),
            faqId: document.getElementById('faqId'),
            faqCategorySelect: document.getElementById('faqCategorySelect'),
            faqQuestion: document.getElementById('faqQuestion'),
            faqAnswer: document.getElementById('faqAnswer'),
        };

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        async function loadCategories() {
            const res = await fetch(`${API_BASE}/api/categories`);
            if (!res.ok) throw new Error(`카테고리 조회 실패 (HTTP ${res.status})`);
            categories = await res.json();

            el.filterCategory.innerHTML = '<option value="">카테고리 전체</option>' +
                categories.map(c => `<option value="${c.faqCategoryId}">${escapeHtml(c.categoryName)}</option>`).join('');

            el.faqCategorySelect.innerHTML =
                categories.map(c => `<option value="${c.faqCategoryId}">${escapeHtml(c.categoryName)}</option>`).join('');
        }

        async function loadList(page = 1) {
            currentPage = page;
            const params = new URLSearchParams();
            if (el.filterCategory.value) params.set('categoryId', el.filterCategory.value);
            if (el.filterKeyword.value.trim()) params.set('keyword', el.filterKeyword.value.trim());
            params.set('page', page);

            el.tableBody.innerHTML = '<tr><td colspan="6" class="faq-empty-row">불러오는 중...</td></tr>';

            const res = await fetch(`${API_BASE}/api/list?${params.toString()}`);
            if (!res.ok) throw new Error(`목록 조회 실패 (HTTP ${res.status})`);
            const data = await res.json();

            renderTable(data.items);
            renderPagination(data.totalPages, data.page);
            el.resultCount.textContent = data.totalCount;
            el.statFaqCount.textContent = data.totalCount + '건';
        }

        function renderTable(items) {
            if (!items || items.length === 0) {
                el.tableBody.innerHTML = '<tr><td colspan="6" class="faq-empty-row">등록된 FAQ가 없습니다.</td></tr>';
                return;
            }
            el.tableBody.innerHTML = items.map(item => `
            <tr data-id="${item.faqId}">
                <td>${item.faqId}</td>
                <td><span class="tag blue">${escapeHtml(item.categoryName || '-')}</span></td>
                <td>${escapeHtml(item.question)}</td>
                <td>${item.createdAtText}</td>
                <td>${item.updatedAtText}</td>
                <td class="row-actions">
                    <a href="#" class="js-edit" data-id="${item.faqId}">수정</a><span class="sep">·</span><a href="#" class="js-delete" data-id="${item.faqId}">삭제</a>
                </td>
            </tr>
        `).join('');
        }

        function renderPagination(totalPages, page) {
            if (totalPages <= 1) { el.pagination.innerHTML = ''; return; }
            let html = '';
            for (let p = 1; p <= totalPages; p++) {
                html += `<a href="#" class="${p === page ? 'active' : ''}" data-page="${p}">${p}</a>`;
            }
            el.pagination.innerHTML = html;
        }

        function openModal(mode, detail) {
            el.modal.classList.add('is-open');
            if (mode === 'edit' && detail) {
                el.modalTitle.textContent = 'FAQ 수정';
                el.faqId.value = detail.faqId;
                el.faqCategorySelect.value = detail.faqCategoryId;
                el.faqQuestion.value = detail.question;
                el.faqAnswer.value = detail.answer;
            } else {
                el.modalTitle.textContent = 'FAQ 등록';
                el.faqId.value = '';
                el.faqCategorySelect.value = categories[0] ? categories[0].faqCategoryId : '';
                el.faqQuestion.value = '';
                el.faqAnswer.value = '';
            }
        }

        function closeModal() {
            el.modal.classList.remove('is-open');
        }

        async function saveFaq() {
            const question = el.faqQuestion.value.trim();
            const answer = el.faqAnswer.value.trim();
            const faqCategoryId = el.faqCategorySelect.value;

            if (!faqCategoryId) { showFaqMessage('카테고리를 선택해주세요.'); return; }
            if (!question) { showFaqMessage('질문을 입력해주세요.'); return; }
            if (!answer) { showFaqMessage('답변을 입력해주세요.'); return; }

            const body = JSON.stringify({ faqCategoryId: Number(faqCategoryId), question, answer });
            const id = el.faqId.value;

            try {
                const res = await fetch(id ? `${API_BASE}/api/${id}` : `${API_BASE}/api`, {
                    method: id ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body,
                });

                if (!res.ok) {
                    const text = await res.text().catch(() => '');
                    showFaqMessage(`저장 중 오류가 발생했습니다. (HTTP ${res.status})\n${text}`);
                    return;
                }

                closeModal();
                showFaqSuccess(
                    id ? 'FAQ가 수정되었습니다.' : 'FAQ가 등록되었습니다.',
                    () => loadList(id ? currentPage : 1)
                );
            } catch (err) {
                console.error(err);
                showFaqMessage('저장 요청 중 네트워크 오류가 발생했습니다.');
            }
        }

        function deleteFaq(id) {
            showConfirmModal({
                iconClass: 'danger',
                iconHtml: '<span aria-hidden="true">!</span>',
                title: 'FAQ를 삭제할까요?',
                message: '삭제하면 사용자 FAQ 화면에서도 즉시 사라집니다.',
                leftText: '취소',
                rightText: '삭제',
                rightClass: 'btn-danger',
                onRight: () => deleteFaqConfirmed(id)
            });
        }

        async function deleteFaqConfirmed(id) {
            try {
                const res = await fetch(`${API_BASE}/api/${id}`, { method: 'DELETE' });
                if (!res.ok) {
                    showFaqMessage(`삭제 중 오류가 발생했습니다. (HTTP ${res.status})`);
                    return;
                }
                showFaqSuccess('FAQ가 삭제되었습니다.', () => loadList(currentPage));
            } catch (err) {
                console.error(err);
                showFaqMessage('삭제 요청 중 네트워크 오류가 발생했습니다.');
            }
        }

        function showFaqMessage(message) {
            showConfirmModal({
                iconClass: 'info',
                iconHtml: '<span aria-hidden="true">?</span>',
                title: '안내',
                message,
                leftVisible: false,
                rightText: '확인'
            });
        }

        function showFaqSuccess(title, onConfirm) {
            showConfirmModal({
                iconClass: 'success',
                iconHtml: '<span aria-hidden="true">✓</span>',
                title,
                message: '변경된 내용을 FAQ 목록에 반영했습니다.',
                leftVisible: false,
                rightText: '확인',
                onRight: onConfirm
            });
        }

        // 이벤트 바인딩
        document.getElementById('btnOpenCreate').addEventListener('click', () => openModal('create'));
        document.getElementById('btnModalClose').addEventListener('click', closeModal);
        document.getElementById('btnModalCancel').addEventListener('click', closeModal);
        document.getElementById('faqModalBackdrop').addEventListener('click', closeModal);
        document.getElementById('btnModalSave').addEventListener('click', saveFaq);
        el.btnSearch.addEventListener('click', () => loadList(1));
        el.filterCategory.addEventListener('change', () => loadList(1));
        el.filterKeyword.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadList(1); });

        el.tableBody.addEventListener('click', async (e) => {
            const editBtn = e.target.closest('.js-edit');
            const delBtn = e.target.closest('.js-delete');
            if (editBtn) {
                e.preventDefault();
                const id = editBtn.dataset.id;
                try {
                    const res = await fetch(`${API_BASE}/api/${id}`);
                    if (!res.ok) { showFaqMessage(`상세 조회 실패 (HTTP ${res.status})`); return; }
                    const detail = await res.json();
                    openModal('edit', detail);
                } catch (err) {
                    console.error(err);
                    showFaqMessage('상세 조회 중 네트워크 오류가 발생했습니다.');
                }
            } else if (delBtn) {
                e.preventDefault();
                deleteFaq(delBtn.dataset.id);
            }
        });

        el.pagination.addEventListener('click', (e) => {
            const a = e.target.closest('a[data-page]');
            if (!a) return;
            e.preventDefault();
            loadList(Number(a.dataset.page));
        });

        (async function init() {
            try {
                await loadCategories();
                await loadList(1);
            } catch (err) {
                console.error(err);
                el.tableBody.innerHTML = `<tr><td colspan="6" class="faq-empty-row">데이터를 불러오지 못했습니다: ${escapeHtml(err.message)}</td></tr>`;
            }
        })();
    })();
</script>
</body>
</html>
