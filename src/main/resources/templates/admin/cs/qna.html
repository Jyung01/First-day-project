<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1:1 문의 관리 | 첫출근 관리자</title>
    <link rel="stylesheet" th:href="@{/css/admin/common.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/section-common.css}" />
    <link rel="stylesheet" th:href="@{/css/modal/common.css}" />
    <link rel="stylesheet" th:href="@{/css/modal/admin/admin-modal.css}" />
    <link rel="stylesheet" th:href="@{/css/modal/admin/cs/qna-modal.css}" />
</head>
<body>
<div class="wrapper">
    <header th:replace="~{common/admin-header :: adminHeader}"></header>
    <div class="container">
        <aside th:replace="~{common/admin-aside :: adminAside}"></aside>
        <main class="admin-section">
            <div class="page-header"><h1>고객센터 관리 · 1:1 문의</h1><p>공지사항·FAQ를 관리하고 회원 문의에 답변합니다.</p></div>
            <div th:replace="~{common/admin-stat-grid :: statGrid(${pendingCount}, ${noticeCount}, ${faqCount})}"></div>
            <div class="panel">
                <nav class="tabs" aria-label="고객센터 관리 메뉴">
                    <a class="tab" th:href="@{/admin/cs/notice}">공지사항</a><a class="tab" th:href="@{/admin/cs/faq}">FAQ</a><a class="tab active" th:href="@{/admin/cs/qna}">1:1 문의</a>
                </nav>
                <form class="filter-bar" method="get" th:action="@{/admin/cs/qna}">
                    <select name="categoryId" aria-label="문의 유형" onchange="this.form.submit()">
                        <option value="">문의 유형 전체</option>
                        <option th:each="c : ${categories}"
                                th:value="${c.inquiryCategoryId}"
                                th:text="${c.categoryName}"
                                th:selected="${categoryId != null and categoryId == c.inquiryCategoryId}"></option>
                    </select>
                    <select name="memberType" aria-label="회원 유형" onchange="this.form.submit()">
                        <option value="">회원 유형 전체</option>
                        <option value="개인" th:selected="${memberType == '개인'}">개인회원</option>
                        <option value="기업" th:selected="${memberType == '기업'}">기업회원</option>
                    </select>
                    <select name="status" aria-label="답변 상태" onchange="this.form.submit()">
                        <option value="">답변 상태 전체</option>
                        <option value="PENDING" th:selected="${status == 'PENDING'}">미답변</option>
                        <option value="ANSWERED" th:selected="${status == 'ANSWERED'}">답변완료</option>
                    </select>
                    <input type="text" name="keyword" placeholder="제목·작성자 검색" aria-label="제목 또는 작성자 검색" th:value="${keyword}" />
                    <button type="submit" class="btn-search">검색</button>
                    <span class="result-count" th:text="'총 ' + ${totalCount} + '건'">총 116건</span>
                </form>
                <div class="table-wrap">
                    <table class="data-table">
                        <thead><tr><th>번호</th><th>회원 유형</th><th>문의 유형</th><th>제목</th><th>작성자</th><th>작성일</th><th>상태</th><th>관리</th></tr></thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(inquiries)}">
                            <td colspan="8" style="text-align:center;color:#8a93a3;padding:40px 0;">등록된 문의가 없습니다.</td>
                        </tr>
                        <tr th:each="inq : ${inquiries}">
                            <td th:text="'Q-' + ${inq.inquiryId}">Q-128</td>
                            <td><span class="tag" th:text="${inq.memberType}">개인회원</span></td>
                            <td th:text="${inq.categoryName}">회원·계정</td>
                            <td th:text="${inq.title}">제목</td>
                            <td th:text="${inq.writerLabel}">회원 #1</td>
                            <td th:text="${inq.createdAt}">07.22</td>
                            <td>
                                <span class="tag red" th:if="${inq.status != '답변완료'}" th:text="${inq.statusLabel}">미답변</span>
                                <span class="tag green" th:if="${inq.status == '답변완료'}" th:text="${inq.statusLabel}">답변완료</span>
                            </td>
                            <td class="row-actions">
                                <a th:attr="onclick=|openQnaModal(${inq.inquiryId})|"
                                   th:text="${inq.status == '답변완료'} ? '상세' : '답변'">답변</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <nav class="pagination" aria-label="문의 페이지" th:if="${totalPages > 1}">
                    <a th:each="p : ${#numbers.sequence(0, totalPages - 1)}"
                       th:href="@{/admin/cs/qna(page=${p}, categoryId=${categoryId}, memberType=${memberType}, status=${status}, keyword=${keyword})}"
                       th:text="${p + 1}"
                       th:classappend="${p == currentPage} ? 'active' : ''"></a>
                </nav>
            </div>
        </main>
    </div>
    <footer th:replace="~{common/admin-footer :: adminFooter}"></footer>
</div>

<!-- 답변/상세 모달 -->
<div class="admin-modal" id="qnaModalOverlay">
    <div class="admin-modal__backdrop" onclick="closeQnaModal()"></div>
    <section class="admin-modal__dialog qna-modal" role="dialog" aria-modal="true" aria-labelledby="qnaTitle">
        <header class="admin-modal__header qna-modal-head">
            <div>
                <span id="qnaStatusBadge" class="tag red">미답변</span>
                <h2 id="qnaTitle">제목</h2>
                <div class="qna-modal-meta">
                    <span id="qnaCategory"></span>
                    <span>·</span>
                    <span id="qnaWriter"></span>
                    <span>·</span>
                    <span id="qnaCreatedAt"></span>
                </div>
            </div>
            <button type="button" class="admin-modal__close" onclick="closeQnaModal()" aria-label="닫기">×</button>
        </header>

        <div class="admin-modal__body qna-modal-body">
            <p class="qna-question-label">문의 내용</p>
            <p id="qnaContent" class="qna-question-content"></p>
            <div id="qnaAttachments" class="qna-attach-list"></div>

            <div class="qna-answer-section">
                <p class="section-title">관리자 답변</p>

            <!-- 답변완료: 조회 모드 -->
            <div id="answerViewBlock" style="display:none;">
                <div class="qna-answer-view" id="answerViewText"></div>
                <div class="qna-answer-view-meta" id="answerViewMeta"></div>
                <div class="admin-modal__footer qna-answer-actions">
                    <button type="button" class="admin-modal-button admin-modal-button--danger" onclick="deleteAnswer()">삭제</button>
                    <button type="button" class="admin-modal-button admin-modal-button--outline" onclick="enterEditMode()">수정</button>
                </div>
            </div>

            <!-- 미답변 또는 수정 모드: 입력 폼 -->
            <div id="answerFormBlock" style="display:none;">
                <textarea id="answerInput" class="qna-answer-input" maxlength="2000" placeholder="답변 내용을 입력해주세요."></textarea>
                <p class="qna-form-error" id="answerError"></p>
                <div class="admin-modal__footer qna-answer-actions">
                    <button type="button" class="admin-modal-button admin-modal-button--outline" id="answerCancelBtn" onclick="cancelAnswerForm()">취소</button>
                    <button type="button" class="admin-modal-button admin-modal-button--primary" id="answerSubmitBtn" onclick="submitAnswer()">저장</button>
                </div>
            </div>
        </div>
        </div>
    </section>
</div>

<div th:replace="~{modal/common/confirm-modal :: confirmModal}"></div>
<script th:src="@{/js/modal.js}"></script>

<script th:inline="javascript">
    const API_BASE = /*[[@{/admin/cs/qna}]]*/ '/admin/cs/qna';
    document.getElementById('confirmModal')?.classList.add('admin-common-modal');

    let currentInquiryId = null;
    let currentHasAnswer = false;

    function formatSize(bytes) {
        if (bytes == null) return '';
        if (bytes < 1024) return bytes + 'B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'KB';
        return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
    }

    async function openQnaModal(inquiryId) {
        currentInquiryId = inquiryId;
        const res = await fetch(`${API_BASE}/${inquiryId}`);
        if (!res.ok) {
            showQnaNotice('문의 정보를 불러오지 못했습니다.');
            return;
        }
        const data = await res.json();

        document.getElementById('qnaTitle').textContent = data.title;
        document.getElementById('qnaCategory').textContent = data.categoryName;
        document.getElementById('qnaWriter').textContent = data.writerLabel;
        document.getElementById('qnaCreatedAt').textContent = data.createdAt;
        document.getElementById('qnaContent').textContent = data.content;

        const badge = document.getElementById('qnaStatusBadge');
        badge.textContent = data.statusLabel;
        badge.className = 'tag ' + (data.status === '답변완료' ? 'green' : 'red');

        const attachWrap = document.getElementById('qnaAttachments');
        attachWrap.innerHTML = '';
        (data.attachments || []).forEach(a => {
            const chip = document.createElement('div');
            chip.className = 'qna-attach-chip';

            const link = document.createElement('a');
            link.className = 'qna-attach-link';
            link.href = `${API_BASE}/attachment/${a.attachmentId}`;
            link.textContent = a.originalName;
            link.setAttribute('download', '');

            const size = document.createElement('span');
            size.textContent = formatSize(a.fileSize);

            chip.append(link, size);
            attachWrap.appendChild(chip);
        });

        currentHasAnswer = data.status === '답변완료' && !!data.answerContent;

        if (currentHasAnswer) {
            document.getElementById('answerViewText').textContent = data.answerContent;
            document.getElementById('answerViewMeta').textContent = data.answeredAt ? `답변일시 ${data.answeredAt}` : '';
            showViewMode();
        } else {
            document.getElementById('answerInput').value = '';
            showFormMode(false);
        }

        clearError();
        document.getElementById('qnaModalOverlay').classList.add('is-open');
    }

    function closeQnaModal() {
        document.getElementById('qnaModalOverlay').classList.remove('is-open');
        currentInquiryId = null;
    }

    function showViewMode() {
        document.getElementById('answerViewBlock').style.display = 'block';
        document.getElementById('answerFormBlock').style.display = 'none';
    }

    function showFormMode(isEdit) {
        document.getElementById('answerViewBlock').style.display = 'none';
        document.getElementById('answerFormBlock').style.display = 'block';
        document.getElementById('answerCancelBtn').style.display = isEdit || currentHasAnswer ? 'inline-block' : 'none';
        document.getElementById('answerSubmitBtn').textContent = isEdit ? '수정 저장' : '답변 등록';
        document.getElementById('answerSubmitBtn').dataset.mode = isEdit ? 'edit' : 'create';
    }

    function enterEditMode() {
        document.getElementById('answerInput').value = document.getElementById('answerViewText').textContent;
        clearError();
        showFormMode(true);
    }

    function cancelAnswerForm() {
        if (currentHasAnswer) {
            showViewMode();
        } else {
            closeQnaModal();
        }
    }

    function clearError() {
        const err = document.getElementById('answerError');
        err.style.display = 'none';
        err.textContent = '';
    }

    function showError(msg) {
        const err = document.getElementById('answerError');
        err.textContent = msg;
        err.style.display = 'block';
    }

    async function submitAnswer() {
        const content = document.getElementById('answerInput').value.trim();
        if (!content) {
            showError('답변 내용을 입력해주세요.');
            return;
        }
        const mode = document.getElementById('answerSubmitBtn').dataset.mode;
        const method = mode === 'edit' ? 'PUT' : 'POST';

        const res = await fetch(`${API_BASE}/${currentInquiryId}/answer`, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ answerContent: content })
        });

        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            showError(err.message || '저장 중 오류가 발생했습니다.');
            return;
        }

        const successTitle = mode === 'edit'
            ? '답변이 수정되었습니다.'
            : '답변이 등록되었습니다.';
        closeQnaModal();
        showQnaSuccess(successTitle);
    }

    function deleteAnswer() {
        const inquiryId = currentInquiryId;
        closeQnaModal();

        showConfirmModal({
            iconClass: 'danger',
            iconHtml: '<span aria-hidden="true">!</span>',
            title: '답변을 삭제할까요?',
            message: '삭제하면 해당 문의는 다시 미답변 상태로 변경됩니다.',
            leftText: '취소',
            rightText: '삭제',
            rightClass: 'btn-danger',
            onRight: () => deleteAnswerConfirmed(inquiryId)
        });
    }

    async function deleteAnswerConfirmed(inquiryId) {
        const res = await fetch(`${API_BASE}/${inquiryId}/answer`, { method: 'DELETE' });
        if (!res.ok) {
            showQnaNotice('답변 삭제 중 오류가 발생했습니다.');
            return;
        }

        showQnaSuccess('답변이 삭제되었습니다.');
    }

    function showQnaNotice(message) {
        showConfirmModal({
            iconClass: 'info',
            iconHtml: '<span aria-hidden="true">?</span>',
            title: '안내',
            message,
            leftVisible: false,
            rightText: '확인'
        });
    }

    function showQnaSuccess(title) {
        showConfirmModal({
            iconClass: 'success',
            iconHtml: '<span aria-hidden="true">✓</span>',
            title,
            message: '변경된 내용을 문의 목록에 반영했습니다.',
            leftVisible: false,
            rightText: '확인',
            onRight: () => location.reload()
        });
    }
</script>
</body>
</html>
