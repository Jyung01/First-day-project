<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1:1 문의 관리 | 첫출근 관리자</title>
    <link rel="stylesheet" th:href="@{/css/admin/common.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/section-common.css}" />
    <style>
        /* 답변 모달 전용 스타일 - FAQ 수정 모달과 동일한 다크 테마 */
        .qna-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:200;}
        .qna-modal-overlay.open{display:flex;}
        .qna-modal{background:#1c2436;border:1px solid #2a3348;border-radius:14px;width:560px;max-width:92vw;max-height:86vh;overflow-y:auto;padding:26px 28px;color:#e8ecf5;}
        .qna-modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
        .qna-modal-head h2{font-size:17px;margin:6px 0 8px;color:#e8ecf5;font-weight:700;}
        .qna-modal-meta{color:#9aa5bd;font-size:12.5px;display:flex;gap:8px;}
        .qna-modal-close{background:none;border:none;font-size:20px;cursor:pointer;line-height:1;color:#9aa5bd;}
        .qna-modal-close:hover{color:#fff;}
        .qna-modal-body p{font-size:14px;line-height:1.6;white-space:pre-wrap;color:#c7cede;}
        .qna-attach-list{margin:10px 0 16px;display:flex;flex-direction:column;gap:6px;}
        .qna-attach-chip{font-size:12.5px;color:#9aa5bd;background:#161d2c;border:1px solid #2a3348;padding:6px 10px;border-radius:6px;display:flex;justify-content:space-between;}
        .qna-answer-section{border-top:1px solid #2a3348;padding-top:16px;margin-top:8px;}
        .qna-answer-section .section-title{font-size:14px;font-weight:700;color:#e8ecf5;margin-bottom:10px;}
        .qna-answer-view{background:#161d2c;border:1px solid #2a3348;border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;color:#c7cede;}
        .qna-answer-view-meta{color:#9aa5bd;font-size:12px;margin-top:8px;}
        .qna-answer-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;}
        .qna-answer-input{width:100%;min-height:120px;background:#161d2c;border:1px solid #2a3348;color:#e8ecf5;border-radius:8px;padding:12px 14px;font-size:13.5px;resize:vertical;font-family:inherit;}
        .qna-answer-input::placeholder{color:#6b7488;}
        .qna-answer-input:focus{outline:none;border-color:#5b6ef5;}
        .qna-form-error{color:#ef5b6c;font-size:12.5px;margin-top:6px;display:none;}
        .btn-sm{padding:8px 18px;font-size:13px;border-radius:8px;cursor:pointer;font-weight:600;}
        .btn-sm.primary{background:#5b6ef5;color:#fff;border:none;}
        .btn-sm.primary:hover{background:#4657e0;}
        .btn-sm.outline{background:transparent;border:1px solid #3a4360;color:#c7cede;}
        .btn-sm.outline:hover{border-color:#5b6ef5;color:#fff;}
        .btn-sm.danger{background:transparent;border:1px solid #ef5b6c;color:#ef5b6c;}
        .btn-sm.danger:hover{background:#ef5b6c;color:#fff;}
        .row-actions a{cursor:pointer;}
        #qnaStatusBadge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;}
        #qnaStatusBadge.red{background:rgba(239,91,108,0.15);color:#ef5b6c;}
        #qnaStatusBadge.green{background:rgba(62,207,142,0.15);color:#3ecf8e;}
    </style>
</head>
<body>
<div class="wrapper">
    <header th:replace="~{common/admin-header :: adminHeader}"></header>
    <div class="container">
        <aside th:replace="~{common/admin-aside :: adminAside}"></aside>
        <main class="admin-section">
            <div class="page-header"><h1>고객센터 관리 · 1:1 문의</h1><p>공지사항·FAQ를 관리하고 회원 문의에 답변합니다.</p></div>
            <div class="stat-grid">
                <div class="stat-card"><div class="label">미답변 문의</div><div class="value" th:text="${pendingCount} + '건'">7건</div></div>
                <!-- TODO: 공지/FAQ 기능 연동 전까지 정적 표시 -->
                <div class="stat-card orange"><div class="label">공지사항</div><div class="value">24건</div></div>
                <div class="stat-card green"><div class="label">FAQ</div><div class="value">38건</div></div>
            </div>
            <div class="panel">
                <nav class="tabs" aria-label="고객센터 관리 메뉴">
                    <a class="tab" th:href="@{/admin/cs/notice}">공지사항</a><a class="tab" th:href="@{/admin/cs/faq}">FAQ</a><a class="tab active" th:href="@{/admin/cs/qna}">1:1 문의</a>
                </nav>
                <form class="filter-bar" method="get" th:action="@{/admin/cs/qna}">
                    <select name="categoryId" aria-label="문의 유형" onchange="this.form.submit()">
                        <option value="">문의 유형 전체</option>
                        <option th:each="c : ${categories}"
                                th:value="${c.inquiryCategoryId}"
                                th:text="${c.categoryName}"
                                th:selected="${categoryId != null and categoryId == c.inquiryCategoryId}"></option>
                    </select>
                    <!-- TODO: 회원 유형(개인/기업) 필드가 아직 없어 UI만 유지, 실제 필터링 미연동 -->
                    <select aria-label="회원 유형"><option>회원 유형 전체</option><option>개인</option><option>기업</option></select>
                    <select name="status" aria-label="답변 상태" onchange="this.form.submit()">
                        <option value="">답변 상태 전체</option>
                        <option value="PENDING" th:selected="${status == 'PENDING'}">미답변</option>
                        <option value="ANSWERED" th:selected="${status == 'ANSWERED'}">답변완료</option>
                    </select>
                    <input type="text" name="keyword" placeholder="제목·작성자 검색" aria-label="제목 또는 작성자 검색" th:value="${keyword}" />
                    <button type="submit" class="btn-search">검색</button>
                    <span class="result-count" th:text="'총 ' + ${totalCount} + '건'">총 116건</span>
                </form>
                <div class="table-wrap">
                    <table class="data-table">
                        <thead><tr><th>번호</th><th>회원 유형</th><th>문의 유형</th><th>제목</th><th>작성자</th><th>작성일</th><th>상태</th><th>관리</th></tr></thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(inquiries)}">
                            <td colspan="8" style="text-align:center;color:#8a93a3;padding:40px 0;">등록된 문의가 없습니다.</td>
                        </tr>
                        <tr th:each="inq : ${inquiries}">
                            <td th:text="'Q-' + ${inq.inquiryId}">Q-128</td>
                            <!-- TODO: User 엔티티 연동 후 실제 회원 유형(개인/기업)으로 교체 -->
                            <td><span class="tag">-</span></td>
                            <td th:text="${inq.categoryName}">회원·계정</td>
                            <td th:text="${inq.title}">제목</td>
                            <td th:text="${inq.writerLabel}">회원 #1</td>
                            <td th:text="${inq.createdAt}">07.22</td>
                            <td>
                                <span class="tag red" th:if="${inq.status != '답변완료'}" th:text="${inq.statusLabel}">미답변</span>
                                <span class="tag green" th:if="${inq.status == '답변완료'}" th:text="${inq.statusLabel}">답변완료</span>
                            </td>
                            <td class="row-actions">
                                <a th:attr="onclick=|openQnaModal(${inq.inquiryId})|"
                                   th:text="${inq.status == '답변완료'} ? '상세' : '답변'">답변</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <nav class="pagination" aria-label="문의 페이지" th:if="${totalPages > 1}">
                    <a th:each="p : ${#numbers.sequence(0, totalPages - 1)}"
                       th:href="@{/admin/cs/qna(page=${p}, categoryId=${categoryId}, status=${status}, keyword=${keyword})}"
                       th:text="${p + 1}"
                       th:classappend="${p == currentPage} ? 'active' : ''"></a>
                </nav>
            </div>
        </main>
    </div>
    <footer th:replace="~{common/admin-footer :: adminFooter}"></footer>
</div>

<!-- 답변/상세 모달 -->
<div class="qna-modal-overlay" id="qnaModalOverlay">
    <div class="qna-modal">
        <div class="qna-modal-head">
            <div>
                <span id="qnaStatusBadge" class="tag red">미답변</span>
                <h2 id="qnaTitle">제목</h2>
                <div class="qna-modal-meta">
                    <span id="qnaCategory"></span>
                    <span>·</span>
                    <span id="qnaWriter"></span>
                    <span>·</span>
                    <span id="qnaCreatedAt"></span>
                </div>
            </div>
            <button type="button" class="qna-modal-close" onclick="closeQnaModal()">×</button>
        </div>

        <div class="qna-modal-body">
            <p id="qnaContent"></p>
            <div id="qnaAttachments" class="qna-attach-list"></div>
        </div>

        <div class="qna-answer-section">
            <p class="section-title">관리자 답변</p>

            <!-- 답변완료: 조회 모드 -->
            <div id="answerViewBlock" style="display:none;">
                <div class="qna-answer-view" id="answerViewText"></div>
                <div class="qna-answer-view-meta" id="answerViewMeta"></div>
                <div class="qna-answer-actions">
                    <button type="button" class="btn-sm danger" onclick="deleteAnswer()">삭제</button>
                    <button type="button" class="btn-sm outline" onclick="enterEditMode()">수정</button>
                </div>
            </div>

            <!-- 미답변 또는 수정 모드: 입력 폼 -->
            <div id="answerFormBlock" style="display:none;">
                <textarea id="answerInput" class="qna-answer-input" maxlength="2000" placeholder="답변 내용을 입력해주세요."></textarea>
                <p class="qna-form-error" id="answerError"></p>
                <div class="qna-answer-actions">
                    <button type="button" class="btn-sm outline" id="answerCancelBtn" onclick="cancelAnswerForm()">취소</button>
                    <button type="button" class="btn-sm primary" id="answerSubmitBtn" onclick="submitAnswer()">저장</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const API_BASE = /*[[@{/admin/cs/qna}]]*/ '/admin/cs/qna';

    let currentInquiryId = null;
    let currentHasAnswer = false;

    function formatSize(bytes) {
        if (bytes == null) return '';
        if (bytes < 1024) return bytes + 'B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'KB';
        return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
    }

    async function openQnaModal(inquiryId) {
        currentInquiryId = inquiryId;
        const res = await fetch(`${API_BASE}/${inquiryId}`);
        if (!res.ok) {
            alert('문의 정보를 불러오지 못했습니다.');
            return;
        }
        const data = await res.json();

        document.getElementById('qnaTitle').textContent = data.title;
        document.getElementById('qnaCategory').textContent = data.categoryName;
        document.getElementById('qnaWriter').textContent = data.writerLabel;
        document.getElementById('qnaCreatedAt').textContent = data.createdAt;
        document.getElementById('qnaContent').textContent = data.content;

        const badge = document.getElementById('qnaStatusBadge');
        badge.textContent = data.statusLabel;
        badge.className = 'tag ' + (data.status === '답변완료' ? 'green' : 'red');

        const attachWrap = document.getElementById('qnaAttachments');
        attachWrap.innerHTML = '';
        (data.attachments || []).forEach(a => {
            const chip = document.createElement('div');
            chip.className = 'qna-attach-chip';
            chip.innerHTML = `<span>${a.originalName}</span><span>${formatSize(a.fileSize)}</span>`;
            attachWrap.appendChild(chip);
        });

        currentHasAnswer = data.status === '답변완료' && !!data.answerContent;

        if (currentHasAnswer) {
            document.getElementById('answerViewText').textContent = data.answerContent;
            document.getElementById('answerViewMeta').textContent = data.answeredAt ? `답변일시 ${data.answeredAt}` : '';
            showViewMode();
        } else {
            document.getElementById('answerInput').value = '';
            showFormMode(false);
        }

        clearError();
        document.getElementById('qnaModalOverlay').classList.add('open');
    }

    function closeQnaModal() {
        document.getElementById('qnaModalOverlay').classList.remove('open');
        currentInquiryId = null;
    }

    function showViewMode() {
        document.getElementById('answerViewBlock').style.display = 'block';
        document.getElementById('answerFormBlock').style.display = 'none';
    }

    function showFormMode(isEdit) {
        document.getElementById('answerViewBlock').style.display = 'none';
        document.getElementById('answerFormBlock').style.display = 'block';
        document.getElementById('answerCancelBtn').style.display = isEdit || currentHasAnswer ? 'inline-block' : 'none';
        document.getElementById('answerSubmitBtn').textContent = isEdit ? '수정 저장' : '답변 등록';
        document.getElementById('answerSubmitBtn').dataset.mode = isEdit ? 'edit' : 'create';
    }

    function enterEditMode() {
        document.getElementById('answerInput').value = document.getElementById('answerViewText').textContent;
        clearError();
        showFormMode(true);
    }

    function cancelAnswerForm() {
        if (currentHasAnswer) {
            showViewMode();
        } else {
            closeQnaModal();
        }
    }

    function clearError() {
        const err = document.getElementById('answerError');
        err.style.display = 'none';
        err.textContent = '';
    }

    function showError(msg) {
        const err = document.getElementById('answerError');
        err.textContent = msg;
        err.style.display = 'block';
    }

    async function submitAnswer() {
        const content = document.getElementById('answerInput').value.trim();
        if (!content) {
            showError('답변 내용을 입력해주세요.');
            return;
        }
        const mode = document.getElementById('answerSubmitBtn').dataset.mode;
        const method = mode === 'edit' ? 'PUT' : 'POST';

        const res = await fetch(`${API_BASE}/${currentInquiryId}/answer`, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ answerContent: content })
        });

        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            showError(err.message || '저장 중 오류가 발생했습니다.');
            return;
        }

        closeQnaModal();
        location.reload();
    }

    async function deleteAnswer() {
        if (!confirm('등록된 답변을 삭제하시겠습니까? 삭제 시 문의는 다시 미답변 상태가 됩니다.')) return;

        const res = await fetch(`${API_BASE}/${currentInquiryId}/answer`, { method: 'DELETE' });
        if (!res.ok) {
            alert('답변 삭제 중 오류가 발생했습니다.');
            return;
        }
        closeQnaModal();
        location.reload();
    }

    document.getElementById('qnaModalOverlay').addEventListener('click', (e) => {
        if (e.target.id === 'qnaModalOverlay') closeQnaModal();
    });
</script>
</body>
</html>
