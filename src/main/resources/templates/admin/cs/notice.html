<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공지사항 관리 | 첫출근 관리자</title>
    <link rel="stylesheet" th:href="@{/css/admin/common.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/section-common.css}" />
    <link rel="stylesheet" th:href="@{/css/modal/common.css}" />
    <link rel="stylesheet" th:href="@{/css/modal/admin/admin-modal.css}" />
    <link rel="stylesheet" th:href="@{/css/modal/admin/cs/notice-modal.css}" />
</head>
<body>
<div class="wrapper">
    <header th:replace="~{common/admin-header :: adminHeader}"></header>
    <div class="container">
        <aside th:replace="~{common/admin-aside :: adminAside}"></aside>
        <main class="admin-section">
            <div class="page-header-row">
                <div class="page-header">
                    <h1>고객센터 관리 · 공지사항</h1>
                    <p>공지사항·FAQ를 관리하고 회원 문의에 답변합니다.</p>
                </div>
                <button type="button" class="btn btn-primary" id="btn-open-create">+ 공지사항 등록</button>
            </div>
            <div th:replace="~{common/admin-stat-grid :: statGrid(${pendingCount}, ${noticeCount}, ${faqCount})}"></div>
            <div class="panel">
                <nav class="tabs" aria-label="고객센터 관리 메뉴">
                    <a class="tab active" th:href="@{/admin/cs/notice}">공지사항</a>
                    <a class="tab" th:href="@{/admin/cs/faq}">FAQ</a>
                    <a class="tab" th:href="@{/admin/cs/qna}">1:1 문의</a>
                </nav>
                <form class="filter-bar" th:action="@{/admin/cs/notice}" method="get">
                    <input type="text" name="keyword" th:value="${keyword}" placeholder="제목 검색" aria-label="제목 검색" />
                    <button type="submit" class="btn-search">검색</button>
                    <span class="result-count" th:text="'총 ' + ${noticePage.totalElements} + '건'">총 24건</span>
                </form>
                <div class="table-wrap">
                    <table class="data-table">
                        <thead><tr><th>번호</th><th>상태</th><th>제목</th><th>등록일</th><th>수정일</th><th>관리</th></tr></thead>
                        <tbody>
                        <tr th:each="notice : ${noticeList}" th:attr="data-id=${notice.noticeId}">
                            <td>
                                <span th:if="${notice.isPinned}" class="tag blue">고정</span>
                                <span th:unless="${notice.isPinned}" th:text="${notice.noticeId}">24</span>
                            </td>
                            <td>
                                <span th:text="${notice.status}"
                                      th:classappend="${notice.status == '공개'} ? 'tag green' : (${notice.status == '비공개'} ? 'tag gray' : 'tag orange')"
                                      class="tag">공개</span>
                            </td>
                            <td>
                                <a href="#" class="js-edit-link" th:attr="data-id=${notice.noticeId}" th:text="${notice.title}">제목</a>
                            </td>
                            <td th:text="${notice.createdAtText}">07.22</td>
                            <td th:text="${notice.updatedAtText}">07.22</td>
                            <td class="row-actions">
                                <a href="#" class="js-edit-link" th:attr="data-id=${notice.noticeId}">수정</a>
                                <span class="sep">·</span>
                                <a href="#" class="js-delete-link" th:attr="data-id=${notice.noticeId}">삭제</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(noticeList)}">
                            <td colspan="6" style="text-align:center;">등록된 공지사항이 없습니다.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <nav class="pagination" aria-label="공지사항 페이지">
                    <a th:each="p : ${#numbers.sequence(1, noticePage.totalPages)}"
                       th:classappend="${p == currentPage} ? 'active' : ''"
                       th:href="@{/admin/cs/notice(page=${p}, keyword=${keyword})}"
                       th:text="${p}">1</a>
                </nav>
            </div>
        </main>
    </div>
    <footer th:replace="~{common/admin-footer :: adminFooter}"></footer>
</div>

<!-- 등록/수정 모달 -->
<div id="notice-modal" class="admin-modal">
    <div class="admin-modal__backdrop" id="notice-modal-backdrop"></div>
    <section class="admin-modal__dialog notice-modal" role="dialog" aria-modal="true" aria-labelledby="notice-modal-title">
        <header class="admin-modal__header">
            <h2 id="notice-modal-title">공지사항 등록</h2>
            <button type="button" class="admin-modal__close" id="notice-modal-close" aria-label="닫기">×</button>
        </header>
        <form id="notice-form" class="admin-modal__body notice-modal__body">
            <input type="hidden" id="noticeId" name="noticeId" />
            <div class="notice-modal__field">
                <label for="title">제목</label>
                <input type="text" id="title" name="title" required />
            </div>
            <div class="notice-modal__field">
                <label for="content">공지 내용</label>
                <textarea id="content" name="content" rows="10" required></textarea>
            </div>
            <div class="notice-modal__options">
                <label class="notice-modal__check">
                    <input type="checkbox" id="isPinned" name="isPinned" />
                    <span>상단 고정</span>
                </label>
                <label class="notice-modal__status" for="status">
                    <span>게시 상태</span>
                    <select id="status" name="status">
                        <option value="임시저장">임시저장</option>
                        <option value="공개">공개</option>
                        <option value="비공개">비공개</option>
                    </select>
                </label>
            </div>
            <div class="admin-modal__footer notice-modal__footer">
                <button type="button" class="admin-modal-button admin-modal-button--outline" id="btn-cancel">취소</button>
                <button type="submit" class="admin-modal-button admin-modal-button--primary" id="btn-submit">등록</button>
            </div>
        </form>
    </section>
</div>

<div th:replace="~{modal/common/confirm-modal :: confirmModal}"></div>
<script th:src="@{/js/modal.js}"></script>

<script th:inline="javascript">
    (function () {
        const baseUrl = /*[[@{/admin/cs/notice}]]*/ '/admin/cs/notice';
        const modal = document.getElementById('notice-modal');
        const form = document.getElementById('notice-form');
        const titleInput = document.getElementById('title');
        const contentInput = document.getElementById('content');
        const isPinnedInput = document.getElementById('isPinned');
        const statusInput = document.getElementById('status');
        const noticeIdInput = document.getElementById('noticeId');
        const modalTitle = document.getElementById('notice-modal-title');
        const submitBtn = document.getElementById('btn-submit');
        document.getElementById('confirmModal')?.classList.add('admin-common-modal');

        function openModal(mode) {
            modal.classList.add('is-open');
            modalTitle.textContent = mode === 'edit' ? '공지사항 수정' : '공지사항 등록';
            submitBtn.textContent = mode === 'edit' ? '수정 저장' : '등록';
        }
        function closeModal() {
            modal.classList.remove('is-open');
            form.reset();
            noticeIdInput.value = '';
        }
        function resetForm() {
            titleInput.value = '';
            contentInput.value = '';
            isPinnedInput.checked = false;
            statusInput.value = '임시저장';
            noticeIdInput.value = '';
        }

        document.getElementById('btn-open-create').addEventListener('click', function () {
            resetForm();
            openModal('create');
        });
        document.getElementById('btn-cancel').addEventListener('click', closeModal);
        document.getElementById('notice-modal-close').addEventListener('click', closeModal);
        document.getElementById('notice-modal-backdrop').addEventListener('click', closeModal);

        document.querySelectorAll('.js-edit-link').forEach(function (el) {
            el.addEventListener('click', function (e) {
                e.preventDefault();
                const id = this.getAttribute('data-id');
                fetch(baseUrl + '/' + id)
                    .then(function (res) {
                        if (!res.ok) throw new Error('조회 실패');
                        return res.json();
                    })
                    .then(function (notice) {
                        noticeIdInput.value = notice.noticeId;
                        titleInput.value = notice.title;
                        contentInput.value = notice.content;
                        isPinnedInput.checked = !!notice.isPinned;
                        statusInput.value = notice.status;
                        openModal('edit');
                    })
                    .catch(function () {
                        showNoticeMessage('공지사항을 불러오지 못했습니다.');
                    });
            });
        });

        document.querySelectorAll('.js-delete-link').forEach(function (el) {
            el.addEventListener('click', function (e) {
                e.preventDefault();
                const id = this.getAttribute('data-id');
                showConfirmModal({
                    iconClass: 'danger',
                    iconHtml: '<span aria-hidden="true">!</span>',
                    title: '공지사항을 삭제할까요?',
                    message: '삭제한 공지사항은 다시 복구할 수 없습니다.',
                    leftText: '취소',
                    rightText: '삭제',
                    rightClass: 'btn-danger',
                    onRight: function () { deleteNotice(id); }
                });
            });
        });

        function deleteNotice(id) {
            fetch(baseUrl + '/' + id + '/delete', { method: 'POST' })
                    .then(function (res) {
                        if (!res.ok) throw new Error('삭제 실패');
                        showNoticeSuccess('공지사항이 삭제되었습니다.');
                    })
                    .catch(function () {
                        showNoticeMessage('공지사항 삭제에 실패했습니다.');
                    });
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const id = noticeIdInput.value;
            const payload = {
                title: titleInput.value,
                content: contentInput.value,
                isPinned: isPinnedInput.checked,
                status: statusInput.value
            };
            const url = id ? (baseUrl + '/' + id) : baseUrl;

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
                .then(function (res) {
                    if (!res.ok) throw new Error('저장 실패');
                    closeModal();
                    showNoticeSuccess(id
                        ? '공지사항이 수정되었습니다.'
                        : '공지사항이 등록되었습니다.');
                })
                .catch(function () {
                    showNoticeMessage('공지사항 저장에 실패했습니다.');
                });
        });

        function showNoticeMessage(message) {
            showConfirmModal({
                iconClass: 'info',
                iconHtml: '<span aria-hidden="true">?</span>',
                title: '안내',
                message: message,
                leftVisible: false,
                rightText: '확인'
            });
        }

        function showNoticeSuccess(title) {
            showConfirmModal({
                iconClass: 'success',
                iconHtml: '<span aria-hidden="true">✓</span>',
                title: title,
                message: '변경된 내용을 공지사항 목록에 반영했습니다.',
                leftVisible: false,
                rightText: '확인',
                onRight: function () { location.reload(); }
            });
        }
    })();
</script>
<script th:src="@{/js/admin/common.js}"></script>
</body>
</html>
