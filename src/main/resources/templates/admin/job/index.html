<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>채용공고 관리 | 첫출근 관리자</title>
    <link rel="stylesheet" th:href="@{/css/admin/common.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/job/common.css}" />
  </head>
  <body>
    <div class="wrapper">
      <header th:replace="~{common/admin-header :: adminHeader}"></header>
      <div class="container">
        <aside th:replace="~{common/admin-aside :: adminAside}"></aside>
        <main class="admin-operation">
          <div class="operation-heading">
            <div>
              <h1>채용공고 관리</h1>
              <p>등록된 채용공고의 게시·마감·숨김 상태를 관리합니다.</p>
            </div>
          </div>
          <section class="operation-stats">
            <article class="operation-stat">
              <span>오늘 등록</span>
              <strong th:text="|${statistics['todayCreated']}건|">0건</strong>
              <small th:text="|신규 게시 ${statistics['todayPublished']}건|">
                신규 게시 0건
              </small>
            </article>
            <article class="operation-stat">
              <span>게시 중</span>
              <strong th:text="|${statistics['open']}건|">0건</strong>
              <small th:text="|마감 임박 ${statistics['closingSoon']}건|">
                마감 임박 0건
              </small>
            </article>
            <article class="operation-stat">
              <span>숨김 처리</span>
              <strong th:text="|${statistics['hidden']}건|">0건</strong>
              <small th:text="|재검토 요청 ${statistics['review']}건 포함|">
                재검토 요청 0건 포함
              </small>
            </article>
          </section>
          <section class="operation-panel">
            <nav class="operation-tabs">
              <a
                class="operation-tab"
                th:classappend="${selectedStatus == 'ALL'} ? 'is-active'"
                th:href="@{/admin/job(status='ALL')}"
              >전체</a>
              <a
                class="operation-tab"
                th:classappend="${selectedStatus == 'POSTED'} ? 'is-active'"
                th:href="@{/admin/job(status='POSTED')}"
              >게시 중</a>
              <a
                class="operation-tab"
                th:classappend="${selectedStatus == 'CLOSED'} ? 'is-active'"
                th:href="@{/admin/job(status='CLOSED')}"
              >마감</a>
              <a
                class="operation-tab"
                th:classappend="${selectedStatus == 'HIDDEN'} ? 'is-active'"
                th:href="@{/admin/job(status='HIDDEN')}"
              >숨김</a>
              <a
                class="operation-tab"
                th:classappend="${selectedStatus == 'REVIEW'} ? 'is-active'"
                th:href="@{/admin/job(status='REVIEW')}"
              >재검토 요청</a>
            </nav>
            <form
              class="operation-search"
              method="get"
              th:action="@{/admin/job}"
            >
              <input type="hidden" name="status" th:value="${selectedStatus}" />
              <select
                class="operation-control"
                id="parentCategoryFilter"
                name="parentCategoryId"
              >
                <option value="">1차 직무 전체</option>
                <option
                  th:each="group : ${jobCategoryGroups}"
                  th:value="${group.jobCategoryId()}"
                  th:text="${group.categoryName()}"
                  th:selected="${group.jobCategoryId() == selectedParentCategoryId}"
                >1차 직무</option>
              </select>
              <select
                class="operation-control"
                id="childCategoryFilter"
                name="categoryId"
              >
                <option value="">2차 직무 전체</option>
                <th:block th:each="group : ${jobCategoryGroups}">
                  <option
                    th:each="category : ${group.children()}"
                    th:value="${category.jobCategoryId()}"
                    th:text="${category.categoryName()}"
                    th:attr="data-parent-id=${group.jobCategoryId()}"
                    th:selected="${category.jobCategoryId() == selectedCategoryId}"
                  >2차 직무</option>
                </th:block>
              </select>
              <input
                class="operation-control operation-search__keyword"
                name="keyword"
                th:value="${keyword}"
                placeholder="공고명·기업명 검색"
              />
              <button>검색</button>
            </form>
            <table class="operation-table">
              <thead>
                <tr>
                  <th>번호</th>
                  <th>기업명</th>
                  <th>공고 제목</th>
                  <th>직무</th>
                  <th>등록일</th>
                  <th>마감일</th>
                  <th>상태</th>
                  <th>관리</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="job : ${jobPage.content}">
                  <td th:text="|J-${job.jobPostingId()}|">J-0</td>
                  <td th:text="${job.companyName()}">기업명</td>
                  <td th:text="${job.title()}">공고 제목</td>
                  <td th:text="${job.categoryName() ?: '미설정'}">직무</td>
                  <td
                    th:text="${#temporals.format(job.createdAt(), 'MM.dd')}"
                  >08.05</td>
                  <td
                    th:text="${job.applyEndAt() == null
                      ? '미설정'
                      : #temporals.format(job.applyEndAt(), 'MM.dd')}"
                  >08.31</td>
                  <td
                    class="status"
                    th:classappend="${job.status() == '모집중'}
                      ? 'status--posted'
                      : (${job.status() == '마감'}
                        ? 'status--closed'
                        : (${job.status() == '숨김'}
                          ? 'status--hidden'
                          : 'status--review'))"
                    th:text="${job.status() == '모집중'
                      ? '게시 중'
                      : (job.status() == '재검토요청'
                        ? '재검토 요청'
                        : job.status())}"
                  >상태</td>
                  <td>
                    <a
                      class="table-action"
                      th:href="@{/admin/job/{jobId}(jobId=${job.jobPostingId()})}"
                    >상세보기</a>
                  </td>
                </tr>
                <tr th:if="${jobPage.empty}">
                  <td class="operation-table-empty" colspan="8">
                    조건에 맞는 채용공고가 없습니다.
                  </td>
                </tr>
              </tbody>
            </table>
            <nav
              class="operation-pagination"
              th:if="${jobPage.totalPages > 0}"
            >
              <a
                th:href="${jobPage.first} ? '#' : @{/admin/job(status=${selectedStatus},parentCategoryId=${selectedParentCategoryId},categoryId=${selectedCategoryId},keyword=${keyword},page=${jobPage.number - 1})}"
                th:classappend="${jobPage.first} ? 'is-disabled'"
              >‹</a>
              <a
                th:each="pageNumber : ${#numbers.sequence(0, jobPage.totalPages - 1)}"
                th:href="@{/admin/job(status=${selectedStatus},parentCategoryId=${selectedParentCategoryId},categoryId=${selectedCategoryId},keyword=${keyword},page=${pageNumber})}"
                th:classappend="${pageNumber == jobPage.number} ? 'is-active'"
                th:attr="aria-current=${pageNumber == jobPage.number} ? 'page'"
                th:text="${pageNumber + 1}"
              >1</a>
              <a
                th:href="${jobPage.last} ? '#' : @{/admin/job(status=${selectedStatus},parentCategoryId=${selectedParentCategoryId},categoryId=${selectedCategoryId},keyword=${keyword},page=${jobPage.number + 1})}"
                th:classappend="${jobPage.last} ? 'is-disabled'"
              >›</a>
            </nav>
          </section>
        </main>
      </div>
      <footer th:replace="~{common/admin-footer :: adminFooter}"></footer>
    </div>
    <script th:src="@{/js/admin/job-list.js}"></script>
  </body>
</html>
