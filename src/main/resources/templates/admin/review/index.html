<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>후기 관리</title>
    <link rel="stylesheet" th:href="@{/css/admin/common.css}"/>
    <link rel="stylesheet" th:href="@{/css/admin/review/common.css}"/>
    <link rel="stylesheet" th:href="@{/css/modal/admin/admin-modal.css}"/>
    <link rel="stylesheet" th:href="@{/css/modal/common.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <script th:src="@{/js/modal.js}"></script><script th:src="@{/js/admin/review.js}"></script>
</head>
<body><div class="wrapper">
<header th:replace="~{common/admin-header :: adminHeader}"></header>
<div class="container"><aside th:replace="~{common/admin-aside :: adminAside}"></aside>
<main class="content">
    <section class="page-title"><h2>후기 관리</h2><p>기업리뷰와 면접후기의 내용 및 노출 상태를 관리합니다.</p></section>
    <section class="summary">
        <div class="summary-card"><span>기업리뷰</span><h3 th:text="|${summary.companyCount ?: 0}건|">0건</h3></div>
        <div class="summary-card"><span>면접후기</span><h3 th:text="|${summary.interviewCount ?: 0}건|">0건</h3></div>
        <div class="summary-card"><span>미처리 신고</span><h3 th:text="|${summary.pendingReportCount ?: 0}건|">0건</h3></div>
    </section>
    <section class="review-box">
        <nav class="review-tab" aria-label="후기 구분">
            <a class="tab-btn" th:classappend="${tab=='company'} ? ' active'" th:href="@{/admin/review(tab=company,keyword=${keyword},sort=${sort})}">기업리뷰</a>
            <a class="tab-btn" th:classappend="${tab=='interview'} ? ' active'" th:href="@{/admin/review(tab=interview,keyword=${keyword},sort=${sort})}">면접후기</a>
            <a class="tab-btn" th:classappend="${tab=='hidden'} ? ' active'" th:href="@{/admin/review(tab=hidden,keyword=${keyword},sort=${sort})}">숨김후기</a>
        </nav>
        <form class="search-area" method="get" th:action="@{/admin/review}">
            <input type="hidden" name="tab" th:value="${tab}"/>
            <select name="sort"><option value="latest" th:selected="${sort=='latest'}">최신순</option><option value="oldest" th:selected="${sort=='oldest'}">오래된순</option><option value="reports" th:selected="${sort=='reports'}">신고 많은순</option></select>
            <input type="text" name="keyword" th:value="${keyword}" placeholder="기업명 · 후기내용 검색"/><button type="submit">검색</button>
        </form>
        <div class="table-wrap"><table class="review-table"><thead><tr>
            <th>번호</th><th>기업명</th><th>후기 요약</th><th>작성자</th><th>평점/난이도</th><th>신고</th><th>작성일</th><th>관리</th>
        </tr></thead><tbody id="reviewBody">
        <tr th:each="review : ${reviews}">
            <td th:text="${review.reviewType == '기업리뷰' ? 'CR-' + review.reviewId : 'IR-' + review.reviewId}">번호</td>
            <td th:text="${review.companyName}">기업</td><td th:text="${review.title}">요약</td><td th:text="${review.authorName}">작성자</td>
            <td th:text="${review.reviewType == '기업리뷰' ? review.rating : review.difficulty}">평점</td>
            <td th:classappend="${review.reportCount > 0} ? ' report-count'" th:text="${review.reportCount}">0</td>
            <td th:text="${#temporals.format(review.createdAt,'yyyy.MM.dd')}">날짜</td>
            <td><button type="button" class="open-review-detail-modal" th:data-review-type="${review.reviewType}" th:data-review-id="${review.reviewId}">상세</button></td>
        </tr>
        <tr th:if="${#lists.isEmpty(reviews)}"><td colspan="8" class="review-empty">검색 결과가 없습니다.</td></tr>
        </tbody></table></div>
        <nav class="pagination" th:if="${pageHandler.total > 0}" aria-label="페이지">
            <a th:if="${pageHandler.currentPage > 1}" th:href="@{/admin/review(page=${pageHandler.currentPage-1},tab=${tab},keyword=${keyword},sort=${sort})}">&lt;</a>
            <a th:each="p:${#numbers.sequence(pageHandler.startPage,pageHandler.endPage)}" th:text="${p}" th:classappend="${p==pageHandler.currentPage} ? ' active'" th:href="@{/admin/review(page=${p},tab=${tab},keyword=${keyword},sort=${sort})}">1</a>
            <a th:if="${pageHandler.currentPage < pageHandler.lastPage}" th:href="@{/admin/review(page=${pageHandler.currentPage+1},tab=${tab},keyword=${keyword},sort=${sort})}">&gt;</a>
        </nav>
    </section>
</main></div>
<footer th:replace="~{common/admin-footer :: adminFooter}"></footer>
<div th:replace="~{modal/admin/review-detail :: reviewDetailModal}"></div>
<div th:replace="~{modal/common/confirm-modal :: confirmModal}"></div>
</div></body></html>
