<div
        xmlns:th="http://www.thymeleaf.org"
        th:fragment="salaryReportReviewModal"
        class="admin-modal"
        data-salary-review-modal
        aria-hidden="true"
>
    <div class="admin-modal__backdrop" data-salary-review-close></div>

    <section
            class="admin-modal__dialog admin-modal__dialog--company"
            role="dialog"
            aria-modal="true"
            aria-labelledby="salaryReviewModalTitle"
    >
        <header class="admin-modal__header">
            <h2 id="salaryReviewModalTitle">연봉 제보 검토</h2>

            <button
                    type="button"
                    class="admin-modal__close"
                    data-salary-review-close
                    aria-label="연봉 제보 검토 닫기"
            >
                ×
            </button>
        </header>

        <form>
            <div class="admin-modal__body">

                <div class="admin-modal__grid">

                    <div class="admin-modal__field">
                        <label class="admin-modal__label">제보 기업</label>

                        <input
                                type="text"
                                class="admin-modal__input"
                                value="코드웨이브"
                                readonly
                        >
                    </div>

                    <div class="admin-modal__field">
                        <label class="admin-modal__label">제보 직무</label>

                        <input
                                type="text"
                                class="admin-modal__input"
                                value="백엔드 개발"
                                readonly
                        >
                    </div>

                    <div class="admin-modal__field">
                        <label class="admin-modal__label">경력 구간</label>

                        <input
                                type="text"
                                class="admin-modal__input"
                                value="3~5년"
                                readonly
                        >
                    </div>

                    <div class="admin-modal__field">
                        <label class="admin-modal__label">제보 연봉</label>

                        <input
                                type="text"
                                class="admin-modal__input"
                                value="5,800만원"
                        >
                    </div>

                    <div class="admin-modal__field">
                        <label class="admin-modal__label">기준연도</label>

                        <input
                                type="text"
                                class="admin-modal__input"
                                value="2026"
                        >
                    </div>

                    <div class="admin-modal__field">
                        <label class="admin-modal__label">집계 반영</label>

                        <input
                                type="text"
                                class="admin-modal__input"
                                value="정상 처리 시 자동"
                                readonly
                        >
                    </div>

                </div>

                <div class="admin-modal__field admin-modal__field--full">
                    <label class="admin-modal__label">검토 결과</label>

                    <select class="admin-modal__input">
                        <option>정상</option>
                        <option>숨김</option>
                    </select>
                </div>

                <div class="admin-modal__guide">
                    관리자는 원문을 수정하지 않고 정상 처리하거나 숨김 처리합니다.
                </div>

            </div>

            <footer class="admin-modal__footer">

                <button
                        type="button"
                        class="admin-modal-button admin-modal-button--outline"
                        data-salary-review-close
                >
                    취소
                </button>

                <button
                        type="submit"
                        class="admin-modal-button admin-modal-button--primary"
                >
                    검토 저장
                </button>

            </footer>

        </form>

    </section>

</div>
