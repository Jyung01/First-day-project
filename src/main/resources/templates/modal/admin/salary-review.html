<div xmlns:th="http://www.thymeleaf.org" th:fragment="salaryReportReviewModal"
     class="admin-modal" data-salary-review-modal aria-hidden="true">
    <div class="admin-modal__backdrop" data-salary-review-close></div>
    <section class="admin-modal__dialog admin-modal__dialog--company" role="dialog" aria-modal="true" aria-labelledby="salaryReviewModalTitle">
        <header class="admin-modal__header">
            <h2 id="salaryReviewModalTitle">연봉정보 검토</h2>
            <button type="button" class="admin-modal__close" data-salary-review-close aria-label="닫기">×</button>
        </header>
        <form id="salaryReviewForm">
            <input type="hidden" name="salaryRecordId" id="reviewSalaryRecordId"/>
            <div class="admin-modal__body">
                <div class="admin-modal__grid">
                    <div class="admin-modal__field"><label class="admin-modal__label">제보 기업</label><input id="reviewCompany" class="admin-modal__input" readonly/></div>
                    <div class="admin-modal__field"><label class="admin-modal__label">제보 직무</label><input id="reviewJob" class="admin-modal__input" readonly/></div>
                    <div class="admin-modal__field"><label class="admin-modal__label">경력</label><input id="reviewCareer" class="admin-modal__input" readonly/></div>
                    <div class="admin-modal__field"><label class="admin-modal__label">제보 연봉</label><input id="reviewSalary" class="admin-modal__input" readonly/></div>
                    <div class="admin-modal__field"><label class="admin-modal__label">기준연도</label><input id="reviewYear" class="admin-modal__input" readonly/></div>
                    <div class="admin-modal__field"><label class="admin-modal__label">고용 정보</label><input id="reviewEmployment" class="admin-modal__input" readonly/></div>
                </div>
                <div class="admin-modal__field admin-modal__field--full">
                    <label class="admin-modal__label" for="reviewStatus">검토 결과</label>
                    <select class="admin-modal__input" name="status" id="reviewStatus"><option value="정상">정상</option><option value="숨김">숨김</option></select>
                </div>
                <div class="admin-modal__field admin-modal__field--full" id="hiddenReasonField">
                    <label class="admin-modal__label" for="reviewHiddenReason">숨김 사유</label>
                    <textarea class="admin-modal__input salary-review-reason" name="hiddenReason" id="reviewHiddenReason" maxlength="1000" placeholder="숨김 처리 사유를 입력해주세요."></textarea>
                </div>
                <div class="admin-modal__guide">원문은 수정하지 않고 공개 상태만 정상 또는 숨김으로 처리합니다.</div>
            </div>
            <footer class="admin-modal__footer">
                <button type="button" class="admin-modal-button admin-modal-button--outline" data-salary-review-close>취소</button>
                <button type="submit" class="admin-modal-button admin-modal-button--primary">검토 저장</button>
            </footer>
        </form>
    </section>
</div>
