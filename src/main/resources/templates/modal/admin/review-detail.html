<div xmlns:th="http://www.thymeleaf.org" th:fragment="reviewDetailModal" class="admin-modal" data-review-detail-modal aria-hidden="true">
<div class="admin-modal__backdrop" data-review-detail-close></div>
<section class="admin-modal__dialog admin-modal__dialog--company" role="dialog" aria-modal="true" aria-labelledby="reviewDetailModalTitle">
<header class="admin-modal__header"><h2 id="reviewDetailModalTitle">후기 상세</h2><button type="button" class="admin-modal__close" data-review-detail-close>×</button></header>
<form id="adminReviewForm"><input type="hidden" name="reviewType" id="detailReviewType"/><input type="hidden" name="reviewId" id="detailReviewId"/>
<div class="admin-modal__body">
    <p class="admin-review-code" id="detailCode"></p>
    <div class="admin-review-box"><p><strong>후기 제목</strong> <span id="detailTitle"></span></p><p><strong id="detailContentLabel">후기 내용</strong> <span id="detailContent"></span></p><p><strong id="detailSecondaryLabel">추가 내용</strong> <span id="detailSecondary"></span></p><p><strong>작성일</strong> <span id="detailDate"></span></p></div>
    <div class="admin-review-info"><span class="admin-modal__label">평점 및 신고</span><div class="admin-review-rating" id="detailRating"></div></div>
    <div class="admin-modal__field admin-modal__field--full"><label class="admin-modal__label" for="detailStatus">노출 상태</label><select class="admin-modal__input" name="status" id="detailStatus"><option value="정상">정상</option><option value="숨김">숨김</option></select></div>
    <div class="admin-approval-message" id="hiddenReasonArea"><label for="detailHiddenReason">숨김 사유</label><textarea id="detailHiddenReason" name="hiddenReason" class="admin-approval-textarea" maxlength="1000" placeholder="사용자에게 적용할 숨김 사유"></textarea></div>
    <div class="admin-approval-message"><label for="reviewMemo">관리자 처리 메모</label><textarea id="reviewMemo" name="memo" class="admin-approval-textarea" maxlength="2000" placeholder="신고 처리 메모를 입력해주세요."></textarea></div>
    <div class="admin-modal__guide">숨김 처리 시 사용자 화면에서 제외되고 연결된 미처리 신고는 처리완료로 변경됩니다.</div>
</div>
<footer class="admin-modal__footer"><button type="button" class="admin-modal-button admin-modal-button--outline" data-review-detail-close>닫기</button><button type="submit" class="admin-modal-button admin-modal-button--primary">처리 저장</button></footer>
</form></section></div>
