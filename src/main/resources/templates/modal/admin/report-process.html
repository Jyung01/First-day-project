<div xmlns:th="http://www.thymeleaf.org" th:fragment="reportProcessModal" class="admin-modal" data-report-process-modal aria-hidden="true">
<div class="admin-modal__backdrop" data-report-process-close></div><section class="admin-modal__dialog admin-modal__dialog--company" role="dialog" aria-modal="true"><header class="admin-modal__header"><h2>신고 처리</h2><button type="button" class="admin-modal__close" data-report-process-close>×</button></header>
<form id="reportProcessForm"><input type="hidden" name="reportId" id="reportId"/><div class="admin-modal__body"><p class="admin-report-code" id="reportCode"></p><div class="admin-report-box"><p><strong>신고 대상</strong> <span id="reportTarget"></span></p><p><strong>신고 사유</strong> <span id="reportReason"></span></p><p><strong>신고 내용</strong> <span id="reportDetail"></span></p><p><strong>현재 상태</strong> <span id="reportStatus"></span></p></div><fieldset class="admin-approval-fieldset" id="reportActionField"><legend>조치 선택</legend><div class="admin-approval-options"><label class="admin-approval-option"><input type="radio" name="action" value="REJECT"/><span>신고 기각</span></label><label class="admin-approval-option"><input type="radio" name="action" value="HIDE"/><span id="hideActionLabel">콘텐츠 숨김</span></label></div></fieldset><div class="admin-approval-message"><label for="reportMemo">관리자 처리 메모</label><textarea id="reportMemo" name="memo" class="admin-approval-textarea" maxlength="2000" placeholder="처리 근거를 입력하세요."></textarea></div><div class="admin-modal__guide">신고 기각은 대상에 변경 없이 신고만 기각합니다. 숨김 처리는 동일 대상의 미처리 신고를 모두 처리완료로 바꿉니다.</div></div><footer class="admin-modal__footer"><button type="button" class="admin-modal-button admin-modal-button--outline" data-report-process-close>취소</button><button type="submit" class="admin-modal-button admin-modal-button--primary" id="processButton">처리 완료</button></footer></form></section></div>
