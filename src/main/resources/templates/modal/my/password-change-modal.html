<div
    xmlns:th="http://www.thymeleaf.org"
    class="password-change-modal"
    data-password-change-modal
    aria-hidden="true"
    th:fragment="passwordChangeModal"
>
    <!-- 모달 배경 -->
    <div class="password-change-modal-backdrop" data-password-change-close></div>

    <!-- 모달 본체 -->
    <section
        class="password-change-modal-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="passwordChangeModalTitle"
    >
        <!-- 헤더 -->
        <div class="password-change-modal-header">
            <div>
                <h2 id="passwordChangeModalTitle">비밀번호 변경</h2>

                <p>현재 비밀번호를 확인한 후 새 비밀번호를 입력해주세요.</p>
            </div>

            <button
                type="button"
                class="password-change-modal-close"
                data-password-change-close
                aria-label="비밀번호 변경 모달 닫기"
            >
                ×
            </button>
        </div>

        <!-- 입력 폼 -->
        <form class="password-change-form" data-password-change-form novalidate>
            <!-- 현재 비밀번호 -->
            <div class="password-change-field">
                <label for="currentPassword">
                    현재 비밀번호
                    <span class="password-change-required">*</span>
                </label>

                <div class="password-change-input-wrap">
                    <input
                        type="password"
                        id="currentPassword"
                        name="currentPassword"
                        class="password-change-input"
                        placeholder="현재 비밀번호를 입력해주세요"
                        autocomplete="current-password"
                        required
                        data-current-password
                    />

                    <button
                        type="button"
                        class="password-change-toggle"
                        data-password-toggle
                        data-target="currentPassword"
                        aria-label="현재 비밀번호 표시"
                    >
                        보기
                    </button>
                </div>

                <p class="password-change-message" data-current-password-message aria-live="polite"></p>
            </div>

            <!-- 새 비밀번호 -->
            <div class="password-change-field">
                <label for="newPassword">
                    새 비밀번호
                    <span class="password-change-required">*</span>
                </label>

                <div class="password-change-input-wrap">
                    <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        class="password-change-input"
                        placeholder="영문·숫자·특수문자 조합 8자 이상"
                        autocomplete="new-password"
                        minlength="8"
                        required
                        data-new-password
                    />

                    <button
                        type="button"
                        class="password-change-toggle"
                        data-password-toggle
                        data-target="newPassword"
                        aria-label="새 비밀번호 표시"
                    >
                        보기
                    </button>
                </div>

                <p class="password-change-help">영문, 숫자, 특수문자를 포함해 8자 이상 입력해주세요.</p>
            </div>

            <!-- 새 비밀번호 확인 -->
            <div class="password-change-field">
                <label for="newPasswordConfirm">
                    새 비밀번호 확인
                    <span class="password-change-required">*</span>
                </label>

                <div class="password-change-input-wrap">
                    <input
                        type="password"
                        id="newPasswordConfirm"
                        name="newPasswordConfirm"
                        class="password-change-input"
                        placeholder="새 비밀번호를 다시 입력해주세요"
                        autocomplete="new-password"
                        minlength="8"
                        required
                        data-new-password-confirm
                    />

                    <button
                        type="button"
                        class="password-change-toggle"
                        data-password-toggle
                        data-target="newPasswordConfirm"
                        aria-label="새 비밀번호 확인 표시"
                    >
                        보기
                    </button>
                </div>

                <p class="password-change-message" data-new-password-message aria-live="polite"></p>
            </div>

            <!-- 전체 오류 메시지 -->
            <p
                class="password-change-message password-change-form-message"
                data-password-change-form-message
                aria-live="polite"
            ></p>

            <!-- 하단 버튼 -->
            <div class="password-change-modal-footer">
                <button type="button" class="password-change-cancel" data-password-change-close>취소</button>

                <button type="submit" class="password-change-submit">비밀번호 변경</button>
            </div>
        </form>
    </section>
</div>
