<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="resume-modal-overlay"
     data-resume-modal
     th:data-application-error="${applicationError}"
     aria-hidden="true"
     th:fragment="resumeSelectModal">
  <section class="resume-modal"
           role="dialog"
           aria-modal="true"
           aria-labelledby="resume-modal-title">
    <button class="resume-modal-close"
            type="button"
            data-resume-modal-close
            aria-label="지원 이력서 선택 닫기">×</button>

    <header class="resume-modal-header">
      <h2 id="resume-modal-title">지원할 이력서를 선택해주세요</h2>
      <p>기업에 제출할 이력서와 자기소개서를 확인할 수 있어요.</p>
    </header>

    <form th:action="@{/job/application/confirm}" method="get">
      <input type="hidden"
             name="jobPostingId"
             th:if="${job != null}"
             th:value="${job.jobPostingId}">
      <fieldset class="resume-modal-section">
        <legend>
          이력서
          <span class="resume-modal-required">필수</span>
        </legend>
        <label class="resume-modal-option"
               th:each="resume, resumeStat : ${applicationResumes}">
          <input type="radio"
                 name="resumeId"
                 th:value="${resume.id()}"
                 th:checked="${resumeStat.first}"
                 required>
          <span class="resume-modal-radio" aria-hidden="true"></span>
          <span class="resume-modal-copy">
            <strong th:text="${resume.title()}">이력서 제목</strong>
            <small th:text="|${#temporals.format(resume.updatedAt(), 'yyyy.MM.dd')} 수정|">
              수정일
            </small>
          </span>
          <span class="selected-label"
                th:text="${resumeStat.first} ? '선택됨' : '선택'">선택</span>
        </label>

        <div class="resume-modal-empty"
             th:if="${#lists.isEmpty(applicationResumes)}">
          <p>등록된 이력서가 없습니다.</p>
          <a th:href="@{/my/resume/form}">이력서 작성하기</a>
        </div>
      </fieldset>

      <fieldset class="resume-modal-section">
        <legend>
          자기소개서
          <span class="resume-modal-optional">선택</span>
        </legend>
        <label class="resume-modal-option">
          <input type="radio"
                 name="coverLetterId"
                 value=""
                 checked>
          <span class="resume-modal-radio" aria-hidden="true"></span>
          <span class="resume-modal-copy">
            <strong>자기소개서 없이 지원</strong>
            <small>이력서만 제출합니다.</small>
          </span>
          <span class="selected-label">선택됨</span>
        </label>

        <label class="resume-modal-option"
               th:each="coverLetter, coverLetterStat : ${applicationCoverLetters}">
          <input type="radio"
                 name="coverLetterId"
                 th:value="${coverLetter.id()}">
          <span class="resume-modal-radio" aria-hidden="true"></span>
          <span class="resume-modal-copy">
            <strong th:text="${coverLetter.title()}">자기소개서 제목</strong>
            <small th:text="|${#temporals.format(coverLetter.updatedAt(), 'yyyy.MM.dd')} 수정|">
              수정일
            </small>
          </span>
          <span class="selected-label">선택</span>
        </label>

        <div class="resume-modal-empty"
             th:if="${#lists.isEmpty(applicationCoverLetters)}">
          <p>등록된 자기소개서가 없어 이력서만 제출할 수 있어요.</p>
          <a th:href="@{/my/cover-letter/form}">자기소개서 작성하기</a>
        </div>
      </fieldset>

      <div class="resume-modal-notice">
        <strong>제출 전 확인해주세요</strong>
        <p>지원 후에는 제출한 이력서와 자기소개서를 수정할 수 없어요.</p>
      </div>

      <div class="resume-modal-actions">
        <button
          class="job-secondary-button"
          type="button"
          data-resume-modal-cancel
        >
          취소
        </button>
        <button class="job-primary-button"
                type="submit"
                th:disabled="${#lists.isEmpty(applicationResumes)}">선택 완료</button>
      </div>
    </form>
  </section>
</div>
</body>
</html>
