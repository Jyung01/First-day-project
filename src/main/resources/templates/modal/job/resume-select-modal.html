<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="resume-modal-overlay"
     data-resume-modal
     aria-hidden="true"
     th:fragment="resumeSelectModal">
  <section class="resume-modal"
           role="dialog"
           aria-modal="true"
           aria-labelledby="resume-modal-title">
    <button class="resume-modal-close"
            type="button"
            data-resume-modal-close
            aria-label="지원 이력서 선택 닫기">×</button>

    <header class="resume-modal-header">
      <h2 id="resume-modal-title">지원할 이력서를 선택해주세요</h2>
      <p>기업에 제출할 이력서와 자기소개서를 확인할 수 있어요.</p>
    </header>

    <form th:action="@{/job/application/confirm}" method="get">
      <input type="hidden"
             name="jobPostingId"
             th:if="${job != null}"
             th:value="${job.jobPostingId}">
      <fieldset class="resume-modal-section">
        <legend>이력서</legend>
        <label class="resume-modal-option">
          <input type="radio" name="resumeId" value="1" checked>
          <span class="resume-modal-radio" aria-hidden="true"></span>
          <span class="resume-modal-copy">
            <strong>백엔드 개발자 이력서</strong>
            <small>2026.07.18 수정</small>
          </span>
          <span class="selected-label">선택됨</span>
        </label>
        <label class="resume-modal-option">
          <input type="radio" name="resumeId" value="2">
          <span class="resume-modal-radio" aria-hidden="true"></span>
          <span class="resume-modal-copy">
            <strong>신입 개발자 이력서</strong>
            <small>2026.07.10 수정</small>
          </span>
          <span class="selected-label">선택</span>
        </label>
      </fieldset>

      <section class="resume-modal-section">
        <h3>자기소개서</h3>
        <div class="resume-modal-document">
          <div>
            <strong>성장 경험과 지원 동기</strong>
            <small>2026.07.19 수정</small>
          </div>
          <a th:href="@{/my/cover-letter/list}">변경</a>
        </div>
      </section>

      <div class="resume-modal-notice">
        <strong>제출 전 확인해주세요</strong>
        <p>지원 후에는 제출한 이력서와 자기소개서를 수정할 수 없어요.</p>
      </div>

      <div class="resume-modal-actions">
        <button
          class="job-secondary-button"
          type="button"
          data-resume-modal-cancel
        >
          취소
        </button>
        <button class="job-primary-button" type="submit">선택 완료</button>
      </div>
    </form>
  </section>
</div>
</body>
</html>
