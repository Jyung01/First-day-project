<div
        xmlns:th="http://www.thymeleaf.org"
        class="job-modal"
        data-job-modal
        aria-hidden="true"
        th:fragment="jobSelectModal"
>
    <div class="job-modal-backdrop" data-job-modal-close></div>

    <section
            class="job-modal-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="jobModalTitle"
    >
        <div class="job-modal-header">
            <div>
                <h2 id="jobModalTitle">희망 직무 선택</h2>
                <p>희망하는 직무를 최대 3개까지 선택해주세요.</p>
            </div>

            <button
                    type="button"
                    class="job-modal-close"
                    data-job-modal-close
                    aria-label="직무 선택 모달 닫기"
            >
                ×
            </button>
        </div>

        <div class="job-modal-content">
            <!-- 1차 직무 분류 -->
            <nav
                    class="job-primary-list"
                    aria-label="직무 대분류"
                    data-job-primary-list
            >
                <button
                        th:each="group, status : ${jobCategoryGroups}"
                        type="button"
                        class="job-primary-button"
                        th:classappend="${status.first} ? 'is-active' : ''"
                        th:attr="data-job-primary=${group.jobCategoryId}"
                        th:text="${group.categoryName}"
                >
                    개발
                </button>
            </nav>

            <!-- 2차 직무 목록 -->
            <div class="job-secondary-area">
                <div class="job-secondary-header">
                    <strong
                            data-job-secondary-title
                            th:text="${#lists.isEmpty(jobCategoryGroups) ? '직무' : jobCategoryGroups[0].categoryName}"
                    >
                        직무
                    </strong>

                    <span>
                        <strong data-job-modal-count>0</strong>/3개 선택
                    </span>
                </div>

                <div
                        th:each="group, status : ${jobCategoryGroups}"
                        class="job-secondary-list"
                        th:classappend="${status.first} ? 'is-active' : ''"
                        th:attr="data-job-secondary-list=${group.jobCategoryId}"
                >
                    <label
                            class="job-option"
                            th:each="job : ${group.children}"
                    >
                        <input
                                type="checkbox"
                                th:value="${job.jobCategoryId}"
                                th:attr="data-job-name=${job.categoryName}"
                                data-job-option
                        />
                        <span th:text="${job.categoryName}">백엔드 개발</span>
                    </label>
                </div>

                <p
                        class="job-modal-selected-empty"
                        th:if="${#lists.isEmpty(jobCategoryGroups)}"
                >
                    현재 선택할 수 있는 직무가 없습니다.
                </p>
            </div>
        </div>

        <!-- 현재 선택 목록 -->
        <div class="job-modal-selected">
            <span class="job-modal-selected-label">선택한 직무</span>

            <div
                    class="job-modal-selected-list"
                    data-job-modal-selected-list
            >
                <span class="job-modal-selected-empty">
                    선택된 직무가 없습니다.
                </span>
            </div>
        </div>

        <p
                class="job-modal-message"
                data-job-modal-message
                aria-live="polite"
        ></p>

        <div class="job-modal-footer">
            <button
                    type="button"
                    class="job-modal-cancel"
                    data-job-modal-cancel
            >
                취소
            </button>

            <button
                    type="button"
                    class="job-modal-confirm"
                    data-job-modal-confirm
                    th:disabled="${#lists.isEmpty(jobCategoryGroups)}"
            >
                선택 완료
            </button>
        </div>
    </section>
</div>
