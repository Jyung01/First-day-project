<div
        xmlns:th="http://www.thymeleaf.org"
        class="job-modal"
        data-job-modal
        aria-hidden="true"
        th:fragment="jobSelectModal"
>
    <div class="job-modal-backdrop" data-job-modal-close></div>

    <section
            class="job-modal-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="jobModalTitle"
    >
        <div class="job-modal-header">
            <div>
                <h2 id="jobModalTitle">희망 직무 선택</h2>

                <p>희망하는 직무를 최대 3개까지 선택해주세요.</p>
            </div>

            <button
                    type="button"
                    class="job-modal-close"
                    data-job-modal-close
                    aria-label="직무 선택 모달 닫기"
            >
                ×
            </button>
        </div>

        <div class="job-modal-content">
            <!-- 1차 직무 분류 -->
            <nav
                    class="job-primary-list"
                    aria-label="직무 대분류"
                    data-job-primary-list
            >
                <button
                        type="button"
                        class="job-primary-button is-active"
                        data-job-primary="development"
                >
                    개발
                </button>

                <button
                        type="button"
                        class="job-primary-button"
                        data-job-primary="design"
                >
                    디자인
                </button>

                <button
                        type="button"
                        class="job-primary-button"
                        data-job-primary="planning"
                >
                    기획·전략
                </button>

                <button
                        type="button"
                        class="job-primary-button"
                        data-job-primary="marketing"
                >
                    마케팅
                </button>

                <button
                        type="button"
                        class="job-primary-button"
                        data-job-primary="sales"
                >
                    영업
                </button>

                <button
                        type="button"
                        class="job-primary-button"
                        data-job-primary="management"
                >
                    경영·사무
                </button>
            </nav>

            <!-- 2차 직무 목록 -->
            <div class="job-secondary-area">
                <div class="job-secondary-header">
                    <strong data-job-secondary-title>개발</strong>

                    <span>
                        <strong data-job-modal-count>0</strong>/3개 선택
                    </span>
                </div>

                <div
                        class="job-secondary-list is-active"
                        data-job-secondary-list="development"
                >
                    <label class="job-option">
                        <input
                                type="checkbox"
                                value="101"
                                data-job-name="백엔드 개발"
                                data-job-option
                        />
                        <span>백엔드 개발</span>
                    </label>

                    <label class="job-option">
                        <input
                                type="checkbox"
                                value="102"
                                data-job-name="프론트엔드 개발"
                                data-job-option
                        />
                        <span>프론트엔드 개발</span>
                    </label>

                    <label class="job-option">
                        <input
                                type="checkbox"
                                value="103"
                                data-job-name="서버 개발"
                                data-job-option
                        />
                        <span>서버 개발</span>
                    </label>

                    <label class="job-option">
                        <input
                                type="checkbox"
                                value="104"
                                data-job-name="웹 개발"
                                data-job-option
                        />
                        <span>웹 개발</span>
                    </label>

                    <label class="job-option">
                        <input
                                type="checkbox"
                                value="105"
                                data-job-name="앱 개발"
                                data-job-option
                        />
                        <span>앱 개발</span>
                    </label>

                    <label class="job-option">
                        <input
                                type="checkbox"
                                value="106"
                                data-job-name="데이터 엔지니어"
                                data-job-option
                        />
                        <span>데이터 엔지니어</span>
                    </label>

                    <label class="job-option">
                        <input
                                type="checkbox"
                                value="107"
                                data-job-name="AI·머신러닝"
                                data-job-option
                        />
                        <span>AI·머신러닝</span>
                    </label>

                    <label class="job-option">
                        <input
                                type="checkbox"
                                value="108"
                                data-job-name="시스템·네트워크"
                                data-job-option
                        />
                        <span>시스템·네트워크</span>
                    </label>
                </div>

                <div
                        class="job-secondary-list"
                        data-job-secondary-list="design"
                >
                    <label class="job-option">
                        <input
                                type="checkbox"
                                value="201"
                                data-job-name="UI·UX 디자인"
                                data-job-option
                        />
                        <span>UI·UX 디자인</span>
                    </label>

                    <label class="job-option">
                        <input
                                type="checkbox"
                                value="202"
                                data-job-name="웹 디자인"
                                data-job-option
                        />
                        <span>웹 디자인</span>
                    </label>

                    <label class="job-option">
                        <input
                                type="checkbox"
                                value="203"
                                data-job-name="그래픽 디자인"
                                data-job-option
                        />
                        <span>그래픽 디자인</span>
                    </label>
                </div>

                <div
                        class="job-secondary-list"
                        data-job-secondary-list="planning"
                >
                    <label class="job-option">
                        <input
                                type="checkbox"
                                value="301"
                                data-job-name="서비스 기획"
                                data-job-option
                        />
                        <span>서비스 기획</span>
                    </label>

                    <label class="job-option">
                        <input
                                type="checkbox"
                                value="302"
                                data-job-name="사업 기획"
                                data-job-option
                        />
                        <span>사업 기획</span>
                    </label>

                    <label class="job-option">
                        <input
                                type="checkbox"
                                value="303"
                                data-job-name="PM·PO"
                                data-job-option
                        />
                        <span>PM·PO</span>
                    </label>
                </div>

                <div
                        class="job-secondary-list"
                        data-job-secondary-list="marketing"
                >
                    <label class="job-option">
                        <input
                                type="checkbox"
                                value="401"
                                data-job-name="콘텐츠 마케팅"
                                data-job-option
                        />
                        <span>콘텐츠 마케팅</span>
                    </label>

                    <label class="job-option">
                        <input
                                type="checkbox"
                                value="402"
                                data-job-name="퍼포먼스 마케팅"
                                data-job-option
                        />
                        <span>퍼포먼스 마케팅</span>
                    </label>

                    <label class="job-option">
                        <input
                                type="checkbox"
                                value="403"
                                data-job-name="브랜드 마케팅"
                                data-job-option
                        />
                        <span>브랜드 마케팅</span>
                    </label>
                </div>

                <div
                        class="job-secondary-list"
                        data-job-secondary-list="sales"
                >
                    <label class="job-option">
                        <input
                                type="checkbox"
                                value="501"
                                data-job-name="기업 영업"
                                data-job-option
                        />
                        <span>기업 영업</span>
                    </label>

                    <label class="job-option">
                        <input
                                type="checkbox"
                                value="502"
                                data-job-name="기술 영업"
                                data-job-option
                        />
                        <span>기술 영업</span>
                    </label>

                    <label class="job-option">
                        <input
                                type="checkbox"
                                value="503"
                                data-job-name="영업 관리"
                                data-job-option
                        />
                        <span>영업 관리</span>
                    </label>
                </div>

                <div
                        class="job-secondary-list"
                        data-job-secondary-list="management"
                >
                    <label class="job-option">
                        <input
                                type="checkbox"
                                value="601"
                                data-job-name="인사"
                                data-job-option
                        />
                        <span>인사</span>
                    </label>

                    <label class="job-option">
                        <input
                                type="checkbox"
                                value="602"
                                data-job-name="회계·재무"
                                data-job-option
                        />
                        <span>회계·재무</span>
                    </label>

                    <label class="job-option">
                        <input
                                type="checkbox"
                                value="603"
                                data-job-name="총무"
                                data-job-option
                        />
                        <span>총무</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- 현재 선택 목록 -->
        <div class="job-modal-selected">
            <span class="job-modal-selected-label">선택한 직무</span>

            <div
                    class="job-modal-selected-list"
                    data-job-modal-selected-list
            >
                <span class="job-modal-selected-empty">
                    선택된 직무가 없습니다.
                </span>
            </div>
        </div>

        <p
                class="job-modal-message"
                data-job-modal-message
                aria-live="polite"
        ></p>

        <div class="job-modal-footer">
            <button
                    type="button"
                    class="job-modal-cancel"
                    data-job-modal-cancel
            >
                취소
            </button>

            <button
                    type="button"
                    class="job-modal-confirm"
                    data-job-modal-confirm
            >
                선택 완료
            </button>
        </div>
    </section>
</div>
