<div class="terms-modal" data-terms-modal aria-hidden="true" th:fragment="termsModal">
    <div class="terms-modal-backdrop" data-modal-close></div>

    <section class="terms-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="termsModalTitle">
        <div class="terms-modal-header">
            <h2 id="termsModalTitle" data-modal-title>약관 상세</h2>

            <button type="button" class="terms-modal-close" data-modal-close aria-label="약관 닫기">×</button>
        </div>

        <div class="terms-modal-body" data-modal-content>약관 내용이 표시됩니다.</div>

        <div class="terms-modal-footer">
            <button type="button" class="terms-modal-confirm" data-modal-close>확인</button>
        </div>
    </section>
</div>
