<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>반려 기업정보 수정 | 첫출근</title>

        <!-- 기업관리 공통 -->
        <link rel="stylesheet" th:href="@{/css/corp/common.css}" />

        <!-- 기존 기업정보 폼 공통 -->
        <link rel="stylesheet" th:href="@{/css/corp/company-info.css}" />

        <!-- 반려 화면 전용 -->
        <link rel="stylesheet" th:href="@{/css/corp/company-info-rejected.css}" />

        <!-- 복지 선택 모달 -->
        <link rel="stylesheet" th:href="@{/css/modal/corp/benefit-select-modal.css}" />

        <!-- 공통 모달 -->
        <link rel="stylesheet" th:href="@{/css/modal/common.css}" />

        <!-- 공통 토스트 -->
        <link rel="stylesheet" th:href="@{/css/common/toast.css}" />
    </head>

    <body class="corp-page">
        <!-- 기업관리 헤더 -->
        <header th:replace="~{common/corp-header :: corpHeader}"></header>

        <main class="corp-main rejected-company-main">
            <div class="corp-layout">
                <!-- 기업관리 사이드바 -->
                <aside th:replace="~{common/corp-aside :: corpAside}"></aside>

                <section class="corp-content rejected-company-content" aria-labelledby="rejectedCompanyTitle">
                    <!-- 페이지 제목 -->
                    <div class="rejected-company-heading">
                        <div>
                            <h1 id="rejectedCompanyTitle">반려 기업정보 수정</h1>

                            <p>반려 사유에 해당하는 정보를 수정한 뒤 재심사를 요청합니다.</p>
                        </div>

                        <div class="rejected-company-heading-actions">
                            <button
                                type="submit"
                                form="rejectedCompanyForm"
                                class="rejected-review-button"
                            >
                                재심사 요청
                            </button>
                        </div>
                    </div>

                    <!-- 승인 반려 사유 -->
                    <section class="rejection-reason" aria-labelledby="rejectionReasonTitle">
                        <h2 id="rejectionReasonTitle">승인 반려 사유</h2>

                        <p th:text="${rejectionReason}">
                            사업자등록번호와 사업자명 및 설립일 정보가 제출된 정보와 일치하지 않습니다.
                        </p>

                        <span
                            th:if="${!#strings.isEmpty(rejectedFieldSummary)}"
                            th:text="|확인할 항목: ${rejectedFieldSummary}|"
                        >
                            확인할 항목
                        </span>
                    </section>

                    <form
                        id="rejectedCompanyForm"
                        class="company-info-form"
                        th:action="@{/corp/company-info-rejected}"
                        method="post"
                        enctype="multipart/form-data"
                        th:object="${companyForm}"
                        data-rejected-company-form
                        novalidate
                    >
                        <!-- 기본정보 -->
                        <section class="company-info-card">
                            <h2 class="company-info-section-title">기본 정보</h2>

                            <div class="company-basic-layout">
                                <!-- 기업 로고 -->
                                <div class="company-logo-area">
                                    <div class="company-logo-preview" data-company-logo-preview>
                                        <img
                                            th:if="${companyLogoUrl != null}"
                                            th:src="${companyLogoUrl}"
                                            alt="기업 로고"
                                            data-company-logo-image
                                        />

                                        <span
                                            th:unless="${companyLogoUrl != null}"
                                            data-company-logo-initial
                                        >
                                            첫
                                        </span>
                                    </div>

                                    <label for="companyLogo" class="company-logo-change-button"> 로고 변경 </label>

                                    <p class="company-logo-guide">
                                        <span>권장 사이즈</span>
                                        <strong>1200 × 600px (2:1)</strong>
                                    </p>

                                    <input
                                        type="file"
                                        id="companyLogo"
                                        name="companyLogo"
                                        accept=".jpg,.jpeg,.png"
                                        hidden
                                        data-company-logo-input
                                    />

                                    <p
                                        class="company-field-message"
                                        th:classappend="${companyLogoError != null} ? ' is-visible' : ''"
                                        th:text="${companyLogoError}"
                                        data-company-logo-message
                                        aria-live="polite"
                                    ></p>
                                </div>

                                <div class="company-basic-fields">
                                    <!-- 반려 대상 -->
                                    <div class="company-field-grid">
                                        <div class="company-field">
                                            <label for="companyName"> 기업명 </label>

                                            <input
                                                type="text"
                                                id="companyName"
                                                class="company-input"
                                                th:classappend="${rejectedFields.contains('COMPANY_NAME')} ? ' is-rejected' : ''"
                                                th:field="*{companyName}"
                                                required
                                            />

                                            <p
                                                class="rejected-field-help"
                                                th:if="${rejectedFields.contains('COMPANY_NAME')}"
                                            >
                                                반려 사유와 관련된 항목입니다.
                                            </p>
                                        </div>

                                        <div class="company-field">
                                            <label for="businessNumber"> 사업자등록번호 </label>

                                            <input
                                                type="text"
                                                id="businessNumber"
                                                class="company-input"
                                                th:classappend="${rejectedFields.contains('BUSINESS_NUMBER') or #fields.hasErrors('businessNumber')} ? ' is-rejected' : ''"
                                                th:field="*{businessNumber}"
                                                maxlength="12"
                                                required
                                                data-business-number
                                            />

                                            <p
                                                class="rejected-field-help"
                                                th:if="${rejectedFields.contains('BUSINESS_NUMBER')}"
                                            >
                                                숫자 10자리를 확인해주세요.
                                            </p>

                                            <p
                                                class="company-field-message"
                                                th:classappend="${#fields.hasErrors('businessNumber')} ? ' is-visible' : ''"
                                                th:errors="*{businessNumber}"
                                                data-business-number-error
                                                aria-live="polite"
                                            >
                                                사업자등록번호 오류
                                            </p>
                                        </div>
                                    </div>

                                    <div class="company-field-grid">
                                        <div class="company-field">
                                            <label for="representativeName"> 대표자명 </label>

                                            <input
                                                type="text"
                                                id="representativeName"
                                                class="company-input"
                                                th:classappend="${rejectedFields.contains('REPRESENTATIVE_NAME')} ? ' is-rejected' : ''"
                                                th:field="*{representativeName}"
                                                required
                                            />

                                            <p
                                                class="rejected-field-help"
                                                th:if="${rejectedFields.contains('REPRESENTATIVE_NAME')}"
                                            >
                                                사업자등록 정보와 동일해야 합니다.
                                            </p>
                                        </div>

                                        <div class="company-field">
                                            <label for="establishedDate"> 설립일 </label>

                                            <input
                                                type="date"
                                                id="establishedDate"
                                                class="company-input"
                                                th:classappend="${rejectedFields.contains('ESTABLISHED_DATE')} ? ' is-rejected' : ''"
                                                th:field="*{establishedDate}"
                                            />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <!-- 공개정보 -->
                        <section class="company-info-card">
                            <h2 class="company-info-section-title">공개 정보</h2>

                            <div class="company-field-grid">
                                <div class="company-field">
                                    <label for="companySize"> 기업 규모 </label>

                                    <select
                                        id="companySize"
                                        class="company-input company-select"
                                        th:classappend="${rejectedFields.contains('COMPANY_SIZE')} ? ' is-rejected' : ''"
                                        th:field="*{companySize}"
                                    >
                                        <option value="">기업 규모 선택</option>
                                        <option value="스타트업">스타트업</option>
                                        <option value="중소기업">중소기업</option>
                                        <option value="중견기업">중견기업</option>
                                        <option value="대기업">대기업</option>
                                        <option value="공공기관">공공기관</option>
                                        <option value="외국계기업">외국계기업</option>
                                    </select>
                                </div>

                                <div class="company-field">
                                    <label for="industry">업종</label>

                                    <select
                                        id="industry"
                                        class="company-input company-select"
                                        th:classappend="${rejectedFields.contains('INDUSTRY')} ? ' is-rejected' : ''"
                                        th:field="*{industry}"
                                    >
                                        <option value="">업종 선택</option>
                                        <option value="IT·인터넷">IT·인터넷</option>
                                        <option value="금융">금융</option>
                                        <option value="제조">제조</option>
                                        <option value="유통·무역">유통·무역</option>
                                        <option value="서비스">서비스</option>
                                        <option value="교육">교육</option>
                                        <option value="의료">의료</option>
                                        <option value="기타">기타</option>
                                    </select>
                                </div>
                            </div>

                            <div class="company-field-grid">
                                <div class="company-field">
                                    <label for="homepage"> 홈페이지 </label>

                                    <input
                                        type="url"
                                        id="homepage"
                                        class="company-input"
                                        th:field="*{homepage}"
                                    />
                                </div>

                                <div class="company-field">
                                    <label for="managerPhone"> 담당자 연락처 </label>

                                    <input
                                        type="tel"
                                        id="managerPhone"
                                        name="managerPhone"
                                        class="company-input"
                                        th:value="${managerPhone}"
                                        readonly
                                    />
                                </div>
                            </div>

                            <div class="company-field-grid">
                                <div class="company-field">
                                    <label for="address"> 주소 </label>

                                    <input
                                        type="text"
                                        id="address"
                                        name="address"
                                        class="company-input"
                                        th:value="${companyAddress}"
                                        readonly
                                    />
                                </div>

                                <div class="company-field">
                                    <label for="shortDescription"> 기업 한 줄 소개 </label>

                                    <input
                                        type="text"
                                        id="shortDescription"
                                        class="company-input"
                                        th:classappend="${rejectedFields.contains('SHORT_DESCRIPTION')} ? ' is-rejected' : ''"
                                        th:field="*{shortDescription}"
                                        maxlength="300"
                                    />
                                </div>
                            </div>
                        </section>

                        <!-- 기업 소개 -->
                        <section class="company-info-card">
                            <div class="company-field company-field-full">
                                <label for="introduction"> 기업 소개 </label>

                                <textarea
                                    id="introduction"
                                    class="company-textarea"
                                    th:classappend="${rejectedFields.contains('INTRODUCTION')} ? ' is-rejected' : ''"
                                    th:field="*{introduction}"
                                    maxlength="2000"
                                ></textarea>
                            </div>
                        </section>

                        <!-- 복지 -->
                        <section class="company-info-card">
                            <div class="company-field company-field-full">
                                <div class="company-benefit-label-row">
                                    <label> 복지 </label>

                                    <span
                                        class="company-benefit-count"
                                        data-benefit-selection-count
                                        th:text="|${#lists.size(companyForm.benefits)}/10|"
                                    >
                                        0/10
                                    </span>
                                </div>

                                <div
                                    class="company-benefit-selection-box"
                                    th:classappend="${rejectedFields.contains('BENEFITS')} ? ' is-rejected' : ''"
                                >
                                    <div class="company-benefit-chips" data-benefit-chip-list>
                                        <button
                                            type="button"
                                            class="company-benefit-chip"
                                            th:each="benefit : *{benefits}"
                                            th:attr="data-benefit-value=${benefit}"
                                        >
                                            <span th:text="${benefit}">4대보험</span>
                                            <span aria-hidden="true">×</span>
                                        </button>
                                    </div>

                                    <p
                                        class="company-benefit-empty"
                                        data-benefit-empty
                                        th:hidden="${not #lists.isEmpty(companyForm.benefits)}"
                                    >
                                        선택한 복지가 없습니다.
                                    </p>

                                    <div data-benefit-hidden-inputs>
                                        <input
                                            type="hidden"
                                            name="benefits"
                                            th:each="benefit : *{benefits}"
                                            th:value="${benefit}"
                                        />
                                    </div>

                                    <button type="button" class="company-benefit-open-button" data-benefit-modal-open>
                                        복지 선택
                                    </button>
                                </div>
                            </div>
                        </section>

                        <p
                            class="company-field-message rejected-form-message"
                            th:classappend="${#fields.hasGlobalErrors()} ? ' is-visible' : ''"
                            th:text="${#fields.hasGlobalErrors() ? #strings.listJoin(#fields.globalErrors(), ' ') : ''}"
                            data-rejected-form-message
                            aria-live="polite"
                        ></p>
                    </form>
                </section>
            </div>
        </main>

        <!-- 기업관리 푸터 -->
        <footer th:replace="~{common/corp-footer :: corpFooter}"></footer>

        <!-- 공통 확인 모달 -->
        <div th:replace="~{modal/common/confirm-modal :: confirmModal}"></div>

        <!-- 복지 선택 모달 -->
        <div th:replace="~{modal/corp/benefit-select-modal :: benefitSelectModal}"></div>

        <div
            hidden
            th:if="${param.showRejectionModal != null}"
            data-login-rejection-modal
            th:attr="data-rejection-reason=${rejectionReason}"
        ></div>

        <!-- 공통 토스트 -->
        <div th:replace="~{common/toast :: toast}"></div>

        <script th:src="@{/js/modal.js}"></script>
        <script th:src="@{/js/modal/benefit-select-modal.js}"></script>
        <!-- company-info-rejected.js가 showToast를 쓰므로 먼저 불러온다. -->
        <script th:src="@{/js/common/toast.js}"></script>
        <script th:src="@{/js/corp/company-info-rejected.js}"></script>
    </body>
</html>
