<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>채용공고 관리 | 첫출근</title>
    <link rel="stylesheet" th:href="@{/css/corp/common.css}" />
    <link rel="stylesheet" th:href="@{/css/corp/management/common.css}" />
    <link rel="stylesheet" th:href="@{/css/corp/management/job-list.css}" />
    <link rel="stylesheet" th:href="@{/css/modal/common.css}" />
    <link rel="stylesheet" th:href="@{/css/modal/corp/job-list-modal.css}" />
  </head>
  <body class="corp-page">
    <header th:replace="~{common/corp-header :: corpHeader}"></header>
    <main class="corp-main">
      <div class="corp-layout">
        <aside th:replace="~{common/corp-aside :: corpAside}"></aside>
        <section class="corp-content">
          <div class="corp-page-heading">
            <div>
              <h1>채용공고 관리</h1>
              <p>등록한 공고를 검색하고 상태별로 관리합니다.</p>
            </div>
            <div class="corp-actions">
              <a
                class="corp-button corp-button--primary"
                th:href="@{/corp/job/create}"
                >채용공고 등록</a
              >
            </div>
          </div>

          <nav class="job-tabs" aria-label="공고 상태별 조회">
            <a
              th:classappend="${selectedStatus == 'ALL'} ? 'is-active'"
              th:href="@{/corp/job(status='ALL')}"
              th:text="|전체 ${statusCounts['all']}|"
            >전체 0</a>
            <a
              th:classappend="${selectedStatus == 'OPEN'} ? 'is-active'"
              th:href="@{/corp/job(status='OPEN')}"
              th:text="|모집중 ${statusCounts['open']}|"
            >모집중 0</a>
            <a
              th:classappend="${selectedStatus == 'SCHEDULED'} ? 'is-active'"
              th:href="@{/corp/job(status='SCHEDULED')}"
              th:text="|모집예정 ${statusCounts['scheduled']}|"
            >모집예정 0</a>
            <a
              th:classappend="${selectedStatus == 'DRAFT'} ? 'is-active'"
              th:href="@{/corp/job(status='DRAFT')}"
              th:text="|임시저장 ${statusCounts['draft']}|"
            >임시저장 0</a>
            <a
              th:classappend="${selectedStatus == 'CLOSED'} ? 'is-active'"
              th:href="@{/corp/job(status='CLOSED')}"
              th:text="|마감 ${statusCounts['closed']}|"
            >마감 0</a>
            <a
              th:classappend="${selectedStatus == 'HIDDEN'} ? 'is-active'"
              th:href="@{/corp/job(status='HIDDEN')}"
              th:text="|숨김 ${statusCounts['hidden']}|"
            >숨김 0</a>
            <a
              th:classappend="${selectedStatus == 'REVIEW'} ? 'is-active'"
              th:href="@{/corp/job(status='REVIEW')}"
              th:text="|재검토 요청 ${statusCounts['review']}|"
            >재검토 요청 0</a>
          </nav>

          <form
            class="corp-card filter-bar"
            method="get"
            th:action="@{/corp/job}"
          >
            <input
              class="corp-control"
              name="keyword"
              th:value="${keyword}"
              placeholder="공고 제목 검색"
            />
            <select class="corp-control" name="status" aria-label="공고 상태">
              <option value="ALL" th:selected="${selectedStatus == 'ALL'}">상태: 전체</option>
              <option value="OPEN" th:selected="${selectedStatus == 'OPEN'}">모집중</option>
              <option value="SCHEDULED" th:selected="${selectedStatus == 'SCHEDULED'}">모집예정</option>
              <option value="DRAFT" th:selected="${selectedStatus == 'DRAFT'}">임시저장</option>
              <option value="CLOSED" th:selected="${selectedStatus == 'CLOSED'}">마감</option>
              <option value="HIDDEN" th:selected="${selectedStatus == 'HIDDEN'}">숨김</option>
              <option value="REVIEW" th:selected="${selectedStatus == 'REVIEW'}">재검토 요청</option>
            </select>
            <button class="corp-button corp-button--primary" type="submit">
              검색
            </button>
          </form>

          <section class="corp-card job-table" aria-label="채용공고 목록">
            <div class="job-row job-row--head">
              <span>공고 제목</span><span>상태</span><span>지원자</span>
              <span>공고 작성일</span><span>수정일</span><span>관리</span>
            </div>
            <div
              class="job-row"
              th:each="job : ${jobPage.content}"
              th:attr="data-job-status=${job.status()}"
            >
              <strong th:text="${job.title()}">공고 제목</strong>
              <em
                class="corp-badge"
                th:classappend="${job.status() == '모집중'} ? 'corp-badge--green' :
                  (${job.status() == '모집예정'} ? 'corp-badge--scheduled' :
                  (${job.status() == '임시저장'} ? 'corp-badge--orange' :
                  (${job.status() == '마감'} ? 'corp-badge--closed' :
                  (${job.status() == '숨김'} ? 'corp-badge--hidden' :
                  (${job.status() == '재검토요청'} ? 'corp-badge--review' : '')))))"
                th:text="${job.status() == '재검토요청' ? '재검토 요청' : job.status()}"
              >상태</em>
              <span th:text="|${job.applicantCount()}명|">0명</span>
              <time
                th:datetime="${job.createdAt()}"
                th:text="${#temporals.format(job.createdAt(), 'yyyy.MM.dd')}"
              >2026.08.05</time>
              <time
                th:datetime="${job.updatedAt()}"
                th:text="${#temporals.format(job.updatedAt(), 'yyyy.MM.dd')}"
              >2026.08.05</time>
              <div class="job-row__actions">
                <a
                  th:if="${job.status() != '숨김' and job.status() != '재검토요청'}"
                  class="corp-button corp-button--compact"
                  th:href="${job.status() == '마감'}
                    ? @{/corp/job/{id}(id=${job.jobPostingId()})}
                    : @{/corp/job/edit(id=${job.jobPostingId()})}"
                  th:text="${job.status() == '마감' ? '보기' : '수정'}"
                >수정</a>
                <button
                  th:if="${job.status() == '숨김'}"
                  class="corp-button corp-button--compact corp-button--wide job-action--hidden-edit"
                  type="button"
                  th:attr="data-edit-url=@{/corp/job/edit(id=${job.jobPostingId()})},
                    data-hidden-reason=${job.hiddenReason()}"
                >사유 확인</button>
                <span
                  class="job-review-pending"
                  th:if="${job.status() == '재검토요청'}"
                >검토 중</span>
                <button
                  th:if="${job.status() == '모집중'}"
                  class="job-action job-action--close"
                  type="button"
                  th:attr="data-close-form-id=|jobCloseForm-${job.jobPostingId()}|"
                >마감</button>
                <form
                  th:if="${job.status() == '모집중'}"
                  th:id="|jobCloseForm-${job.jobPostingId()}|"
                  th:action="@{/corp/job/{id}/close(id=${job.jobPostingId()})}"
                  method="post"
                  hidden
                ></form>
                <button
                  th:if="${job.status() == '임시저장'
                    or job.status() == '모집예정'
                    or job.status() == '마감'}"
                  class="job-action job-action--delete"
                  type="button"
                  th:attr="data-delete-form-id=|jobDeleteForm-${job.jobPostingId()}|"
                >삭제</button>
                <form
                  th:if="${job.status() == '임시저장'
                    or job.status() == '모집예정'
                    or job.status() == '마감'}"
                  th:id="|jobDeleteForm-${job.jobPostingId()}|"
                  th:action="@{/corp/job/{id}/delete(id=${job.jobPostingId()})}"
                  method="post"
                  hidden
                ></form>
              </div>
            </div>
            <div class="job-list-empty" th:if="${jobPage.empty}">
              조건에 맞는 채용공고가 없습니다.
            </div>
          </section>

          <div class="job-list-footer">
            <p
              class="job-count"
              th:text="${jobPage.totalElements == 0
                ? '0페이지 / 총 0개'
                : (jobPage.number + 1) + '페이지 / 총 ' + jobPage.totalElements + '개'}"
            >0페이지 / 총 0개</p>
            <nav
              class="corp-pagination"
              aria-label="채용공고 페이지"
              th:if="${jobPage.totalPages > 0}"
            >
              <a
                th:href="${jobPage.first} ? '#' : @{/corp/job(status=${selectedStatus},keyword=${keyword},page=${jobPage.number - 1})}"
                th:classappend="${jobPage.first} ? 'is-disabled'"
                aria-label="이전 페이지"
              >‹</a>
              <a
                th:each="pageNumber : ${#numbers.sequence(0, jobPage.totalPages - 1)}"
                th:href="@{/corp/job(status=${selectedStatus},keyword=${keyword},page=${pageNumber})}"
                th:classappend="${pageNumber == jobPage.number} ? 'is-active'"
                th:attr="aria-current=${pageNumber == jobPage.number} ? 'page'"
                th:text="${pageNumber + 1}"
              >1</a>
              <a
                th:href="${jobPage.last} ? '#' : @{/corp/job(status=${selectedStatus},keyword=${keyword},page=${jobPage.number + 1})}"
                th:classappend="${jobPage.last} ? 'is-disabled'"
                aria-label="다음 페이지"
              >›</a>
            </nav>
          </div>
          <p class="corp-note">
            임시저장, 모집예정, 마감 공고는 삭제할 수 있습니다. 마감 공고의
            기존 지원 내역은 유지됩니다.
          </p>
        </section>
      </div>
    </main>
    <footer th:replace="~{common/corp-footer :: corpFooter}"></footer>
    <div th:replace="~{modal/common/confirm-modal :: confirmModal}"></div>
    <script th:src="@{/js/modal.js}"></script>
    <script th:src="@{/js/corp/job-list.js}"></script>
  </body>
</html>
