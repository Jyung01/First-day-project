<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title
      th:text="${isReviewReadOnly == true} ? '재검토 요청 공고 보기 | 첫출근' :
        (${isReadOnly} ? '마감 공고 보기 | 첫출근' :
        (${isHidden} ? '숨김 공고 수정 | 첫출근' : '채용공고 수정 | 첫출근'))"
    >
      채용공고 수정 | 첫출근
    </title>
    <link rel="stylesheet" th:href="@{/css/corp/common.css}" />
    <link rel="stylesheet" th:href="@{/css/corp/management/common.css}" />
    <link rel="stylesheet" th:href="@{/css/corp/management/job-form.css}" />
    <link rel="stylesheet" th:href="@{/css/modal/corp/ai-polish-modal.css}" />
    <link
      rel="stylesheet"
      th:href="@{/css/modal/common/skill-select-modal.css}"
    />
  </head>
  <body class="corp-page">
    <header th:replace="~{common/corp-header :: corpHeader}"></header>
    <main class="corp-main">
      <div class="corp-layout">
        <aside th:replace="~{common/corp-aside :: corpAside}"></aside>
        <section class="corp-content">
          <div class="corp-page-heading">
            <div>
              <h1
                th:text="${isReviewReadOnly == true} ? '재검토 요청 공고 보기' :
                  (${isReadOnly} ? '마감 공고 보기' :
                  (${isHidden} ? '숨김 공고 수정' : '채용공고 수정'))"
              >
                채용공고 수정
              </h1>
              <p
                th:text="${isReviewReadOnly == true}
                  ? '관리자 검토를 기다리는 채용공고의 내용을 확인합니다.'
                  : (${isReadOnly} ? '마감된 채용공고의 등록 내용을 확인합니다.' :
                  (${isHidden} ? '관리자에 의해 숨김 처리된 공고를 수정하고 재검토를 요청합니다.' : '모집 중 공고 내용을 수정합니다. 마감 공고는 수정할 수 없습니다.'))"
              >
                모집 중 공고 내용을 수정합니다.
              </p>
            </div>
            <div class="corp-actions">
              <a class="corp-button" th:href="@{/corp/job}">목록</a
              ><button
                th:unless="${isReadOnly}"
                form="jobEditForm"
                class="corp-button corp-button--primary"
                th:text="${isHidden} ? '저장 및 재검토 요청' : '수정 저장'"
              >
                수정 저장
              </button>
            </div>
          </div>
          <section
            class="corp-card job-form-card job-form-card--readonly"
            th:if="${isReadOnly}"
          >
            <div class="job-readonly-heading">
              <h2>공고 기본정보</h2>
              <span class="corp-badge" th:text="${job.status()}">마감</span>
            </div>
            <div class="job-form-grid">
              <div class="form-field form-field--wide">
                <label>공고 제목</label>
                <input th:value="${job.title()}" readonly />
              </div>
              <div class="form-field">
                <label>직무 카테고리</label>
                <input th:value="${job.category()}" readonly />
              </div>
              <div class="form-field">
                <label>고용 형태</label>
                <input th:value="${job.employmentType()}" readonly />
              </div>
              <div class="form-field">
                <label>경력</label>
                <input th:value="${job.career()}" readonly />
              </div>
              <div class="form-field">
                <label>학력</label>
                <input th:value="${job.educationLevel()}" readonly />
              </div>
              <div class="form-field">
                <label>근무 지역</label>
                <input th:value="${job.workRegion()}" readonly />
              </div>
              <div class="form-field">
                <label>급여</label>
                <input th:value="${job.salary()}" readonly />
              </div>
              <div class="form-field">
                <label>공고 작성일</label>
                <input
                  th:value="${#temporals.format(job.createdAt(), 'yyyy.MM.dd')}"
                  readonly
                />
              </div>
              <div class="form-field">
                <label>실제 공개일</label>
                <input
                  th:value="${job.publishedAt() == null
                    ? '미등록'
                    : #temporals.format(job.publishedAt(), 'yyyy.MM.dd')}"
                  readonly
                />
              </div>
              <div class="form-field">
                <label>모집 마감 예정일</label>
                <input
                  th:value="${job.applyEndAt() == null
                    ? '미설정'
                    : #temporals.format(job.applyEndAt(), 'yyyy.MM.dd')}"
                  readonly
                />
              </div>
              <div class="form-field">
                <label>실제 마감일</label>
                <input
                  th:value="${job.closedAt() == null
                    ? '미설정'
                    : #temporals.format(job.closedAt(), 'yyyy.MM.dd HH:mm')}"
                  readonly
                />
              </div>
              <div class="form-field">
                <label>모집 인원</label>
                <input
                  th:value="${job.headcount() == null
                    ? '미설정'
                    : job.headcount() + '명'}"
                  readonly
                />
              </div>
              <div class="form-field form-field--wide">
                <label>상세 근무 주소</label>
                <input th:value="${job.workAddress()}" readonly />
              </div>
              <div class="form-field form-field--wide">
                <label>기술 스택</label>
                <div class="skill-picker skill-picker--readonly">
                  <span
                    class="skill-chip"
                    th:each="skill : ${job.skills()}"
                    th:text="${skill}"
                  >Java</span>
                  <span
                    class="skill-picker__empty"
                    th:if="${job.skills().isEmpty()}"
                  >선택된 기술이 없습니다.</span>
                </div>
              </div>
              <div class="form-field form-field--wide">
                <label>복리후생</label>
                <div class="benefit-options benefit-options--readonly">
                  <span
                    class="benefit-readonly"
                    th:each="benefit : ${job.benefits()}"
                    th:text="${benefit}"
                  >4대보험</span>
                  <span
                    class="skill-picker__empty"
                    th:if="${job.benefits().isEmpty()}"
                  >등록된 복리후생이 없습니다.</span>
                </div>
              </div>
              <div class="form-field form-field--wide">
                <label>공고 소개</label>
                <textarea th:text="${job.introduction()}" readonly></textarea>
              </div>
              <div class="form-field form-field--wide">
                <label>주요 업무</label>
                <textarea th:text="${job.mainTasks()}" readonly></textarea>
              </div>
              <div class="form-field form-field--wide">
                <label>자격요건</label>
                <textarea th:text="${job.qualifications()}" readonly></textarea>
              </div>
              <div class="form-field form-field--wide">
                <label>우대사항</label>
                <textarea
                  th:text="${job.preferredConditions()}"
                  readonly
                ></textarea>
              </div>
            </div>
          </section>
          <form
            id="jobEditForm"
            class="corp-card job-form-card"
            th:unless="${isReadOnly}"
          >
            <h2>공고 기본정보</h2>
            <div class="job-form-grid">
              <div class="form-field form-field--wide">
                <label for="editTitle">공고 제목</label
                ><input id="editTitle" value="백엔드 개발자" required />
              </div>
              <div class="form-field">
                <label>직무 카테고리</label><input value="개발 · 백엔드 개발" />
              </div>
              <div class="form-field">
                <label>고용 형태</label><input value="정규직" />
              </div>
              <div class="form-field">
                <label>경력</label><input value="신입 · 경력 3년 이하" />
              </div>
              <div class="form-field">
                <label>학력</label><input value="학력무관" />
              </div>
              <div class="form-field">
                <label>근무 지역</label><input value="서울 강남구" />
              </div>
              <div class="form-field">
                <label>급여</label><input value="회사 내규에 따름" />
              </div>
              <div class="form-field">
                <label>모집 마감 예정일</label
                ><input type="date" value="2026-07-29" />
              </div>
              <div class="form-field">
                <label>모집 인원</label
                ><input type="number" value="2" min="1" />
              </div>
              <div class="form-field form-field--wide">
                <label
                  >기술 스택 <span data-skill-selection-count>3/5</span></label
                >
                <div
                  class="skill-picker"
                  data-skill-chip-list
                  data-skill-maximum="5"
                >
                  <span
                    class="skill-chip"
                    data-skill-id="1"
                    data-skill-name="Java"
                    >Java</span
                  ><span
                    class="skill-chip"
                    data-skill-id="2"
                    data-skill-name="Spring Boot"
                    >Spring Boot</span
                  ><span
                    class="skill-chip"
                    data-skill-id="3"
                    data-skill-name="MySQL"
                    >MySQL</span
                  ><span class="skill-picker__empty" data-skill-empty hidden
                    >공통 기술 검색 후 선택 (최대 5개)</span
                  >
                </div>
                <button class="skill-open" type="button" data-skill-modal-open>
                  + 기술 선택
                </button>
                <div data-skill-hidden-inputs></div>
                <small class="skill-help"
                  >기존 선택을 포함해 최대 5개까지 선택할 수 있습니다.</small
                >
              </div>
              <div class="form-field form-field--wide">
                <label for="editIntro"
                  >공고 소개
                  <button
                    class="ai-polish-open"
                    type="button"
                    data-ai-polish-open="#editIntro"
                    data-ai-polish-label="공고 소개"
                  >
                    AI 문장 다듬기
                  </button></label
                ><textarea id="editIntro">
첫출근랩과 백엔드 개발 포지션을 소개합니다.</textarea
                >
              </div>
              <div class="form-field form-field--wide">
                <label for="editTasks"
                  >주요 업무
                  <button
                    class="ai-polish-open"
                    type="button"
                    data-ai-polish-open="#editTasks"
                    data-ai-polish-label="주요 업무"
                  >
                    AI 문장 다듬기
                  </button></label
                ><textarea id="editTasks">
• Spring Boot 기반 서비스 개발 및 운영&#10;• REST API 설계와 데이터 처리</textarea
                >
              </div>
              <div class="form-field form-field--wide">
                <label for="editRequirements"
                  >자격요건
                  <button
                    class="ai-polish-open"
                    type="button"
                    data-ai-polish-open="#editRequirements"
                    data-ai-polish-label="자격요건"
                  >
                    AI 문장 다듬기
                  </button></label
                ><textarea id="editRequirements">
• Java와 객체지향 기본 이해&#10;• Spring Boot 프로젝트 경험</textarea
                >
              </div>
              <div class="form-field form-field--wide">
                <label for="editPreferred"
                  >우대사항
                  <button
                    class="ai-polish-open"
                    type="button"
                    data-ai-polish-open="#editPreferred"
                    data-ai-polish-label="우대사항"
                  >
                    AI 문장 다듬기
                  </button></label
                ><textarea id="editPreferred">
• Git 협업 및 코드 리뷰 경험&#10;• AWS 배포 경험</textarea
                >
              </div>
            </div>
          </form>
          <p class="corp-note" th:if="${isReadOnly}">
            지원자 <strong th:text="|${job.applicantCount()}명|">0명</strong> ·
            마감된 공고는 수정할 수 없으며 기존 지원 내역은 유지됩니다.
          </p>
          <p
            class="corp-note corp-note--hidden"
            th:if="${!isReadOnly and isHidden}"
          >
            <strong>숨김 사유:</strong>
            <span th:text="${hiddenReason}">회사 정보와 공고 내용 불일치</span>
          </p>
          <p
            class="corp-note"
            th:if="${!isReadOnly and !isHidden}"
          >
            지원자 18명 · 공고 마감은 채용공고 관리 목록에서 별도로 처리할 수
            있습니다.
          </p>
        </section>
      </div>
    </main>
    <footer th:replace="~{common/corp-footer :: corpFooter}"></footer>
    <div
      th:unless="${isReadOnly}"
      th:replace="~{modal/common/skill-select-modal :: skillSelectModal}"
    ></div>
    <div
      th:unless="${isReadOnly}"
      th:replace="~{modal/corp/ai-polish-modal :: aiPolishModal}"
    ></div>
    <script
      th:unless="${isReadOnly}"
      th:src="@{/js/modal/skill-select-modal.js}"
    ></script>
    <script
      th:unless="${isReadOnly}"
      th:src="@{/js/corp/job-form.js}"
    ></script>
  </body>
</html>
