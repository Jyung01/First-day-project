<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>기업관리 대시보드 | 첫출근</title>
    <link rel="stylesheet" th:href="@{/css/corp/common.css}" />
    <link rel="stylesheet" th:href="@{/css/corp/management/common.css}" />
    <link rel="stylesheet" th:href="@{/css/corp/management/dashboard.css}" />
  </head>
  <body class="corp-page">
    <header th:replace="~{common/corp-header :: corpHeader}"></header>
    <main class="corp-main">
      <div class="corp-layout">
        <aside th:replace="~{common/corp-aside :: corpAside}"></aside>
        <section class="corp-content">
          <div class="dashboard-heading">
            <div>
              <h1>기업관리 대시보드</h1>
              <p>첫출근랩의 채용 현황과 최근 지원자를 확인하세요.</p>
            </div>
            <a class="primary-action" th:href="@{/corp/job/create}"
              >채용공고 등록</a
            >
          </div>
          <div class="summary-grid">
            <article class="summary-card">
              <span class="summary-card__label">진행 중 공고</span
              ><strong class="summary-card__value"
                       th:text="${dashboard.stats.recruitingJobCount + '건'}">0건</strong
              ><span class="summary-card__detail"
                     th:text="${'마감 임박 ' + dashboard.stats.closingSoonJobCount + '건'}">마감 임박 0건</span>
            </article>
            <article class="summary-card">
              <span class="summary-card__label">신규 지원자</span
              ><strong class="summary-card__value"
                       th:text="${dashboard.stats.recentApplicantCount + '명'}">0명</strong
              ><span class="summary-card__detail is-green"
                     th:text="${'오늘 ' + dashboard.stats.todayApplicantCount + '명'}">오늘 0명</span>
            </article>
            <article class="summary-card">
              <span class="summary-card__label">검토 대기</span
              ><strong class="summary-card__value"
                       th:text="${dashboard.stats.pendingReviewCount + '명'}">0명</strong
              ><span class="summary-card__detail is-orange"
                >서류 확인 필요</span
              >
            </article>
            <article class="summary-card">
              <span class="summary-card__label">누적 공고 조회</span
              ><strong class="summary-card__value"
                       th:text="${#numbers.formatInteger(dashboard.stats.totalViewCount, 1, 'COMMA') + '회'}">0회</strong
              ><span class="summary-card__detail">전체 공고 기준</span>
            </article>
          </div>
          <div class="dashboard-panels">
            <section class="panel recent-applicants">
              <div class="panel__header">
                <h2>최근 지원자</h2>
                <a class="panel-more-link" th:href="@{/corp/applicant}"
                  >전체보기
                  <svg
                    class="link-arrow"
                    viewBox="0 0 20 20"
                    aria-hidden="true"
                  >
                    <path d="M4 10h11m-4-4 4 4-4 4" /></svg
                ></a>
              </div>
              <div class="applicant-row applicant-row--head">
                <span>지원자</span><span>지원 공고</span><span>지원일</span
                ><span>상태</span>
              </div>
              <a class="applicant-row"
                 th:each="applicant : ${dashboard.recentApplicants}"
                 th:href="@{/corp/applicant/detail(id=${applicant.applicationId})}">
                <strong th:text="${applicant.applicantName}">지원자</strong>
                <span th:text="${applicant.jobTitle}">지원 공고</span>
                <time th:text="${#temporals.format(applicant.appliedAt, 'MM.dd')}">08.11</time>
                <em class="corp-badge"
                    th:classappend="${applicant.statusVariant == 'green'} ? ' corp-badge--green' : (${applicant.statusVariant == 'gray'} ? ' corp-badge--gray' : '')"
                    th:text="${applicant.status}">지원완료</em>
              </a>
              <p class="dashboard-empty"
                 th:if="${#lists.isEmpty(dashboard.recentApplicants)}">
                최근 지원자가 없습니다.
              </p>
            </section>
            <section class="panel">
              <div class="panel__header"><h2>공고 현황</h2></div>
              <ul class="job-status-list">
                <li th:each="job : ${dashboard.recentJobs}">
                  <a th:href="@{/corp/job/{id}(id=${job.jobPostingId})}">
                    <strong th:text="${job.title}">채용공고</strong>
                    <span th:text="${job.deadlineLabel}">-</span>
                    <em th:classappend="${job.statusVariant == 'open'} ? ' is-open' : (${job.statusVariant == 'scheduled'} ? ' is-scheduled' : (${job.statusVariant == 'hidden'} ? ' is-hidden' : ''))"
                        th:text="${job.status}">모집중</em>
                  </a>
                </li>
              </ul>
              <p class="dashboard-empty"
                 th:if="${#lists.isEmpty(dashboard.recentJobs)}">
                등록된 채용공고가 없습니다.
              </p>
            </section>
          </div>
          <aside class="dashboard-guide">
            <strong>운영 안내</strong>
            <p>
              마감 임박 공고와 검토 대기 지원자를 먼저 처리하면 채용 진행이
              원활해집니다.
            </p>
          </aside>
        </section>
      </div>
    </main>
    <footer th:replace="~{common/corp-footer :: corpFooter}"></footer>
  </body>
</html>
