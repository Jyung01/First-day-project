<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>기업정보 관리 | 첫출근</title>

        <!-- 기업관리 공통 -->
        <link rel="stylesheet" th:href="@{/css/corp/common.css}" />

        <!-- 기업정보 관리 -->
        <link rel="stylesheet" th:href="@{/css/corp/company-info.css}" />

        <!-- 복지 선택 모달 -->
        <link rel="stylesheet" th:href="@{/css/modal/corp/benefit-select-modal.css}" />

        <!-- 공통 확인 모달 -->
        <link rel="stylesheet" th:href="@{/css/modal/common.css}" />
    </head>

    <body class="corp-page">
        <!-- 기업관리 공통 헤더 -->
        <header th:replace="~{common/corp-header :: corpHeader}"></header>

        <main class="corp-main company-info-main">
            <div class="corp-layout">
                <!-- 기업관리 공통 사이드바 -->
                <aside th:replace="~{common/corp-aside :: corpAside}"></aside>

                <!-- 기업정보 관리 -->
                <section class="corp-content company-info-content" aria-labelledby="companyInfoTitle">
                    <!-- 페이지 제목 -->
                    <div class="company-info-heading">
                        <div>
                            <h1 id="companyInfoTitle">기업정보 관리</h1>

                            <p>구직자에게 공개되는 기업정보를 관리합니다.</p>
                        </div>

                        <button type="submit" form="companyInfoForm" class="company-info-save-top">
                            변경사항 저장
                        </button>
                    </div>

                    <form
                        id="companyInfoForm"
                        class="company-info-form"
                        th:action="@{/corp/company-info}"
                        method="post"
                        enctype="multipart/form-data"
                        th:object="${companyForm}"
                        data-company-info-form
                        novalidate
                    >
                        <!-- =================================================
                             기본 정보
                        ================================================== -->
                        <section class="company-info-card">
                            <h2 class="company-info-section-title">기본 정보</h2>

                            <div class="company-basic-layout">
                                <!-- 기업 로고 -->
                                <div class="company-logo-area">
                                    <div class="company-logo-preview" data-company-logo-preview>
                                        <!-- 등록된 로고가 있을 때 -->
                                        <img
                                            th:if="${companyLogoUrl != null}"
                                            th:src="${companyLogoUrl}"
                                            alt="기업 로고"
                                            data-company-logo-image
                                        />

                                        <!-- 등록된 로고가 없을 때 -->
                                        <span th:unless="${companyLogoUrl != null}" data-company-logo-initial>
                                            첫
                                        </span>
                                    </div>

                                    <label for="companyLogo" class="company-logo-change-button"> 로고 변경 </label>

                                    <input
                                        type="file"
                                        id="companyLogo"
                                        name="companyLogo"
                                        accept=".jpg,.jpeg,.png"
                                        hidden
                                        data-company-logo-input
                                    />

                                    <p class="company-field-message" data-company-logo-message aria-live="polite"></p>
                                </div>

                                <!-- 기본정보 필드 -->
                                <div class="company-basic-fields">
                                    <div class="company-field-grid">
                                        <div class="company-field">
                                            <label for="companyName"> 기업명 </label>

                                            <input
                                                type="text"
                                                id="companyName"
                                                class="company-input"
                                                th:field="*{companyName}"
                                                maxlength="200"
                                                required
                                            />
                                        </div>

                                        <div class="company-field">
                                            <label for="managerName"> 담당자 </label>

                                            <input
                                                type="text"
                                                id="managerName"
                                                name="managerName"
                                                class="company-input"
                                                th:value="${managerName}"
                                                readonly
                                            />
                                        </div>
                                    </div>

                                    <div class="company-field-grid">
                                        <div class="company-field">
                                            <label for="businessNumber"> 사업자등록번호 </label>

                                            <input
                                                type="text"
                                                id="businessNumber"
                                                name="businessNumber"
                                                class="company-input"
                                                th:value="${businessNumber}"
                                                readonly
                                            />
                                        </div>

                                        <div class="company-field">
                                            <label for="approvalStatus"> 인증 정보 </label>

                                            <input
                                                type="text"
                                                id="approvalStatus"
                                                class="company-input"
                                                th:value="${approvalStatus}"
                                                readonly
                                            />
                                        </div>
                                    </div>

                                    <div class="company-field-grid">
                                        <div class="company-field">
                                            <label for="representativeName"> 대표자명 </label>

                                            <input
                                                type="text"
                                                id="representativeName"
                                                class="company-input"
                                                th:field="*{representativeName}"
                                                required
                                            />
                                        </div>

                                        <div class="company-field">
                                            <label for="establishedDate"> 설립일 </label>

                                            <input
                                                type="date"
                                                id="establishedDate"
                                                class="company-input"
                                                th:field="*{establishedDate}"
                                            />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <!-- =================================================
                             공개 정보
                        ================================================== -->
                        <section class="company-info-card">
                            <h2 class="company-info-section-title">공개 정보</h2>

                            <div class="company-field-grid">
                                <div class="company-field">
                                    <label for="companySize"> 기업 규모 </label>

                                    <select
                                        id="companySize"
                                        class="company-input company-select"
                                        th:field="*{companySize}"
                                    >
                                        <option value="">기업 규모 선택</option>
                                        <option value="스타트업">스타트업</option>
                                        <option value="중소기업">중소기업</option>
                                        <option value="중견기업">중견기업</option>
                                        <option value="대기업">대기업</option>
                                        <option value="공공기관">공공기관</option>
                                        <option value="외국계기업">외국계기업</option>
                                    </select>
                                </div>

                                <div class="company-field">
                                    <label for="industry"> 업종 </label>

                                    <select
                                        id="industry"
                                        class="company-input company-select"
                                        th:field="*{industry}"
                                    >
                                        <option value="">업종 선택</option>
                                        <option value="IT·인터넷">IT·인터넷</option>
                                        <option value="금융">금융</option>
                                        <option value="제조">제조</option>
                                        <option value="유통·무역">유통·무역</option>
                                        <option value="서비스">서비스</option>
                                        <option value="교육">교육</option>
                                        <option value="의료">의료</option>
                                        <option value="기타">기타</option>
                                    </select>
                                </div>
                            </div>

                            <div class="company-field-grid">
                                <div class="company-field">
                                    <label for="homepage"> 홈페이지 </label>

                                    <input
                                        type="url"
                                        id="homepage"
                                        class="company-input"
                                        th:field="*{homepage}"
                                        placeholder="https://example.com"
                                    />
                                </div>

                                <div class="company-field">
                                    <label for="managerPhone"> 담당자 연락처 </label>

                                    <input
                                        type="tel"
                                        id="managerPhone"
                                        class="company-input"
                                        th:value="${managerPhone}"
                                        readonly
                                    />
                                </div>
                            </div>

                            <!-- 주소 -->
                            <fieldset class="company-address">
                                <legend>주소</legend>

                                <div class="company-postcode-row">
                                    <input
                                        type="text"
                                        id="postcode"
                                        class="company-input"
                                        th:field="*{postcode}"
                                        placeholder="우편번호"
                                        readonly
                                        required
                                    />

                                    <button type="button" class="company-outline-button" data-address-search>
                                        주소 검색
                                    </button>
                                </div>

                                <input
                                    type="text"
                                    id="address"
                                    class="company-input"
                                    th:field="*{address}"
                                    placeholder="기본주소"
                                    readonly
                                    required
                                />

                                <input
                                    type="text"
                                    id="addressDetail"
                                    class="company-input"
                                    th:field="*{addressDetail}"
                                    placeholder="상세주소 입력"
                                />

                                <p class="company-field-message" data-address-message aria-live="polite"></p>
                            </fieldset>

                            <!-- 기업 한 줄 소개 -->
                            <div class="company-field company-field-full">
                                <label for="shortDescription"> 기업 한 줄 소개 </label>

                                <input
                                    type="text"
                                    id="shortDescription"
                                    class="company-input"
                                    th:field="*{shortDescription}"
                                    maxlength="300"
                                    placeholder="기업을 한 문장으로 소개해주세요"
                                />

                                <div class="company-character-count">
                                    <span data-company-count="shortDescription"> 0 </span>
                                    / 300
                                </div>
                            </div>
                        </section>

                        <!-- =================================================
                             기업 소개
                        ================================================== -->
                        <section class="company-info-card">
                            <div class="company-field company-field-full">
                                <label for="introduction"> 기업 소개 </label>

                                <textarea
                                    id="introduction"
                                    class="company-textarea"
                                    th:field="*{introduction}"
                                    maxlength="2000"
                                    placeholder="기업을 소개하는 글을 입력해주세요"
                                ></textarea>

                                <div class="company-character-count">
                                    <span data-company-count="introduction"> 0 </span>
                                    / 2000
                                </div>
                            </div>
                        </section>

                        <!-- =================================================
                             복지
                        ================================================== -->
                        <section class="company-info-card">
                            <div class="company-field company-field-full">
                                <div class="company-benefit-label-row">
                                    <label> 복지 </label>

                                    <span
                                        class="company-benefit-count"
                                        data-benefit-selection-count
                                        th:text="|${#lists.size(companyForm.benefits)}/10|"
                                    >
                                        0/10
                                    </span>
                                </div>

                                <div class="company-benefit-selection-box">
                                    <div class="company-benefit-chips" data-benefit-chip-list>
                                        <button
                                            type="button"
                                            class="company-benefit-chip"
                                            th:each="benefit : *{benefits}"
                                            th:attr="data-benefit-value=${benefit}"
                                        >
                                            <span th:text="${benefit}">4대보험</span>
                                            <span aria-hidden="true">×</span>
                                        </button>
                                    </div>

                                    <p
                                        class="company-benefit-empty"
                                        data-benefit-empty
                                        th:hidden="${not #lists.isEmpty(companyForm.benefits)}"
                                    >
                                        선택한 복지가 없습니다.
                                    </p>

                                    <div data-benefit-hidden-inputs>
                                        <input
                                            type="hidden"
                                            name="benefits"
                                            th:each="benefit : *{benefits}"
                                            th:value="${benefit}"
                                        />
                                    </div>

                                    <button type="button" class="company-benefit-open-button" data-benefit-modal-open>
                                        복지 선택
                                    </button>
                                </div>

                                <p class="company-field-message" data-benefit-message aria-live="polite"></p>
                            </div>
                        </section>

                        <p
                            class="company-field-message company-form-message"
                            th:classappend="${#fields.hasAnyErrors()} ? ' is-visible' : ''"
                            th:text="${#fields.hasAnyErrors() ? #strings.listJoin(#fields.allErrors(), ' ') : ''}"
                            data-company-form-message
                            aria-live="polite"
                        ></p>

                        <!-- 모바일용 저장 버튼 -->
                        <button type="submit" class="company-info-save-bottom">변경사항 저장</button>
                    </form>
                </section>
            </div>
        </main>

        <!-- 기업관리 공통 푸터 -->
        <footer th:replace="~{common/corp-footer :: corpFooter}"></footer>

        <!-- 저장 완료 모달 -->
        <div th:replace="~{modal/common/confirm-modal :: confirmModal}"></div>

        <!-- 복지 선택 모달 -->
        <div th:replace="~{modal/corp/benefit-select-modal :: benefitSelectModal}"></div>

        <div hidden th:if="${param.saved != null}" data-company-info-saved></div>

        <script th:src="@{/js/modal.js}"></script>
        <script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
        <script th:src="@{/js/common/postcode.js}"></script>
        <script th:src="@{/js/modal/benefit-select-modal.js}"></script>
        <script th:src="@{/js/corp/company-info.js}"></script>
    </body>
</html>
