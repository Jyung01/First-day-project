<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>지원자 목록 | 첫출근</title>
  <link rel="stylesheet" th:href="@{/css/corp/common.css}">
  <link rel="stylesheet" th:href="@{/css/corp/management/common.css}">
  <link rel="stylesheet" th:href="@{/css/corp/management/applicant-list.css}">
</head>
<body class="corp-page">
<header th:replace="~{common/corp-header :: corpHeader}"></header>
<main class="corp-main">
  <div class="corp-layout">
    <aside th:replace="~{common/corp-aside :: corpAside}"></aside>
    <section class="corp-content">
      <div class="corp-page-heading">
        <div>
          <h1>지원자 목록</h1>
          <p>채용공고별 지원자를 확인하고 전형 상태를 관리합니다.</p>
        </div>
      </div>

      <form class="corp-card applicant-filter"
            method="get"
            th:action="@{/corp/applicant}">
        <div class="applicant-filter__row">
          <select class="corp-control" name="jobPostingId">
            <option value="">전체 채용공고</option>
            <option th:each="job : ${jobOptions}"
                    th:value="${job.jobPostingId}"
                    th:selected="${jobPostingId == job.jobPostingId}"
                    th:text="${job.title}">
              백엔드 개발자
            </option>
          </select>
          <select class="corp-control" name="status">
            <option value="">전체 상태</option>
            <option th:each="statusOption : ${
                        {'지원완료','서류검토중','서류합격','면접예정','면접완료',
                         '최종합격','입사완료','입사포기','불합격','지원취소','채용종료'}
                    }"
                    th:value="${statusOption}"
                    th:selected="${status == statusOption}"
                    th:text="${statusOption}">
              지원완료
            </option>
          </select>
          <input class="corp-control"
                 type="search"
                 name="keyword"
                 th:value="${keyword}"
                 placeholder="지원자 이름 검색">
          <button class="corp-button corp-button--primary" type="submit">
            검색
          </button>
        </div>
        <p class="applicant-summary">
          전체 <strong th:text="${applicantSummary.total}">0</strong>명
          · 검토 대기 <strong th:text="${applicantSummary.waiting}">0</strong>명
          · 오늘 지원 <strong th:text="${applicantSummary.today}">0</strong>명
        </p>
      </form>

      <section class="corp-card applicant-list">
        <div class="applicant-list-row applicant-list-row--head">
          <span>지원자</span>
          <span>지원 공고</span>
          <span>지원일</span>
          <span>지원 구분</span>
          <span>상태</span>
          <span>관리</span>
        </div>

        <div class="applicant-list-row"
             th:each="applicant : ${applicants}">
          <strong class="applicant-name">
            <span class="avatar"
                  th:text="${applicant.applicantInitial}">김</span>
            <span th:text="${applicant.applicantName}">김민준</span>
          </strong>
          <span th:text="${applicant.jobTitle}">백엔드 개발자</span>
          <time th:datetime="${applicant.appliedAt}"
                th:text="${#temporals.format(applicant.appliedAt, 'MM.dd HH:mm')}">
            08.11 12:30
          </time>
          <span class="applicant-type"
                th:classappend="${' applicant-type--'
                    + applicant.applicationTypeVariant}"
                th:text="${applicant.applicationTypeLabel}">
            신입 지원
          </span>
          <em class="corp-badge"
              th:classappend="${applicant.statusVariant != 'default'
                  ? ' corp-badge--' + applicant.statusVariant
                  : ''}"
              th:text="${applicant.currentStatus}">
            지원완료
          </em>
          <a class="corp-button"
             th:href="@{/corp/applicant/detail(id=${applicant.applicationId})}">
            상세보기
          </a>
        </div>

        <p class="applicant-empty"
           th:if="${#lists.isEmpty(applicants)}">
          조건에 맞는 지원자가 없습니다.
        </p>
      </section>

      <nav class="corp-pagination"
           th:if="${pageHandler.lastPage > 0}"
           aria-label="지원자 목록 페이지">
        <a th:href="${pageHandler.currentPage == 1}
              ? '#'
              : @{/corp/applicant(
                  jobPostingId=${jobPostingId},
                  status=${status},
                  keyword=${keyword},
                  page=${pageHandler.currentPage - 1}
                )}"
           th:classappend="${pageHandler.currentPage == 1} ? 'is-disabled'"
           aria-label="이전 페이지">이전</a>
        <a th:each="pageNo : ${#numbers.sequence(
                pageHandler.startPage,
                pageHandler.endPage
            )}"
           th:classappend="${pageNo == pageHandler.currentPage} ? ' is-active'"
           th:href="@{/corp/applicant(
                jobPostingId=${jobPostingId},
                status=${status},
                keyword=${keyword},
                page=${pageNo}
           )}"
           th:text="${pageNo}">1</a>
        <a th:href="${pageHandler.currentPage == pageHandler.lastPage}
              ? '#'
              : @{/corp/applicant(
                  jobPostingId=${jobPostingId},
                  status=${status},
                  keyword=${keyword},
                  page=${pageHandler.currentPage + 1}
                )}"
           th:classappend="${pageHandler.currentPage == pageHandler.lastPage}
              ? 'is-disabled'"
           aria-label="다음 페이지">다음</a>
      </nav>

      <p class="corp-note">
        채용 단계: 지원완료 → 서류검토중 → 서류합격 → 면접예정 → 면접완료 →
        최종합격 → 입사완료 또는 입사포기<br>
        종료 상태(입사포기·불합격·지원취소·채용종료)는 다음 단계로 변경할 수 없습니다.
      </p>
    </section>
  </div>
</main>
<footer th:replace="~{common/corp-footer :: corpFooter}"></footer>
</body>
</html>
