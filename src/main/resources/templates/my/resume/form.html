<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>이력서 작성·수정 | 첫출근</title>

        <!-- 사이트 공통 -->
        <link rel="stylesheet" th:href="@{/css/common.css}" />

        <!-- 마이페이지 공통 -->
        <link rel="stylesheet" th:href="@{/css/my/common.css}" />

        <!-- 이력서 작성·수정 -->
        <link rel="stylesheet" th:href="@{/css/my/resume/form.css}" />

        <!-- 공통 확인 모달 -->
        <link rel="stylesheet" th:href="@{/css/modal/common.css}" />

        <!-- 기술 선택 모달 -->
        <link rel="stylesheet" th:href="@{/css/modal/common/skill-select-modal.css}" />
    </head>

    <body>
        <!-- 공통 헤더 -->
        <header th:replace="~{common/header :: header}"></header>

        <main class="mypage">
            <div class="wrap mypage-layout">
                <!-- 마이페이지 공통 사이드바 -->
                <aside th:replace="~{common/my-aside :: myAside}"></aside>

                <!-- 이력서 작성·수정 -->
                <section class="mypage-content resume-form-content">
                    <div class="resume-form-heading">
                        <h1 class="resume-form-title">이력서 작성·수정</h1>

                        <p class="resume-form-description">기본정보·학력/경력·기술/프로젝트를 탭으로 입력합니다.</p>
                    </div>

                    <!-- 탭 -->
                    <div class="resume-tabs" role="tablist" aria-label="이력서 작성 단계">
                        <button
                            type="button"
                            id="resumeTabBasic"
                            class="resume-tab is-active"
                            role="tab"
                            aria-selected="true"
                            aria-controls="resumePanelBasic"
                            data-resume-tab="basic"
                        >
                            기본정보
                        </button>

                        <button
                            type="button"
                            id="resumeTabCareer"
                            class="resume-tab"
                            role="tab"
                            aria-selected="false"
                            aria-controls="resumePanelCareer"
                            data-resume-tab="career"
                        >
                            학력·경력
                        </button>

                        <button
                            type="button"
                            id="resumeTabSkill"
                            class="resume-tab"
                            role="tab"
                            aria-selected="false"
                            aria-controls="resumePanelSkill"
                            data-resume-tab="skill"
                        >
                            기술·프로젝트
                        </button>
                    </div>

                    <!--
                        등록·수정 공통 폼
                        실제 POST 매핑 구현 후 th:object를 연결하면 됨
                    -->
                    <form class="resume-form" th:action="@{/my/resume/form}" method="post" data-resume-form novalidate>
                        <!-- 수정 시 이력서 ID -->
                        <input type="hidden" name="resumeId" th:value="${resumeId}" />

                        <!-- =================================================
                             1. 기본정보
                        ================================================== -->
                        <section
                            id="resumePanelBasic"
                            class="resume-panel is-active"
                            role="tabpanel"
                            aria-labelledby="resumeTabBasic"
                            data-resume-panel="basic"
                        >
                            <div class="resume-panel-header">
                                <h2>기본정보</h2>

                                <span class="resume-required-badge"> 필수 입력 </span>
                            </div>

                            <div class="resume-basic-fields">
                                <!-- 이력서 제목 -->
                                <div class="resume-field resume-field-full">
                                    <label for="resumeTitle">
                                        이력서 제목
                                        <span class="required">*</span>
                                    </label>

                                    <input
                                        type="text"
                                        id="resumeTitle"
                                        name="title"
                                        class="resume-input"
                                        th:value="${resume?.title}"
                                        value="기본 이력서"
                                        placeholder="이력서 제목을 입력해주세요"
                                        maxlength="100"
                                        required
                                        data-required-field
                                        data-required-tab="basic"
                                    />

                                    <p class="resume-field-message" data-field-message="resumeTitle"></p>
                                </div>

                                <!-- 이름 / 이메일 / 휴대전화 -->
                                <div class="resume-field-grid resume-field-grid-three">
                                    <div class="resume-field">
                                        <label for="memberName">이름</label>

                                        <input
                                            type="text"
                                            id="memberName"
                                            name="memberName"
                                            class="resume-input"
                                            th:value="${memberName}"
                                            value="김첫출"
                                            readonly
                                        />
                                    </div>

                                    <div class="resume-field">
                                        <label for="email">이메일</label>

                                        <input
                                            type="email"
                                            id="email"
                                            name="email"
                                            class="resume-input"
                                            th:value="${email}"
                                            value="user@firstwork.co.kr"
                                            readonly
                                        />
                                    </div>

                                    <div class="resume-field">
                                        <label for="phone">휴대전화</label>

                                        <input
                                            type="tel"
                                            id="phone"
                                            name="phone"
                                            class="resume-input"
                                            th:value="${phone}"
                                            value="010-1234-5678"
                                            readonly
                                        />
                                    </div>
                                </div>

                                <!-- 경력 구분 -->
                                <div class="resume-field resume-field-full">
                                    <label for="careerType">
                                        경력 구분
                                        <span class="required">*</span>
                                    </label>

                                    <select
                                        id="careerType"
                                        name="careerType"
                                        class="resume-input resume-select"
                                        required
                                        data-required-field
                                        data-required-tab="basic"
                                    >
                                        <option value="">경력 구분 선택</option>
                                        <option value="NEW" selected>신입</option>
                                        <option value="EXPERIENCED">경력</option>
                                    </select>

                                    <p class="resume-field-message" data-field-message="careerType"></p>
                                </div>

                                <!-- 한 줄 소개 -->
                                <div class="resume-field resume-field-full">
                                    <label for="summary">한 줄 소개</label>

                                    <textarea
                                        id="summary"
                                        name="summary"
                                        class="resume-textarea resume-summary-textarea"
                                        placeholder="자신을 소개하는 한 줄을 입력해주세요"
                                        maxlength="300"
                                    >
문제를 끝까지 추적하고 데이터 흐름을 검증하는 백엔드 개발자입니다.</textarea
                                    >

                                    <div class="resume-text-counter"><span data-text-count="summary">0</span>/300</div>
                                </div>
                            </div>

                            <!-- 등록 현황 요약 -->
                            <div class="resume-summary-links">
                                <button type="button" class="resume-summary-link" data-resume-tab-move="career">
                                    <span>
                                        학력
                                        <strong data-education-summary-count> 1 </strong>건 등록됨
                                    </span>

                                    <span>학력·경력 탭에서 수정 →</span>
                                </button>

                                <button type="button" class="resume-summary-link" data-resume-tab-move="skill">
                                    <span>
                                        기술
                                        <strong data-skill-summary-count> 6 </strong>개 · 프로젝트
                                        <strong data-project-summary-count> 1 </strong>건 등록됨
                                    </span>

                                    <span>기술·프로젝트 탭에서 수정 →</span>
                                </button>
                            </div>

                            <div class="resume-panel-actions">
                                <a th:href="@{/my/resume}" class="resume-secondary-button" data-resume-cancel> 취소 </a>

                                <button type="submit" class="resume-primary-button" data-submit-mode="preview">
                                    저장 후 보기
                                </button>
                            </div>
                        </section>

                        <!-- =================================================
                             2. 학력·경력
                        ================================================== -->
                        <section
                            id="resumePanelCareer"
                            class="resume-panel"
                            role="tabpanel"
                            aria-labelledby="resumeTabCareer"
                            data-resume-panel="career"
                            hidden
                        >
                            <!-- 학력 -->
                            <div class="resume-section-heading">
                                <h2>학력·경력</h2>

                                <button type="button" class="resume-add-button" data-add-education>＋ 학력 추가</button>
                            </div>

                            <div class="resume-repeat-list" data-education-list>
                                <!-- 학력 예시 -->
                                <article class="resume-repeat-card" data-education-item>
                                    <div class="resume-repeat-header">
                                        <h3 data-education-title>학력 1</h3>

                                        <button
                                            type="button"
                                            class="resume-remove-button"
                                            data-remove-education
                                            aria-label="학력 삭제"
                                        >
                                            삭제
                                        </button>
                                    </div>

                                    <div class="resume-field-grid">
                                        <div class="resume-field">
                                            <label>
                                                학교명
                                                <span class="required">*</span>
                                            </label>

                                            <input
                                                type="text"
                                                name="educations[0].schoolName"
                                                class="resume-input"
                                                value="한국대학교"
                                                placeholder="학교명 입력"
                                                required
                                                data-education-field="schoolName"
                                                data-required-field
                                                data-required-tab="career"
                                            />
                                        </div>

                                        <div class="resume-field">
                                            <label>전공</label>

                                            <input
                                                type="text"
                                                name="educations[0].major"
                                                class="resume-input"
                                                value="컴퓨터공학과"
                                                placeholder="전공 입력"
                                                data-education-field="major"
                                            />
                                        </div>
                                    </div>

                                    <div class="resume-field-grid resume-field-grid-five">
                                        <div class="resume-field">
                                            <label>학위</label>

                                            <select
                                                name="educations[0].degree"
                                                class="resume-input resume-select"
                                                data-education-field="degree"
                                            >
                                                <option value="">학위 선택</option>
                                                <option value="HIGH_SCHOOL">고등학교</option>
                                                <option value="ASSOCIATE">전문학사</option>
                                                <option value="BACHELOR" selected>학사</option>
                                                <option value="MASTER">석사</option>
                                                <option value="DOCTOR">박사</option>
                                            </select>
                                        </div>

                                        <div class="resume-field">
                                            <label>입학일</label>

                                            <input
                                                type="month"
                                                name="educations[0].admissionDate"
                                                class="resume-input"
                                                value="2020-03"
                                                data-education-field="admissionDate"
                                            />
                                        </div>

                                        <div class="resume-field">
                                            <label>졸업(예정)일</label>

                                            <input
                                                type="month"
                                                name="educations[0].graduationDate"
                                                class="resume-input"
                                                value="2026-02"
                                                data-education-field="graduationDate"
                                            />
                                        </div>

                                        <div class="resume-field">
                                            <label>졸업 상태</label>

                                            <select
                                                name="educations[0].graduationStatus"
                                                class="resume-input resume-select"
                                                data-education-field="graduationStatus"
                                            >
                                                <option value="">상태 선택</option>
                                                <option value="ENROLLED">재학</option>
                                                <option value="EXPECTED">졸업 예정</option>
                                                <option value="GRADUATED" selected>졸업</option>
                                                <option value="LEAVE">휴학</option>
                                                <option value="DROPOUT">중퇴</option>
                                            </select>
                                        </div>

                                        <div class="resume-field">
                                            <label>학점 / 기준</label>

                                            <input
                                                type="text"
                                                name="educations[0].grade"
                                                class="resume-input"
                                                value="3.8 / 4.5"
                                                placeholder="예: 3.8 / 4.5"
                                                data-education-field="grade"
                                            />
                                        </div>
                                    </div>
                                </article>
                            </div>

                            <!-- 경력 추가 -->
                            <div class="resume-subsection-action">
                                <button type="button" class="resume-outline-add-button" data-add-career>
                                    ＋ 경력 추가
                                </button>
                            </div>

                            <div class="resume-repeat-list" data-career-list>
                                <!-- 경력 예시 -->
                                <article class="resume-repeat-card" data-career-item>
                                    <div class="resume-repeat-header">
                                        <h3 data-career-title>경력 1</h3>

                                        <button
                                            type="button"
                                            class="resume-remove-button"
                                            data-remove-career
                                            aria-label="경력 삭제"
                                        >
                                            삭제
                                        </button>
                                    </div>

                                    <div class="resume-field-grid">
                                        <div class="resume-field">
                                            <label>회사명</label>

                                            <input
                                                type="text"
                                                name="careers[0].companyName"
                                                class="resume-input"
                                                value="첫출근테크"
                                                placeholder="회사명 입력"
                                                data-career-field="companyName"
                                            />
                                        </div>

                                        <div class="resume-field">
                                            <label>담당 업무</label>

                                            <input
                                                type="text"
                                                name="careers[0].position"
                                                class="resume-input"
                                                value="백엔드 개발"
                                                placeholder="담당 업무 입력"
                                                data-career-field="position"
                                            />
                                        </div>
                                    </div>

                                    <div class="resume-field-grid resume-field-grid-four">
                                        <div class="resume-field">
                                            <label>입사일</label>

                                            <input
                                                type="month"
                                                name="careers[0].startDate"
                                                class="resume-input"
                                                value="2025-03"
                                                data-career-field="startDate"
                                            />
                                        </div>

                                        <div class="resume-field">
                                            <label>퇴사일</label>

                                            <input
                                                type="month"
                                                name="careers[0].endDate"
                                                class="resume-input"
                                                value="2026-02"
                                                data-career-field="endDate"
                                            />
                                        </div>

                                        <div class="resume-field">
                                            <label>재직 상태</label>

                                            <select
                                                name="careers[0].employmentStatus"
                                                class="resume-input resume-select"
                                                data-career-field="employmentStatus"
                                            >
                                                <option value="">상태 선택</option>
                                                <option value="WORKING">재직</option>
                                                <option value="RESIGNED" selected>퇴사</option>
                                            </select>
                                        </div>

                                        <div class="resume-field">
                                            <label>고용 형태</label>

                                            <select
                                                name="careers[0].employmentType"
                                                class="resume-input resume-select"
                                                data-career-field="employmentType"
                                            >
                                                <option value="">형태 선택</option>
                                                <option value="FULL_TIME">정규직</option>
                                                <option value="CONTRACT">계약직</option>
                                                <option value="INTERN" selected>인턴</option>
                                                <option value="PART_TIME">아르바이트</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="resume-field resume-field-full">
                                        <label>담당 업무 상세</label>

                                        <textarea
                                            name="careers[0].description"
                                            class="resume-textarea"
                                            placeholder="담당 업무와 성과를 입력해주세요"
                                            maxlength="1000"
                                            data-career-field="description"
                                        >
Spring Boot 기반 채용·지원 API 개발</textarea
                                        >
                                    </div>
                                </article>
                            </div>

                            <div class="resume-panel-actions resume-panel-actions-end">
                                <button type="submit" class="resume-primary-button" data-submit-mode="save">
                                    저장
                                </button>
                            </div>
                        </section>

                        <!-- =================================================
                             3. 기술·프로젝트
                        ================================================== -->
                        <section
                            id="resumePanelSkill"
                            class="resume-panel"
                            role="tabpanel"
                            aria-labelledby="resumeTabSkill"
                            data-resume-panel="skill"
                            hidden
                        >
                            <div class="resume-section-heading">
                                <h2>기술·프로젝트</h2>

                                <button type="button" class="resume-add-button" data-add-project>
                                    ＋ 프로젝트 추가
                                </button>
                            </div>

                            <!-- 보유 기술 -->
                            <div class="resume-field resume-field-full">
                                <div class="resume-skill-label-row">
                                    <label>
                                        보유 기술 선택
                                        <span class="resume-label-option">(최대 10개)</span>
                                    </label>

                                    <span class="resume-skill-count" data-skill-selection-count> 6/10 </span>
                                </div>

                                <div class="resume-skill-selection-box">
                                    <div class="resume-skill-chips" data-skill-chip-list>
                                        <button
                                            type="button"
                                            class="resume-skill-chip"
                                            data-skill-id="1"
                                            data-skill-name="Java"
                                        >
                                            Java
                                            <span aria-hidden="true">×</span>
                                        </button>

                                        <button
                                            type="button"
                                            class="resume-skill-chip"
                                            data-skill-id="2"
                                            data-skill-name="Spring Boot"
                                        >
                                            Spring Boot
                                            <span aria-hidden="true">×</span>
                                        </button>

                                        <button
                                            type="button"
                                            class="resume-skill-chip"
                                            data-skill-id="3"
                                            data-skill-name="MyBatis"
                                        >
                                            MyBatis
                                            <span aria-hidden="true">×</span>
                                        </button>

                                        <button
                                            type="button"
                                            class="resume-skill-chip"
                                            data-skill-id="4"
                                            data-skill-name="MySQL"
                                        >
                                            MySQL
                                            <span aria-hidden="true">×</span>
                                        </button>

                                        <button
                                            type="button"
                                            class="resume-skill-chip"
                                            data-skill-id="5"
                                            data-skill-name="AWS"
                                        >
                                            AWS
                                            <span aria-hidden="true">×</span>
                                        </button>

                                        <button
                                            type="button"
                                            class="resume-skill-chip"
                                            data-skill-id="6"
                                            data-skill-name="Docker"
                                        >
                                            Docker
                                            <span aria-hidden="true">×</span>
                                        </button>
                                    </div>

                                    <p class="resume-skill-empty" data-skill-empty hidden>선택한 기술이 없습니다.</p>

                                    <div data-skill-hidden-inputs>
                                        <input type="hidden" name="skillIds" value="1" />
                                        <input type="hidden" name="skillIds" value="2" />
                                        <input type="hidden" name="skillIds" value="3" />
                                        <input type="hidden" name="skillIds" value="4" />
                                        <input type="hidden" name="skillIds" value="5" />
                                        <input type="hidden" name="skillIds" value="6" />
                                    </div>

                                    <button type="button" class="resume-skill-open-button" data-skill-modal-open>
                                        기술 선택
                                    </button>
                                </div>

                                <p class="resume-field-message" data-skill-message aria-live="polite"></p>
                            </div>

                            <!-- 프로젝트 목록 -->
                            <div class="resume-repeat-list resume-project-list" data-project-list>
                                <article class="resume-repeat-card" data-project-item>
                                    <div class="resume-repeat-header">
                                        <h3 data-project-title>프로젝트 1</h3>

                                        <button
                                            type="button"
                                            class="resume-remove-button"
                                            data-remove-project
                                            aria-label="프로젝트 삭제"
                                        >
                                            삭제
                                        </button>
                                    </div>

                                    <div class="resume-field-grid">
                                        <div class="resume-field">
                                            <label>
                                                프로젝트명
                                                <span class="required">*</span>
                                            </label>

                                            <input
                                                type="text"
                                                name="projects[0].projectName"
                                                class="resume-input"
                                                value="첫출근 채용 플랫폼"
                                                placeholder="프로젝트명 입력"
                                                required
                                                data-project-field="projectName"
                                                data-required-field
                                                data-required-tab="skill"
                                            />
                                        </div>

                                        <div class="resume-field">
                                            <label>담당 역할</label>

                                            <input
                                                type="text"
                                                name="projects[0].role"
                                                class="resume-input"
                                                value="이력서·AI 첨삭 기능 설계"
                                                placeholder="담당 역할 입력"
                                                data-project-field="role"
                                            />
                                        </div>
                                    </div>

                                    <div class="resume-field resume-field-full">
                                        <label>프로젝트 설명</label>

                                        <textarea
                                            name="projects[0].description"
                                            class="resume-textarea resume-project-textarea"
                                            placeholder="프로젝트 내용과 담당 기능을 입력해주세요"
                                            maxlength="1500"
                                            data-project-field="description"
                                        >
채용공고, 지원 문서, AI 자기소개서 첨삭 흐름을 설계하고 구현했습니다.</textarea
                                        >
                                    </div>
                                </article>
                            </div>

                            <div class="resume-panel-actions resume-panel-actions-end">
                                <button type="submit" class="resume-primary-button" data-submit-mode="preview">
                                    저장 후 보기
                                </button>
                            </div>
                        </section>
                    </form>
                </section>
            </div>
        </main>

        <!-- 동적 학력 템플릿 -->
        <template id="educationItemTemplate">
            <article class="resume-repeat-card" data-education-item>
                <div class="resume-repeat-header">
                    <h3 data-education-title>학력</h3>

                    <button type="button" class="resume-remove-button" data-remove-education aria-label="학력 삭제">
                        삭제
                    </button>
                </div>

                <div class="resume-field-grid">
                    <div class="resume-field">
                        <label>
                            학교명
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            class="resume-input"
                            placeholder="학교명 입력"
                            required
                            data-education-field="schoolName"
                            data-required-field
                            data-required-tab="career"
                        />
                    </div>

                    <div class="resume-field">
                        <label>전공</label>

                        <input type="text" class="resume-input" placeholder="전공 입력" data-education-field="major" />
                    </div>
                </div>

                <div class="resume-field-grid resume-field-grid-five">
                    <div class="resume-field">
                        <label>학위</label>

                        <select class="resume-input resume-select" data-education-field="degree">
                            <option value="">학위 선택</option>
                            <option value="HIGH_SCHOOL">고등학교</option>
                            <option value="ASSOCIATE">전문학사</option>
                            <option value="BACHELOR">학사</option>
                            <option value="MASTER">석사</option>
                            <option value="DOCTOR">박사</option>
                        </select>
                    </div>

                    <div class="resume-field">
                        <label>입학일</label>

                        <input type="month" class="resume-input" data-education-field="admissionDate" />
                    </div>

                    <div class="resume-field">
                        <label>졸업(예정)일</label>

                        <input type="month" class="resume-input" data-education-field="graduationDate" />
                    </div>

                    <div class="resume-field">
                        <label>졸업 상태</label>

                        <select class="resume-input resume-select" data-education-field="graduationStatus">
                            <option value="">상태 선택</option>
                            <option value="ENROLLED">재학</option>
                            <option value="EXPECTED">졸업 예정</option>
                            <option value="GRADUATED">졸업</option>
                            <option value="LEAVE">휴학</option>
                            <option value="DROPOUT">중퇴</option>
                        </select>
                    </div>

                    <div class="resume-field">
                        <label>학점 / 기준</label>

                        <input
                            type="text"
                            class="resume-input"
                            placeholder="예: 3.8 / 4.5"
                            data-education-field="grade"
                        />
                    </div>
                </div>
            </article>
        </template>

        <!-- 동적 경력 템플릿 -->
        <template id="careerItemTemplate">
            <article class="resume-repeat-card" data-career-item>
                <div class="resume-repeat-header">
                    <h3 data-career-title>경력</h3>

                    <button type="button" class="resume-remove-button" data-remove-career aria-label="경력 삭제">
                        삭제
                    </button>
                </div>

                <div class="resume-field-grid">
                    <div class="resume-field">
                        <label>회사명</label>

                        <input
                            type="text"
                            class="resume-input"
                            placeholder="회사명 입력"
                            data-career-field="companyName"
                        />
                    </div>

                    <div class="resume-field">
                        <label>담당 업무</label>

                        <input
                            type="text"
                            class="resume-input"
                            placeholder="담당 업무 입력"
                            data-career-field="position"
                        />
                    </div>
                </div>

                <div class="resume-field-grid resume-field-grid-four">
                    <div class="resume-field">
                        <label>입사일</label>

                        <input type="month" class="resume-input" data-career-field="startDate" />
                    </div>

                    <div class="resume-field">
                        <label>퇴사일</label>

                        <input type="month" class="resume-input" data-career-field="endDate" />
                    </div>

                    <div class="resume-field">
                        <label>재직 상태</label>

                        <select class="resume-input resume-select" data-career-field="employmentStatus">
                            <option value="">상태 선택</option>
                            <option value="WORKING">재직</option>
                            <option value="RESIGNED">퇴사</option>
                        </select>
                    </div>

                    <div class="resume-field">
                        <label>고용 형태</label>

                        <select class="resume-input resume-select" data-career-field="employmentType">
                            <option value="">형태 선택</option>
                            <option value="FULL_TIME">정규직</option>
                            <option value="CONTRACT">계약직</option>
                            <option value="INTERN">인턴</option>
                            <option value="PART_TIME">아르바이트</option>
                        </select>
                    </div>
                </div>

                <div class="resume-field resume-field-full">
                    <label>담당 업무 상세</label>

                    <textarea
                        class="resume-textarea"
                        placeholder="담당 업무와 성과를 입력해주세요"
                        maxlength="1000"
                        data-career-field="description"
                    ></textarea>
                </div>
            </article>
        </template>

        <!-- 동적 프로젝트 템플릿 -->
        <template id="projectItemTemplate">
            <article class="resume-repeat-card" data-project-item>
                <div class="resume-repeat-header">
                    <h3 data-project-title>프로젝트</h3>

                    <button type="button" class="resume-remove-button" data-remove-project aria-label="프로젝트 삭제">
                        삭제
                    </button>
                </div>

                <div class="resume-field-grid">
                    <div class="resume-field">
                        <label>
                            프로젝트명
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            class="resume-input"
                            placeholder="프로젝트명 입력"
                            required
                            data-project-field="projectName"
                            data-required-field
                            data-required-tab="skill"
                        />
                    </div>

                    <div class="resume-field">
                        <label>담당 역할</label>

                        <input
                            type="text"
                            class="resume-input"
                            placeholder="담당 역할 입력"
                            data-project-field="role"
                        />
                    </div>
                </div>

                <div class="resume-field resume-field-full">
                    <label>프로젝트 설명</label>

                    <textarea
                        class="resume-textarea resume-project-textarea"
                        placeholder="프로젝트 내용과 담당 기능을 입력해주세요"
                        maxlength="1500"
                        data-project-field="description"
                    ></textarea>
                </div>
            </article>
        </template>

        <!-- 공통 푸터 -->
        <footer th:replace="~{common/footer :: footer}"></footer>

        <!-- 공통 확인 모달 -->
        <div th:replace="~{modal/common/confirm-modal :: confirmModal}"></div>

        <!-- 기술 선택 모달 -->
        <div th:replace="~{modal/common/skill-select-modal :: skillSelectModal}"></div>

        <script th:src="@{/js/common.js}"></script>
        <script th:src="@{/js/modal.js}"></script>
        <script th:src="@{/js/my/resume/form.js}"></script>
        <script th:src="@{/js/modal/skill-select-modal.js}"></script>
    </body>
</html>
