<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title th:text="${editMode} ? '이력서 수정 | 첫출근' : '이력서 등록 | 첫출근'">이력서 작성·수정 | 첫출근</title>

        <!-- 사이트 공통 -->
        <link rel="stylesheet" th:href="@{/css/common.css}" />

        <!-- 마이페이지 공통 -->
        <link rel="stylesheet" th:href="@{/css/my/common.css}" />

        <!-- 이력서 작성·수정 -->
        <link rel="stylesheet" th:href="@{/css/my/resume/form.css}" />

        <!-- 공통 확인 모달 -->
        <link rel="stylesheet" th:href="@{/css/modal/common.css}" />

        <!-- 기술 선택 모달 -->
        <link rel="stylesheet" th:href="@{/css/modal/common/skill-select-modal.css}" />
    </head>

    <body>
        <!-- 공통 헤더 -->
        <header th:replace="~{common/header :: header}"></header>

        <main class="mypage">
            <div class="wrap mypage-layout">
                <!-- 마이페이지 공통 사이드바 -->
                <aside th:replace="~{common/my-aside :: myAside}"></aside>

                <!-- 이력서 작성·수정 -->
                <section class="mypage-content resume-form-content">
                    <div class="resume-form-heading">
                        <h1 class="resume-form-title" th:text="${editMode} ? '이력서 수정' : '이력서 등록'">이력서 작성·수정</h1>

                        <p class="resume-form-description">기본정보·학력/경력·기술/프로젝트를 탭으로 입력합니다.</p>
                    </div>

                    <!-- 탭 -->
                    <div class="resume-tabs" role="tablist" aria-label="이력서 작성 단계">
                        <button
                            type="button"
                            id="resumeTabBasic"
                            class="resume-tab is-active"
                            role="tab"
                            aria-selected="true"
                            aria-controls="resumePanelBasic"
                            data-resume-tab="basic"
                        >
                            기본정보
                        </button>

                        <button
                            type="button"
                            id="resumeTabCareer"
                            class="resume-tab"
                            role="tab"
                            aria-selected="false"
                            aria-controls="resumePanelCareer"
                            data-resume-tab="career"
                        >
                            학력·경력
                        </button>

                        <button
                            type="button"
                            id="resumeTabSkill"
                            class="resume-tab"
                            role="tab"
                            aria-selected="false"
                            aria-controls="resumePanelSkill"
                            data-resume-tab="skill"
                        >
                            기술·프로젝트
                        </button>
                    </div>

                    <!-- 등록·수정 공통 폼 -->
                    <form class="resume-form" th:action="@{/my/resume/form}" method="post" data-resume-form novalidate>
                        <!-- 수정 시 이력서 ID -->
                        <input type="hidden" name="resumeId" th:value="${resumeForm.resumeId}" />

                        <!--
                            서버 검증에서 걸린 내용.
                            이 폼은 th:field 대신 동적 인덱스로 name을 만들어 필드별 에러 표시를 쓸 수 없어
                            상단에 모아서 보여준다. 입력값은 그대로 남아 있으므로 해당 항목만 고치면 된다.
                        -->
                        <div
                            class="resume-form-errors"
                            role="alert"
                            th:if="${validationErrors != null and !validationErrors.isEmpty()}"
                        >
                            <strong>입력한 내용을 확인해주세요</strong>

                            <ul>
                                <li th:each="message : ${validationErrors}" th:text="${message}"></li>
                            </ul>
                        </div>

                        <!-- =================================================
                             1. 기본정보
                        ================================================== -->
                        <section
                            id="resumePanelBasic"
                            class="resume-panel is-active"
                            role="tabpanel"
                            aria-labelledby="resumeTabBasic"
                            data-resume-panel="basic"
                        >
                            <div class="resume-panel-header">
                                <h2>기본정보</h2>

                                <span class="resume-required-badge"> 필수 입력 </span>
                            </div>

                            <div class="resume-basic-fields">
                                <!-- 이력서 제목 -->
                                <div class="resume-field resume-field-full">
                                    <label for="resumeTitle">
                                        이력서 제목
                                        <span class="required">*</span>
                                    </label>

                                    <input
                                        type="text"
                                        id="resumeTitle"
                                        name="title"
                                        class="resume-input"
                                        th:value="${resumeForm.title}"
                                        placeholder="이력서 제목을 입력해주세요"
                                        maxlength="100"
                                        required
                                        data-required-field
                                        data-required-tab="basic"
                                    />

                                    <p class="resume-field-message" data-field-message="resumeTitle"></p>
                                </div>

                                <!-- 이름 / 이메일 / 휴대전화 -->
                                <div class="resume-field-grid resume-field-grid-three">
                                    <div class="resume-field">
                                        <label for="memberName">이름</label>

                                        <input
                                            type="text"
                                            id="memberName"
                                            class="resume-input"
                                            th:value="${memberName}"
                                            readonly
                                        />
                                    </div>

                                    <div class="resume-field">
                                        <label for="email">이메일</label>

                                        <input
                                            type="email"
                                            id="email"
                                            class="resume-input"
                                            th:value="${email}"
                                            readonly
                                        />
                                    </div>

                                    <div class="resume-field">
                                        <label for="phone">휴대전화</label>

                                        <input
                                            type="tel"
                                            id="phone"
                                            class="resume-input"
                                            th:value="${phone}"
                                            readonly
                                        />
                                    </div>
                                </div>

                                <!-- 경력 구분 -->
                                <div class="resume-field resume-field-full">
                                    <label for="careerType">
                                        경력 구분
                                        <span class="required">*</span>
                                    </label>

                                    <select
                                        id="careerType"
                                        name="careerType"
                                        class="resume-input resume-select"
                                        required
                                        data-required-field
                                        data-required-tab="basic"
                                    >
                                        <option value="" th:selected="${resumeForm.careerType == null}">경력 구분 선택</option>
                                        <option value="신입" th:selected="${resumeForm.careerType == '신입'}">신입</option>
                                        <option value="경력" th:selected="${resumeForm.careerType == '경력'}">경력</option>
                                    </select>

                                    <p class="resume-field-message" data-field-message="careerType"></p>
                                </div>

                                <!-- 한 줄 소개 -->
                                <div class="resume-field resume-field-full">
                                    <label for="summary">한 줄 소개</label>

                                    <textarea
                                        id="summary"
                                        name="summary"
                                        class="resume-textarea resume-summary-textarea"
                                        placeholder="자신을 소개하는 한 줄을 입력해주세요"
                                        maxlength="300"
                                        th:text="${resumeForm.summary}"
                                    ></textarea>

                                    <div class="resume-text-counter"><span data-text-count="summary">0</span>/300</div>
                                </div>
                            </div>

                            <!-- 등록 현황 요약 -->
                            <div class="resume-summary-links">
                                <button type="button" class="resume-summary-link" data-resume-tab-move="career">
                                    <span>
                                        학력
                                        <strong data-education-summary-count> 1 </strong>건 등록됨
                                    </span>

                                    <span>학력·경력 탭에서 수정 →</span>
                                </button>

                                <button type="button" class="resume-summary-link" data-resume-tab-move="skill">
                                    <span>
                                        기술
                                        <strong data-skill-summary-count> 6 </strong>개 · 프로젝트
                                        <strong data-project-summary-count> 1 </strong>건 등록됨
                                    </span>

                                    <span>기술·프로젝트 탭에서 수정 →</span>
                                </button>
                            </div>

                            <!-- 단계 이동만 담당한다. 저장은 탭 바깥 공통 푸터에 있다. -->
                            <div class="resume-panel-nav resume-panel-nav-end">
                                <button type="button" class="resume-secondary-button" data-resume-tab-move="career">
                                    다음 →
                                </button>
                            </div>
                        </section>

                        <!-- =================================================
                             2. 학력·경력
                        ================================================== -->
                        <section
                            id="resumePanelCareer"
                            class="resume-panel"
                            role="tabpanel"
                            aria-labelledby="resumeTabCareer"
                            data-resume-panel="career"
                            hidden
                        >
                            <!-- 학력 -->
                            <div class="resume-section-heading">
                                <h2>학력·경력</h2>

                                <button type="button" class="resume-add-button" data-add-education>＋ 학력 추가</button>
                            </div>

                            <div class="resume-repeat-list" data-education-list>
                                <article
                                    class="resume-repeat-card"
                                    data-education-item
                                    th:each="education, eduStat : ${resumeForm.educations}"
                                >
                                    <div class="resume-repeat-header">
                                        <h3 data-education-title th:text="|학력 ${eduStat.count}|">학력 1</h3>

                                        <button
                                            type="button"
                                            class="resume-remove-button"
                                            data-remove-education
                                            aria-label="학력 삭제"
                                        >
                                            삭제
                                        </button>
                                    </div>

                                    <div class="resume-field-grid">
                                        <div class="resume-field">
                                            <label>
                                                학교명
                                                <span class="required">*</span>
                                            </label>

                                            <input
                                                type="text"
                                                th:attr="name=|educations[${eduStat.index}].schoolName|"
                                                class="resume-input"
                                                th:value="${education.schoolName}"
                                                placeholder="학교명 입력"
                                                required
                                                data-education-field="schoolName"
                                                data-required-field
                                                data-required-tab="career"
                                            />
                                        </div>

                                        <div class="resume-field">
                                            <label>전공</label>

                                            <input
                                                type="text"
                                                th:attr="name=|educations[${eduStat.index}].major|"
                                                class="resume-input"
                                                th:value="${education.major}"
                                                placeholder="전공 입력"
                                                data-education-field="major"
                                            />
                                        </div>
                                    </div>

                                    <div class="resume-field-grid resume-field-grid-six">
                                        <div class="resume-field">
                                            <label>학위</label>

                                            <select
                                                th:attr="name=|educations[${eduStat.index}].degree|"
                                                class="resume-input resume-select"
                                                data-education-field="degree"
                                            >
                                                <option value="" th:selected="${education.degree == null}">학위 선택</option>
                                                <option value="고등학교" th:selected="${education.degree == '고등학교'}">고등학교</option>
                                                <option value="전문학사" th:selected="${education.degree == '전문학사'}">전문학사</option>
                                                <option value="학사" th:selected="${education.degree == '학사'}">학사</option>
                                                <option value="석사" th:selected="${education.degree == '석사'}">석사</option>
                                                <option value="박사" th:selected="${education.degree == '박사'}">박사</option>
                                            </select>
                                        </div>

                                        <div class="resume-field">
                                            <label>입학일</label>

                                            <div class="resume-date" data-date-group>
                                                <select class="resume-input resume-select" data-date-year aria-label="입학 연도">
                                                    <th:block th:replace="~{my/resume/date-options :: yearOptions}"></th:block>
                                                </select>
                                                <select class="resume-input resume-select" data-date-month aria-label="입학 월">
                                                    <th:block th:replace="~{my/resume/date-options :: monthOptions}"></th:block>
                                                </select>
                                                <input
                                                    type="hidden"
                                                    data-date-value
                                                    data-education-field="admissionDate"
                                                    th:attr="name=|educations[${eduStat.index}].admissionDate|"
                                                    th:value="${education.admissionDate}"
                                                />
                                            </div>
                                        </div>

                                        <div class="resume-field">
                                            <label>졸업(예정)일</label>

                                            <div class="resume-date" data-date-group>
                                                <select class="resume-input resume-select" data-date-year aria-label="졸업 연도">
                                                    <th:block th:replace="~{my/resume/date-options :: yearOptions}"></th:block>
                                                </select>
                                                <select class="resume-input resume-select" data-date-month aria-label="졸업 월">
                                                    <th:block th:replace="~{my/resume/date-options :: monthOptions}"></th:block>
                                                </select>
                                                <input
                                                    type="hidden"
                                                    data-date-value
                                                    data-education-field="graduationDate"
                                                    th:attr="name=|educations[${eduStat.index}].graduationDate|"
                                                    th:value="${education.graduationDate}"
                                                />
                                            </div>
                                        </div>

                                        <div class="resume-field">
                                            <label>졸업 상태</label>

                                            <select
                                                th:attr="name=|educations[${eduStat.index}].graduationStatus|"
                                                class="resume-input resume-select"
                                                data-education-field="graduationStatus"
                                            >
                                                <option value="" th:selected="${education.graduationStatus == null}">상태 선택</option>
                                                <option value="재학" th:selected="${education.graduationStatus == '재학'}">재학</option>
                                                <option value="휴학" th:selected="${education.graduationStatus == '휴학'}">휴학</option>
                                                <option value="졸업예정" th:selected="${education.graduationStatus == '졸업예정'}">졸업 예정</option>
                                                <option value="졸업" th:selected="${education.graduationStatus == '졸업'}">졸업</option>
                                                <option value="수료" th:selected="${education.graduationStatus == '수료'}">수료</option>
                                                <option value="중퇴" th:selected="${education.graduationStatus == '중퇴'}">중퇴</option>
                                            </select>
                                        </div>

                                        <div class="resume-field">
                                            <label>학점</label>

                                            <input
                                                type="number"
                                                th:attr="name=|educations[${eduStat.index}].gpaScore|"
                                                class="resume-input"
                                                th:value="${education.gpaScore}"
                                                placeholder="예: 3.8"
                                                step="0.01"
                                                min="0"
                                                max="9.99"
                                                data-education-field="gpaScore"
                                            />
                                        </div>

                                        <div class="resume-field">
                                            <label>학점 기준</label>

                                            <input
                                                type="number"
                                                th:attr="name=|educations[${eduStat.index}].gpaScale|"
                                                class="resume-input"
                                                th:value="${education.gpaScale}"
                                                placeholder="예: 4.5"
                                                step="0.01"
                                                min="0"
                                                max="9.99"
                                                data-education-field="gpaScale"
                                            />
                                        </div>
                                    </div>
                                </article>
                            </div>

                            <!-- 경력 추가 -->
                            <div class="resume-subsection-action">
                                <button type="button" class="resume-outline-add-button" data-add-career>
                                    ＋ 경력 추가
                                </button>
                            </div>

                            <div class="resume-repeat-list" data-career-list>
                                <article
                                    class="resume-repeat-card"
                                    data-career-item
                                    th:each="career, careerStat : ${resumeForm.careers}"
                                >
                                    <div class="resume-repeat-header">
                                        <h3 data-career-title th:text="|경력 ${careerStat.count}|">경력 1</h3>

                                        <button
                                            type="button"
                                            class="resume-remove-button"
                                            data-remove-career
                                            aria-label="경력 삭제"
                                        >
                                            삭제
                                        </button>
                                    </div>

                                    <div class="resume-field-grid">
                                        <div class="resume-field">
                                            <label>회사명</label>

                                            <input
                                                type="text"
                                                th:attr="name=|careers[${careerStat.index}].companyName|"
                                                class="resume-input"
                                                th:value="${career.companyName}"
                                                placeholder="회사명 입력"
                                                data-career-field="companyName"
                                            />
                                        </div>

                                        <div class="resume-field">
                                            <label>담당 업무</label>

                                            <input
                                                type="text"
                                                th:attr="name=|careers[${careerStat.index}].positionTitle|"
                                                class="resume-input"
                                                th:value="${career.positionTitle}"
                                                placeholder="담당 업무 입력"
                                                data-career-field="positionTitle"
                                            />
                                        </div>
                                    </div>

                                    <div class="resume-field-grid resume-field-grid-four">
                                        <div class="resume-field">
                                            <label>입사일</label>

                                            <div class="resume-date" data-date-group>
                                                <select class="resume-input resume-select" data-date-year aria-label="입사 연도">
                                                    <th:block th:replace="~{my/resume/date-options :: yearOptions}"></th:block>
                                                </select>
                                                <select class="resume-input resume-select" data-date-month aria-label="입사 월">
                                                    <th:block th:replace="~{my/resume/date-options :: monthOptions}"></th:block>
                                                </select>
                                                <input
                                                    type="hidden"
                                                    data-date-value
                                                    data-career-field="startDate"
                                                    th:attr="name=|careers[${careerStat.index}].startDate|"
                                                    th:value="${career.startDate}"
                                                />
                                            </div>
                                        </div>

                                        <div class="resume-field">
                                            <label>퇴사일</label>

                                            <div class="resume-date" data-date-group>
                                                <select class="resume-input resume-select" data-date-year aria-label="퇴사 연도">
                                                    <th:block th:replace="~{my/resume/date-options :: yearOptions}"></th:block>
                                                </select>
                                                <select class="resume-input resume-select" data-date-month aria-label="퇴사 월">
                                                    <th:block th:replace="~{my/resume/date-options :: monthOptions}"></th:block>
                                                </select>
                                                <input
                                                    type="hidden"
                                                    data-date-value
                                                    data-career-field="endDate"
                                                    th:attr="name=|careers[${careerStat.index}].endDate|"
                                                    th:value="${career.endDate}"
                                                />
                                            </div>
                                        </div>

                                        <div class="resume-field">
                                            <label>재직 상태</label>

                                            <select
                                                th:attr="name=|careers[${careerStat.index}].employmentStatus|"
                                                class="resume-input resume-select"
                                                data-career-field="employmentStatus"
                                            >
                                                <option value="" th:selected="${career.employmentStatus == null}">상태 선택</option>
                                                <option value="재직" th:selected="${career.employmentStatus == '재직'}">재직</option>
                                                <option value="퇴사" th:selected="${career.employmentStatus == '퇴사'}">퇴사</option>
                                            </select>
                                        </div>

                                        <div class="resume-field">
                                            <label>고용 형태</label>

                                            <select
                                                th:attr="name=|careers[${careerStat.index}].employmentType|"
                                                class="resume-input resume-select"
                                                data-career-field="employmentType"
                                            >
                                                <option value="" th:selected="${career.employmentType == null}">형태 선택</option>
                                                <option value="정규직" th:selected="${career.employmentType == '정규직'}">정규직</option>
                                                <option value="계약직" th:selected="${career.employmentType == '계약직'}">계약직</option>
                                                <option value="인턴" th:selected="${career.employmentType == '인턴'}">인턴</option>
                                                <option value="프리랜서" th:selected="${career.employmentType == '프리랜서'}">프리랜서</option>
                                                <option value="파견직" th:selected="${career.employmentType == '파견직'}">파견직</option>
                                                <option value="기타" th:selected="${career.employmentType == '기타'}">기타</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="resume-field resume-field-full">
                                        <label>담당 업무 상세</label>

                                        <textarea
                                            th:attr="name=|careers[${careerStat.index}].description|"
                                            class="resume-textarea"
                                            placeholder="담당 업무와 성과를 입력해주세요"
                                            maxlength="1000"
                                            data-career-field="description"
                                            th:text="${career.description}"
                                        ></textarea>
                                    </div>
                                </article>
                            </div>

                            <div class="resume-panel-nav">
                                <button type="button" class="resume-secondary-button" data-resume-tab-move="basic">
                                    ← 이전
                                </button>

                                <button type="button" class="resume-secondary-button" data-resume-tab-move="skill">
                                    다음 →
                                </button>
                            </div>
                        </section>

                        <!-- =================================================
                             3. 기술·프로젝트
                        ================================================== -->
                        <section
                            id="resumePanelSkill"
                            class="resume-panel"
                            role="tabpanel"
                            aria-labelledby="resumeTabSkill"
                            data-resume-panel="skill"
                            hidden
                        >
                            <div class="resume-section-heading">
                                <h2>기술·프로젝트</h2>

                                <button type="button" class="resume-add-button" data-add-project>
                                    ＋ 프로젝트 추가
                                </button>
                            </div>

                            <!-- 보유 기술 -->
                            <div class="resume-field resume-field-full">
                                <div class="resume-skill-label-row">
                                    <label>
                                        보유 기술 선택
                                        <span class="resume-label-option">(최대 10개)</span>
                                    </label>

                                    <span class="resume-skill-count" data-skill-selection-count th:text="|${#lists.size(skillChips)}/10|"> 0/10 </span>
                                </div>

                                <div class="resume-skill-selection-box">
                                    <div class="resume-skill-chips" data-skill-chip-list>
                                        <button
                                            type="button"
                                            class="resume-skill-chip"
                                            th:each="chip : ${skillChips}"
                                            th:attr="data-skill-id=${chip.id},data-skill-name=${chip.name}"
                                        >
                                            <span th:text="${chip.name}">Java</span>
                                            <span aria-hidden="true">×</span>
                                        </button>
                                    </div>

                                    <p class="resume-skill-empty" data-skill-empty th:hidden="${not #lists.isEmpty(skillChips)}">선택한 기술이 없습니다.</p>

                                    <div data-skill-hidden-inputs>
                                        <input
                                            type="hidden"
                                            name="skillIds"
                                            th:each="chip : ${skillChips}"
                                            th:value="${chip.id}"
                                        />
                                    </div>

                                    <button type="button" class="resume-skill-open-button" data-skill-modal-open>
                                        기술 선택
                                    </button>
                                </div>

                                <p class="resume-field-message" data-skill-message aria-live="polite"></p>
                            </div>

                            <!-- 프로젝트 목록 -->
                            <div class="resume-repeat-list resume-project-list" data-project-list>
                                <article
                                    class="resume-repeat-card"
                                    data-project-item
                                    th:each="project, projectStat : ${resumeForm.projects}"
                                >
                                    <div class="resume-repeat-header">
                                        <h3 data-project-title th:text="|프로젝트 ${projectStat.count}|">프로젝트 1</h3>

                                        <button
                                            type="button"
                                            class="resume-remove-button"
                                            data-remove-project
                                            aria-label="프로젝트 삭제"
                                        >
                                            삭제
                                        </button>
                                    </div>

                                    <div class="resume-field-grid">
                                        <div class="resume-field">
                                            <label>
                                                프로젝트명
                                                <span class="required">*</span>
                                            </label>

                                            <input
                                                type="text"
                                                th:attr="name=|projects[${projectStat.index}].projectName|"
                                                class="resume-input"
                                                th:value="${project.projectName}"
                                                placeholder="프로젝트명 입력"
                                                required
                                                data-project-field="projectName"
                                                data-required-field
                                                data-required-tab="skill"
                                            />
                                        </div>

                                        <div class="resume-field">
                                            <label>담당 역할</label>

                                            <input
                                                type="text"
                                                th:attr="name=|projects[${projectStat.index}].roleText|"
                                                class="resume-input"
                                                th:value="${project.roleText}"
                                                placeholder="담당 역할 입력"
                                                data-project-field="roleText"
                                            />
                                        </div>
                                    </div>

                                    <div class="resume-field resume-field-full">
                                        <label>프로젝트 설명</label>

                                        <textarea
                                            th:attr="name=|projects[${projectStat.index}].description|"
                                            class="resume-textarea resume-project-textarea"
                                            placeholder="프로젝트 내용과 담당 기능을 입력해주세요"
                                            maxlength="1500"
                                            data-project-field="description"
                                            th:text="${project.description}"
                                        ></textarea>
                                    </div>
                                </article>
                            </div>

                            <div class="resume-panel-nav">
                                <button type="button" class="resume-secondary-button" data-resume-tab-move="career">
                                    ← 이전
                                </button>
                            </div>
                        </section>

                        <!-- 탭 바깥 공통 푸터: 어느 탭에서도 저장·취소할 수 있다. -->
                        <div class="resume-form-actions">
                            <a th:href="@{/my/resume}" class="resume-secondary-button" data-resume-cancel> 취소 </a>

                            <button type="submit" class="resume-primary-button" name="submitMode" value="preview">
                                저장 후 보기
                            </button>
                        </div>
                    </form>
                </section>
            </div>
        </main>

        <!-- 동적 학력 템플릿 -->
        <template id="educationItemTemplate">
            <article class="resume-repeat-card" data-education-item>
                <div class="resume-repeat-header">
                    <h3 data-education-title>학력</h3>

                    <button type="button" class="resume-remove-button" data-remove-education aria-label="학력 삭제">
                        삭제
                    </button>
                </div>

                <div class="resume-field-grid">
                    <div class="resume-field">
                        <label>
                            학교명
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            class="resume-input"
                            placeholder="학교명 입력"
                            required
                            data-education-field="schoolName"
                            data-required-field
                            data-required-tab="career"
                        />
                    </div>

                    <div class="resume-field">
                        <label>전공</label>

                        <input type="text" class="resume-input" placeholder="전공 입력" data-education-field="major" />
                    </div>
                </div>

                <div class="resume-field-grid resume-field-grid-six">
                    <div class="resume-field">
                        <label>학위</label>

                        <select class="resume-input resume-select" data-education-field="degree">
                            <option value="">학위 선택</option>
                            <option value="고등학교">고등학교</option>
                            <option value="전문학사">전문학사</option>
                            <option value="학사">학사</option>
                            <option value="석사">석사</option>
                            <option value="박사">박사</option>
                        </select>
                    </div>

                    <div class="resume-field">
                        <label>입학일</label>

                        <div class="resume-date" data-date-group>
                            <select class="resume-input resume-select" data-date-year aria-label="입학 연도">
                                <th:block th:replace="~{my/resume/date-options :: yearOptions}"></th:block>
                            </select>
                            <select class="resume-input resume-select" data-date-month aria-label="입학 월">
                                <th:block th:replace="~{my/resume/date-options :: monthOptions}"></th:block>
                            </select>
                            <input type="hidden" data-date-value data-education-field="admissionDate" />
                        </div>
                    </div>

                    <div class="resume-field">
                        <label>졸업(예정)일</label>

                        <div class="resume-date" data-date-group>
                            <select class="resume-input resume-select" data-date-year aria-label="졸업 연도">
                                <th:block th:replace="~{my/resume/date-options :: yearOptions}"></th:block>
                            </select>
                            <select class="resume-input resume-select" data-date-month aria-label="졸업 월">
                                <th:block th:replace="~{my/resume/date-options :: monthOptions}"></th:block>
                            </select>
                            <input type="hidden" data-date-value data-education-field="graduationDate" />
                        </div>
                    </div>

                    <div class="resume-field">
                        <label>졸업 상태</label>

                        <select class="resume-input resume-select" data-education-field="graduationStatus">
                            <option value="">상태 선택</option>
                            <option value="재학">재학</option>
                            <option value="휴학">휴학</option>
                            <option value="졸업예정">졸업 예정</option>
                            <option value="졸업">졸업</option>
                            <option value="수료">수료</option>
                            <option value="중퇴">중퇴</option>
                        </select>
                    </div>

                    <div class="resume-field">
                        <label>학점</label>

                        <input
                            type="number"
                            class="resume-input"
                            placeholder="예: 3.8"
                            step="0.01"
                            min="0"
                            max="9.99"
                            data-education-field="gpaScore"
                        />
                    </div>

                    <div class="resume-field">
                        <label>학점 기준</label>

                        <input
                            type="number"
                            class="resume-input"
                            placeholder="예: 4.5"
                            step="0.01"
                            min="0"
                            max="9.99"
                            data-education-field="gpaScale"
                        />
                    </div>
                </div>
            </article>
        </template>

        <!-- 동적 경력 템플릿 -->
        <template id="careerItemTemplate">
            <article class="resume-repeat-card" data-career-item>
                <div class="resume-repeat-header">
                    <h3 data-career-title>경력</h3>

                    <button type="button" class="resume-remove-button" data-remove-career aria-label="경력 삭제">
                        삭제
                    </button>
                </div>

                <div class="resume-field-grid">
                    <div class="resume-field">
                        <label>회사명</label>

                        <input
                            type="text"
                            class="resume-input"
                            placeholder="회사명 입력"
                            data-career-field="companyName"
                        />
                    </div>

                    <div class="resume-field">
                        <label>담당 업무</label>

                        <input
                            type="text"
                            class="resume-input"
                            placeholder="담당 업무 입력"
                            data-career-field="positionTitle"
                        />
                    </div>
                </div>

                <div class="resume-field-grid resume-field-grid-four">
                    <div class="resume-field">
                        <label>입사일</label>

                        <div class="resume-date" data-date-group>
                            <select class="resume-input resume-select" data-date-year aria-label="입사 연도">
                                <th:block th:replace="~{my/resume/date-options :: yearOptions}"></th:block>
                            </select>
                            <select class="resume-input resume-select" data-date-month aria-label="입사 월">
                                <th:block th:replace="~{my/resume/date-options :: monthOptions}"></th:block>
                            </select>
                            <input type="hidden" data-date-value data-career-field="startDate" />
                        </div>
                    </div>

                    <div class="resume-field">
                        <label>퇴사일</label>

                        <div class="resume-date" data-date-group>
                            <select class="resume-input resume-select" data-date-year aria-label="퇴사 연도">
                                <th:block th:replace="~{my/resume/date-options :: yearOptions}"></th:block>
                            </select>
                            <select class="resume-input resume-select" data-date-month aria-label="퇴사 월">
                                <th:block th:replace="~{my/resume/date-options :: monthOptions}"></th:block>
                            </select>
                            <input type="hidden" data-date-value data-career-field="endDate" />
                        </div>
                    </div>

                    <div class="resume-field">
                        <label>재직 상태</label>

                        <select class="resume-input resume-select" data-career-field="employmentStatus">
                            <option value="">상태 선택</option>
                            <option value="재직">재직</option>
                            <option value="퇴사">퇴사</option>
                        </select>
                    </div>

                    <div class="resume-field">
                        <label>고용 형태</label>

                        <select class="resume-input resume-select" data-career-field="employmentType">
                            <option value="">형태 선택</option>
                            <option value="정규직">정규직</option>
                            <option value="계약직">계약직</option>
                            <option value="인턴">인턴</option>
                            <option value="프리랜서">프리랜서</option>
                            <option value="파견직">파견직</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                </div>

                <div class="resume-field resume-field-full">
                    <label>담당 업무 상세</label>

                    <textarea
                        class="resume-textarea"
                        placeholder="담당 업무와 성과를 입력해주세요"
                        maxlength="1000"
                        data-career-field="description"
                    ></textarea>
                </div>
            </article>
        </template>

        <!-- 동적 프로젝트 템플릿 -->
        <template id="projectItemTemplate">
            <article class="resume-repeat-card" data-project-item>
                <div class="resume-repeat-header">
                    <h3 data-project-title>프로젝트</h3>

                    <button type="button" class="resume-remove-button" data-remove-project aria-label="프로젝트 삭제">
                        삭제
                    </button>
                </div>

                <div class="resume-field-grid">
                    <div class="resume-field">
                        <label>
                            프로젝트명
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            class="resume-input"
                            placeholder="프로젝트명 입력"
                            required
                            data-project-field="projectName"
                            data-required-field
                            data-required-tab="skill"
                        />
                    </div>

                    <div class="resume-field">
                        <label>담당 역할</label>

                        <input
                            type="text"
                            class="resume-input"
                            placeholder="담당 역할 입력"
                            data-project-field="roleText"
                        />
                    </div>
                </div>

                <div class="resume-field resume-field-full">
                    <label>프로젝트 설명</label>

                    <textarea
                        class="resume-textarea resume-project-textarea"
                        placeholder="프로젝트 내용과 담당 기능을 입력해주세요"
                        maxlength="1500"
                        data-project-field="description"
                    ></textarea>
                </div>
            </article>
        </template>

        <!-- 공통 푸터 -->
        <footer th:replace="~{common/footer :: footer}"></footer>

        <!-- 공통 확인 모달 -->
        <div th:replace="~{modal/common/confirm-modal :: confirmModal}"></div>

        <!-- 기술 선택 모달 -->
        <div th:replace="~{modal/common/skill-select-modal :: skillSelectModal}"></div>

        <!-- 기술 선택 모달에 실제 DB 기술 목록을 채우기 위한 데이터 소스 -->
        <div hidden data-resume-skill-source>
            <span
                th:each="skill : ${activeSkills}"
                th:attr="data-skill-id=${skill.skillId},
                    data-parent-id=${skill.parentId},
                    data-depth=${skill.depth},
                    data-skill-name=${skill.skillName}"
            ></span>
        </div>

        <script th:src="@{/js/common.js}"></script>
        <script th:src="@{/js/modal.js}"></script>
        <script th:src="@{/js/my/resume/form.js}"></script>
        <script th:src="@{/js/modal/skill-select-modal.js}"></script>
    </body>
</html>
