<!--
    연/월 선택 상자의 옵션 목록.

    <input type="month">는 HTML 규격상 연도가 "4자리 이상"이라 131212년 같은 값도 유효하고,
    maxlength·pattern이 적용되지 않아 자릿수를 막을 방법이 없다.
    목록에서 고르는 방식으로 바꿔 애초에 이상한 값이 들어오지 못하게 한다.

    선택 상태는 서버에서 표시하지 않는다. 같은 값을 hidden input이 들고 있고,
    화면이 뜰 때 form.js가 그 값을 읽어 두 상자를 맞춘다.
-->
<th:block xmlns:th="http://www.thymeleaf.org">

    <!-- 최근 연도가 위에 오도록 내림차순 -->
    <th:block th:fragment="yearOptions">
        <option value="">연도</option>
        <option
            th:each="year : ${#numbers.sequence(maxYear, minYear, -1)}"
            th:value="${year}"
            th:text="${year}"
        ></option>
    </th:block>

    <!-- 값은 hidden input의 "YYYY-MM"에 그대로 들어가므로 두 자리로 채운다 -->
    <th:block th:fragment="monthOptions">
        <option value="">월</option>
        <option
            th:each="month : ${#numbers.sequence(1, 12)}"
            th:value="${#numbers.formatInteger(month, 2)}"
            th:text="${month}"
        ></option>
    </th:block>

</th:block>
