<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>마이페이지 - 관심공고</title>
    <link rel="stylesheet" th:href="@{/css/common.css}"/>
    <link rel="stylesheet" th:href="@{/css/my/common.css}"/>
    <link rel="stylesheet" th:href="@{/css/my/saved-jobs.css}"/>
    <link rel="stylesheet" th:href="@{/css/modal/common.css}"/>
    <script th:src="@{/js/modal.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <script th:src="@{/js/my/saved-jobs.js}"></script>
</head>
<body>
<header th:replace="~{common/header :: header}"></header>
<main class="mypage">
    <div class="wrap">
        <div class="mypage-layout">
            <aside th:replace="~{common/my-aside :: myAside}"></aside>
            <div class="mypage-content">
                <div class="page-header"><h2>관심 공고</h2><p>관심 등록한 채용공고를 모아서 확인할 수 있습니다.</p></div>

                <div class="page-filter">
                    <div class="job-count">총 <strong th:text="|${savedJobCount}건|">0건</strong></div>
                    <div class="job-filter">
                        <a class="job-tab" th:classappend="${filter == 'all'} ? ' active'" th:href="@{/my/saved-jobs(filter=all,page=1)}">전체</a>
                        <a class="job-tab" th:classappend="${filter == 'open'} ? ' active'" th:href="@{/my/saved-jobs(filter=open,page=1)}">채용 중</a>
                        <a class="job-tab" th:classappend="${filter == 'deadline'} ? ' active'" th:href="@{/my/saved-jobs(filter=deadline,page=1)}">마감 임박</a>
                    </div>
                </div>

                <div class="saved-job-list">
                    <div class="saved-job-card" th:each="job : ${savedJobs}">
                        <div class="company-logo" th:if="${job.logoUrl != null and !job.logoUrl.isBlank()}">
                            <img th:src="${job.logoUrl}" th:alt="${job.companyName}">
                        </div>
                        <div class="company-logo" th:unless="${job.logoUrl != null and !job.logoUrl.isBlank()}"
                             th:text="${#strings.substring(job.companyName, 0, 1)}">기</div>

                        <div class="job-info">
                            <span class="company-name" th:text="${job.companyName}">기업명</span>
                            <h3 th:text="${job.title}">공고명</h3>
                            <p>
                                <span th:text="${job.workRegion ?: '지역 미정'}">지역</span> ·
                                <span th:text="${job.employmentType ?: '고용형태 미정'}">고용형태</span>
                            </p>
                        </div>

                        <div class="job-right">
                            <div class="job-top">
                                <span class="deadline"
                                      th:text="${job.status == '마감' or (job.dday != null and job.dday < 0)
                                          ? '마감'
                                          : (job.dday == null ? '상시' : (job.dday == 0 ? 'D-Day' : 'D-' + job.dday))}">D-Day</span>
                                <button type="button" class="favorite-btn active"
                                        th:data-job-id="${job.jobPostingId}" aria-label="관심 공고 해제">
                                    <i class="fa-solid fa-heart"></i>
                                </button>
                            </div>
                            <a class="btn-outline job-view-btn"
                               th:href="@{/job/detail(jobPostingId=${job.jobPostingId})}">공고 보기</a>
                        </div>
                    </div>

                    <p class="saved-job-empty" th:if="${#lists.isEmpty(savedJobs)}">조건에 맞는 관심 공고가 없습니다.</p>
                </div>

                <div class="pagination" th:if="${pageHandler.lastPage > 0}">
                    <a th:if="${pageHandler.currentPage > 1}" th:href="@{/my/saved-jobs(filter=${filter},page=${pageHandler.currentPage - 1})}">&lt;</a>
                    <a th:each="pageNo : ${#numbers.sequence(pageHandler.startPage, pageHandler.endPage)}"
                       th:classappend="${pageNo == pageHandler.currentPage} ? ' active'"
                       th:text="${pageNo}" th:href="@{/my/saved-jobs(filter=${filter},page=${pageNo})}">1</a>
                    <a th:if="${pageHandler.currentPage < pageHandler.lastPage}" th:href="@{/my/saved-jobs(filter=${filter},page=${pageHandler.currentPage + 1})}">&gt;</a>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{modal/common/confirm-modal :: confirmModal}"></div>
<footer th:replace="~{common/footer :: footer}"></footer>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
