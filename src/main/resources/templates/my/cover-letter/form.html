<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>첫출근 — 자기소개서 작성·수정</title>
<link rel="stylesheet" th:href="@{/css/common.css}" />
<link rel="stylesheet" th:href="@{/css/my/common.css}" />
<link rel="stylesheet" th:href="@{/css/my/cover-letter/form.css}" />
</head><body>
<header th:replace="~{common/header :: header}"></header>
<main class="mypage">
    <div class="wrap mypage-layout">
        <!-- 좌측 사이드바 -->
        <aside th:replace="~{common/my-aside :: myAside}"></aside>

        <!-- 우측 컨텐츠 -->
        <section class="mypage-content">
            <!-- 페이지 헤더 -->
            <div class="cl-page-header">
                <h1 class="cl-page-header__title">자기소개서 작성·수정</h1>
                <p class="cl-page-header__desc">문항별 답변을 작성하고 원하는 시점에 AI 첨삭을 요청하세요.</p>
            </div>

            <form class="cl-form-card" th:action="@{/my/cover-letter/{id}(id=${coverLetter?.id})}" method="post">
                <!-- 제목 -->
                <div class="cl-field">
                    <label class="cl-field__label" for="cl-title">자기소개서 제목<span class="required">*</span></label>
                    <input
                            type="text"
                            id="cl-title"
                            name="title"
                            class="cl-input"
                            th:value="${coverLetter?.title} ?: '백엔드 개발자 지원 자기소개서'"
                            value="백엔드 개발자 지원 자기소개서"
                            placeholder="자기소개서 제목을 입력해주세요"
                    />
                </div>

                <!-- 연결할 채용공고 -->
                <div class="cl-field">
                    <label class="cl-field__label">연결할 채용공고 (선택)</label>
                    <div class="cl-job-select" role="button" tabindex="0">
                        <span class="cl-job-select__text">
                            <span class="cl-job-select__title">백엔드 개발자 채용</span><br />
                            <span class="cl-job-select__meta">기업 첫출근 · 모집 직무 백엔드 개발</span>
                        </span>
                        <svg class="cl-job-select__chevron" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m7 10 5 5 5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </div>
                </div>

                <!--
                  정적 프로토타입 단계: 지금은 문항 1개만 직접 써놓았습니다.
                  나중에 백엔드 연동 시, 아래 .cl-question 하나만 남기고
                  th:each="q : ${coverLetter.questions}" 를 그 요소에 추가한 뒤
                  순번 / 질문 / 답변 / 글자수를 th:text, th:value 로 채우면 됩니다.
                -->
                <div class="cl-question">
                    <div class="cl-question__head">
                        <span class="cl-question__label">문항 1</span>
                        <button type="button" class="cl-question__remove">삭제</button>
                    </div>
                    <input type="text" class="cl-question__prompt" value="지원 동기와 입사 후 목표를 작성해주세요." />
                    <textarea class="cl-textarea" maxlength="1000">저는 문제의 원인을 로그와 데이터 흐름으로 확인하는 과정에서 백엔드 개발의 매력을 느꼈습니다. 첫출근 프로젝트에서는 채용공고와 지원 데이터의 상태 변화를 실시간으로...</textarea>
                    <p class="cl-question__count">468 / 1,000자</p>
                </div>

                <!-- 문항 추가 -->
                <div class="cl-add-row">
                    <button type="button" class="btn btn-outline">+ 문항 추가</button>
                    <p class="cl-add-hint">저장된 자기소개서는 입사지원 시 제출 문서로 선택할 수 있습니다.</p>
                </div>

                <!-- 하단 액션 -->
                <div class="cl-form-actions">
                    <a th:href="@{/my/cover-letter/list}" class="btn btn-outline">취소</a>
                    <button type="submit" name="action" value="save" class="btn btn-outline">저장</button>
                    <button type="submit" name="action" value="ai-review" class="btn btn-primary cl-submit">AI 첨삭 요청</button>
                </div>
            </form>
        </section>
    </div>
</main>
<footer th:replace="~{common/footer :: footer}"></footer>
<script th:src="@{/js/common.js}"></script>
</body></html>
