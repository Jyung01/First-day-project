<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>첫출근 — AI 첨삭 결과</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <link rel="stylesheet" th:href="@{/css/my/common.css}" />
    <link rel="stylesheet" th:href="@{/css/my/cover-letter/ai-result.css}" />
</head><body>
<header th:replace="~{common/header :: header}"></header>
<main class="mypage">
    <div class="wrap mypage-layout">
        <aside th:replace="~{common/my-aside :: myAside}"></aside>

        <section class="mypage-content">
            <div class="cl-page-header">
                <h1 class="cl-page-header__title">AI 첨삭 결과</h1>
                <p class="cl-page-header__desc">원문과 AI 개선안을 비교하고 원하는 내용을 선택해 반영하세요.</p>
            </div>

            <div class="cl-review-tabs">
                <div class="cl-review-tabs__left" id="cl-tab-buttons">
                    <button type="button"
                            th:each="item, iter : ${coverLetterItems}"
                            th:text="|문항 ${iter.index + 1}|"
                            th:classappend="${iter.index == 0} ? ' is-active' : ''"
                            th:attr="data-index=${iter.index}"
                            class="cl-tab">문항 1</button>
                </div>
            </div>

            <div th:each="item, iter : ${coverLetterItems}"
                 th:attr="data-panel-index=${iter.index}"
                 th:classappend="${iter.index == 0} ? '' : ' cl-panel--hidden'"
                 class="cl-review-panel">

                <div class="cl-review-meta">
                    <div class="cl-review-meta__left">
                        <span class="status-badge status-badge--pending">첨삭 준비 중</span>
                        <span th:text="|${coverLetter.title} · 문항 ${iter.index + 1}|">자기소개서 · 문항 1</span>
                    </div>
                </div>

                <div class="cl-compare">
                    <!-- 원문 -->
                    <div class="cl-compare__col">
                        <h2 class="cl-compare__title">원문</h2>
                        <p class="cl-original__text" th:text="${item.answer}">원문 내용</p>
                        <p class="cl-original__count" th:text="|원문 ${item.answer != null ? #strings.length(item.answer) : 0}자|">원문 0자</p>
                    </div>

                    <!-- AI 첨삭 제안 (준비 중) -->
                    <div class="cl-compare__col">
                        <h2 class="cl-compare__title">AI 첨삭 제안</h2>
                        <div class="cl-ai-pending">
                            <p class="cl-ai-pending__title">AI 첨삭 기능은 준비 중입니다.</p>
                            <p class="cl-ai-pending__desc">첨삭 기능이 연결되면 이 화면에서 원문과 AI 개선안을 비교하고, 원하는 내용을 선택해 반영할 수 있습니다.</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="cl-notice">
                <svg class="cl-notice__icon" width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 8h.01M11 11h1v5h1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                <p>AI 첨삭은 참고용입니다. 개인정보나 기업 기밀을 언급하지 않고, 최종 내용은 사용자가 직접 확인해주세요.</p>
            </div>
        </section>
    </div>
</main>
<footer th:replace="~{common/footer :: footer}"></footer>
<script th:src="@{/js/common.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const tabButtons = document.querySelectorAll('#cl-tab-buttons .cl-tab');
        const panels = document.querySelectorAll('.cl-review-panel');

        tabButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const targetIndex = btn.dataset.index;

                tabButtons.forEach(b => b.classList.remove('is-active'));
                btn.classList.add('is-active');

                panels.forEach(panel => {
                    panel.classList.toggle('cl-panel--hidden', panel.dataset.panelIndex !== targetIndex);
                });
            });
        });
    });
</script>
</body></html>
