<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>첫출근 — 자기소개서 관리</title>
<link rel="stylesheet" th:href="@{/css/common.css}" />
<link rel="stylesheet" th:href="@{/css/my/common.css}" />
<link rel="stylesheet" th:href="@{/css/my/cover-letter/list.css}" />
</head><body>
<header th:replace="~{common/header :: header}"></header>
<main class="mypage">
    <div class="wrap mypage-layout">
        <!-- 좌측 사이드바 -->
        <aside th:replace="~{common/my-aside :: myAside}"></aside>

        <!-- 우측 컨텐츠 -->
        <section class="mypage-content">
            <!-- 페이지 헤더 -->
            <div class="cl-page-header">
                <div class="cl-page-header__text">
                    <h1 class="cl-page-header__title">자기소개서 관리</h1>
                    <p class="cl-page-header__desc">지원 목적에 맞게 다양한 자기소개서를 작성하고 AI 첨삭을 받아볼 수 있습니다.</p>
                </div>
                <a th:href="@{/my/cover-letter/form}" class="btn btn-primary cl-new-btn">
                    <span class="cl-new-btn__plus">+</span> 새 자기소개서 작성
                </a>
            </div>

            <!--
              정적 프로토타입 단계: 지금은 3개 항목을 직접 써놓았습니다.
              나중에 백엔드 연동 시, 아래 .cl-card 하나만 남기고
              th:each="letter : ${coverLetters}" 를 그 요소에 추가한 뒤
              title / questionCount / charCount / aiStatus 값을 th:text 로 채우면 됩니다.
            -->
            <ul class="cl-list" th:if="${not #lists.isEmpty(coverLetters)}">
                <li class="cl-card" th:each="letter, iter : ${coverLetters}">

                    <div class="cl-card__body">
                        <div class="cl-card__row">
                            <p class="cl-card__title" th:text="${letter.title}">백엔드 개발자 지원 자기소개서</p>
                            <span class="status-badge"
                                  th:classappend="${letter.aiReviewed ? 'status-badge--ai-done' : 'status-badge--pending'}"
                                  th:text="${letter.aiReviewed ? 'AI 첨삭 완료' : '검사 전'}">AI 첨삭 완료</span>
                        </div>
                        <p class="cl-card__meta" th:text="|문항 ${letter.questionCount}개 · ${#numbers.formatInteger(letter.charCount, 1, 'COMMA')}자|">문항 1개 · 2,842자</p>
                        <div class="cl-card__actions">
                            <a th:if="${letter.aiReviewed}"
                               th:href="@{/my/cover-letter/ai-result(id=${letter.id})}"
                               class="btn btn-primary btn-sm">AI 결과</a>
                            <a th:unless="${letter.aiReviewed}"
                               class="btn btn-disabled btn-sm" aria-disabled="true">AI 결과</a>

                            <a th:href="@{/my/cover-letter/detail(id=${letter.id})}" class="btn btn-outline btn-sm">보기</a>
                            <a th:href="@{/my/cover-letter/form(id=${letter.id})}" class="btn btn-outline btn-sm">수정</a>
                            <a href="#" class="btn btn-outline btn-sm js-delete" th:attr="data-id=${letter.id}">삭제</a>
                        </div>
                    </div>
                </li>
            </ul>

            <!-- 등록된 자기소개서가 없을 때 (기본은 숨김) -->
            <div class="cl-empty" style="display:none;">
                <p class="cl-empty__text">등록된 자기소개서가 없습니다</p>
                <a th:href="@{/my/cover-letter/form}" class="cl-empty__link">자기소개서 작성하기 →</a>
            </div>

            <!-- 안내 문구 -->
            <div class="cl-notice">
                <svg class="cl-notice__icon" width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 8h.01M11 11h1v5h1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                <p>AI 첨삭 결과는 참고용이며 원문을 자동으로 변경하지 않습니다. 사용자가 직접 “적용하기”를 선택한 경우에만 자기소개서에 반영됩니다.</p>
            </div>
        </section>
    </div>
</main>
<footer th:replace="~{common/footer :: footer}"></footer>
<script th:src="@{/js/common.js}"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.js-delete').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.preventDefault();
                if (!confirm('정말 삭제하시겠습니까?')) return;

                const id = btn.dataset.id;
                try {
                    const res = await fetch(`/my/cover-letter/${id}`, { method: 'DELETE' });
                    if (!res.ok) throw new Error('삭제 실패');
                    btn.closest('.cl-card').remove();
                } catch (err) {
                    alert('삭제 중 오류가 발생했습니다.');
                }
            });
        });
    });
</script>

<!-- 공통 확인 모달 -->
<div th:replace="~{modal/common/confirm-modal :: confirmModal}"></div>

<script th:src="@{/js/common.js}"></script>

<!-- 공통 모달 -->
<script th:src="@{/js/modal.js}"></script>

</body>
</html>
