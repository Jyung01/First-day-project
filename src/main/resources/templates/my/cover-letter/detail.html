<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>첫출근 — 자기소개서 보기</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <link rel="stylesheet" th:href="@{/css/my/common.css}" />
    <link rel="stylesheet" th:href="@{/css/my/cover-letter/common.css}" />
    <link rel="stylesheet" th:href="@{/css/my/cover-letter/detail.css}" />
    <link rel="stylesheet" th:href="@{/css/modal/common.css}" />
</head><body>
<header th:replace="~{common/header :: header}"></header>
<main class="mypage">
    <div class="wrap mypage-layout">
        <!-- 좌측 사이드바 -->
        <aside th:replace="~{common/my-aside :: myAside}"></aside>

        <!-- 우측 컨텐츠 -->
        <section class="mypage-content">
            <!-- 페이지 헤더 -->
            <div class="cl-page-header">
                <div class="cl-page-header__text">
                    <h1 class="cl-page-header__title">자기소개서 보기</h1>
                    <p class="cl-page-header__desc">저장되거나 제출된 형태로 자기소개서 내용을 확인합니다.</p>
                </div>
                <div class="cl-page-header__actions">
                    <a th:href="@{/my/cover-letter/list}" class="btn btn-outline">돌아가기</a>
                    <a th:href="@{/my/cover-letter/form(id=${coverLetter.coverLetterId})}" class="btn btn-outline">수정</a>
                    <a href="#" id="btn-delete" class="btn btn-primary" th:attr="data-id=${coverLetter.coverLetterId}">삭제</a>
                </div>
            </div>

            <div class="cl-doc-card">
                <h2 class="cl-doc-card__title" th:text="${coverLetter.title}">백엔드 개발자 지원 자기소개서</h2>
                <p class="cl-doc-card__byline"
                   th:text="|최종 수정 ${#temporals.format(coverLetter.updatedAt, 'yyyy.MM.dd')}|">최종 수정 2026.07.22</p>
                <hr class="cl-doc-card__divider" />

                <div class="cl-doc-section" th:each="item : ${coverLetterItems}">
                    <h3 class="cl-doc-section__title" th:text="${item.question}">문항 질문</h3>
                    <p class="cl-doc-section__text" th:text="${item.answer}">문항 답변</p>
                </div>
            </div>
            <p id="cl-detail-feedback" class="cl-inline-feedback" role="alert" hidden></p>
        </section>
    </div>
</main>
<footer th:replace="~{common/footer :: footer}"></footer>
<script th:src="@{/js/common.js}"></script>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', () => {
        const deleteBtn = document.getElementById('btn-delete');
        deleteBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            const id = deleteBtn.dataset.id;
            showConfirmModal({
                iconClass: 'danger',
                iconHtml: '!',
                title: '삭제할까요?',
                message: '삭제한 내용은 복구할 수 없습니다.\n자기소개서 삭제 시 제출 완료된 지원 문서는 유지됩니다.',
                leftText: '취소',
                rightText: '삭제',
                rightClass: 'btn-danger',
                onRight: async () => {
                    const feedback = document.getElementById('cl-detail-feedback');
                    try {
                        const res = await fetch(`/my/cover-letter/${id}`, { method: 'DELETE' });
                        if (!res.ok) throw new Error('삭제 실패');
                        location.href = '/my/cover-letter/list?deleted=true';
                    } catch (err) {
                        feedback.textContent = '삭제 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.';
                        feedback.hidden = false;
                    }
                }
            });
        });
    });
</script>

<!-- 공통 확인 모달 -->
<div th:replace="~{modal/common/confirm-modal :: confirmModal}"></div>

<!-- 공통 모달 -->
<script th:src="@{/js/modal.js}"></script>

</body>
</html>
