<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>지원 내역 | 첫출근</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" href="/css/common.css">
    <link rel="stylesheet" th:href="@{/css/my/common.css}" href="/css/my/common.css">
    <link rel="stylesheet" th:href="@{/css/my/application/common.css}" href="/css/my/application/common.css">
    <link rel="stylesheet" th:href="@{/css/my/application/list.css}" href="/css/my/application/list.css">
</head>
<body>
<header th:replace="~{common/header :: header}"></header>

<main class="mypage">
    <div class="wrap mypage-layout">
        <aside th:replace="~{common/my-aside :: myAside}"></aside>

        <section class="mypage-content application-content">
            <header class="application-page-header">
                <h1>지원 내역</h1>
                <p>지원 상태와 전형 진행 상황을 확인할 수 있습니다.</p>
            </header>

            <nav class="application-filter" aria-label="지원 상태 필터">
                <a class="application-filter__button"
                   th:classappend="${filter == 'all'} ? ' is-active'"
                   th:href="@{/my/applications(filter='all',page=1)}">
                    전체 <strong th:text="${applicationCounts.all}">0</strong>
                </a>
                <a class="application-filter__button"
                   th:classappend="${filter == 'applied'} ? ' is-active'"
                   th:href="@{/my/applications(filter='applied',page=1)}">
                    지원 완료 <strong th:text="${applicationCounts.applied}">0</strong>
                </a>
                <a class="application-filter__button"
                   th:classappend="${filter == 'progress'} ? ' is-active'"
                   th:href="@{/my/applications(filter='progress',page=1)}">
                    진행 중 <strong th:text="${applicationCounts.progress}">0</strong>
                </a>
                <a class="application-filter__button"
                   th:classappend="${filter == 'result'} ? ' is-active'"
                   th:href="@{/my/applications(filter='result',page=1)}">
                    최종 결과 <strong th:text="${applicationCounts.result}">0</strong>
                </a>
            </nav>

            <section class="application-list-card">
                <div class="application-list-head" aria-hidden="true">
                    <span>지원 기업 · 공고</span>
                    <span>지원일</span>
                    <span>현재 상태</span>
                    <span>최근 변경</span>
                    <span>상세</span>
                </div>

                <div class="application-row"
                     th:each="item : ${applications}">
                    <div class="application-row__company-job">
                        <div class="application-row__logo">
                            <img th:if="${item.companyLogoUrl != null and !item.companyLogoUrl.isBlank()}"
                                 th:src="${item.companyLogoUrl}"
                                 th:alt="${item.companyName + ' 로고'}">
                            <span th:unless="${item.companyLogoUrl != null and !item.companyLogoUrl.isBlank()}"
                                  th:text="${item.companyInitial}">기</span>
                        </div>
                        <strong class="application-row__job">
                            <span th:text="${item.companyName}">기업명</span>
                            <span class="application-company-state"
                                  th:if="${item.companyWithdrawn}">
                              탈퇴 기업
                            </span>
                            <span aria-hidden="true"> · </span>
                            <span th:text="${item.jobTitle}">채용공고명</span>
                        </strong>
                    </div>
                    <time th:datetime="${item.appliedAt}"
                          th:text="${#temporals.format(item.appliedAt, 'yyyy.MM.dd')}">
                        2026.08.11
                    </time>
                    <span class="application-status"
                          th:classappend="' application-status--' + ${item.statusVariant}"
                          th:text="${item.statusLabel}">
                        지원 완료
                    </span>
                    <time th:datetime="${item.latestChangedAt}"
                          th:text="${#temporals.format(item.latestChangedAt, 'yyyy.MM.dd')}">
                        2026.08.11
                    </time>
                    <a class="application-detail-link"
                       th:href="@{/my/applications/{id}(id=${item.applicationId})}">
                        상세 보기
                    </a>
                </div>

                <p class="application-empty"
                   th:if="${#lists.isEmpty(applications)}">
                    해당 상태의 지원 내역이 없습니다.
                </p>
            </section>

            <nav class="application-pagination"
                 th:if="${pageHandler.lastPage > 0}"
                 aria-label="지원 내역 페이지">
                <a class="application-pagination__arrow"
                   th:if="${pageHandler.currentPage > 1}"
                   th:href="@{/my/applications(filter=${filter},page=${pageHandler.currentPage - 1})}"
                   aria-label="이전 페이지"><span aria-hidden="true"></span></a>
                <span class="application-pagination__arrow is-disabled"
                      th:unless="${pageHandler.currentPage > 1}"
                      aria-disabled="true"><span aria-hidden="true"></span></span>
                <a th:each="pageNo : ${#numbers.sequence(pageHandler.startPage, pageHandler.endPage)}"
                   th:classappend="${pageNo == pageHandler.currentPage} ? ' is-active'"
                   th:attr="aria-current=${pageNo == pageHandler.currentPage} ? 'page'"
                   th:href="@{/my/applications(filter=${filter},page=${pageNo})}"
                   th:text="${pageNo}">1</a>
                <a class="application-pagination__arrow application-pagination__arrow--next"
                   th:if="${pageHandler.currentPage < pageHandler.lastPage}"
                   th:href="@{/my/applications(filter=${filter},page=${pageHandler.currentPage + 1})}"
                   aria-label="다음 페이지"><span aria-hidden="true"></span></a>
                <span class="application-pagination__arrow application-pagination__arrow--next is-disabled"
                      th:unless="${pageHandler.currentPage < pageHandler.lastPage}"
                      aria-disabled="true"><span aria-hidden="true"></span></span>
            </nav>
        </section>
    </div>
</main>

<footer th:replace="~{common/footer :: footer}"></footer>
<script th:src="@{/js/common.js}" src="/js/common.js"></script>
</body>
</html>
