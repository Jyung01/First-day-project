<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>마이페이지 - 관심기업</title>
    <link rel="stylesheet" th:href="@{/css/common.css}"/>
    <link rel="stylesheet" th:href="@{/css/my/common.css}"/>
    <link rel="stylesheet" th:href="@{/css/my/saved-jobs.css}"/>
    <link rel="stylesheet" th:href="@{/css/my/saved-companies.css}"/>
    <link rel="stylesheet" th:href="@{/css/modal/common.css}"/>
    <script th:src="@{/js/modal.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <script th:src="@{/js/my/saved-companies.js}"></script>
</head>
<body>
<header th:replace="~{common/header :: header}"></header>
<main class="mypage">
    <div class="wrap"><div class="mypage-layout">
        <aside th:replace="~{common/my-aside :: myAside}"></aside>
        <section class="mypage-content">
            <div class="page-header"><h2>관심 기업</h2><p>관심 등록한 기업의 정보를 확인할 수 있습니다.</p></div>
            <div class="page-filter">
                <div class="company-count">총 <strong th:text="|${savedCompanyCount}개 기업|">0개 기업</strong></div>
                <form id="companySortForm" th:action="@{/my/saved-companies}" method="get" class="company-sort-wrap">
                    <select class="company-sort" name="sort">
                        <option value="recent" th:selected="${sort == 'recent'}">최근 등록순</option>
                        <option value="name" th:selected="${sort == 'name'}">기업명순</option>
                        <option value="jobs" th:selected="${sort == 'jobs'}">진행 공고순</option>
                    </select>
                </form>
            </div>

            <div class="saved-company-list">
                <div class="saved-company-card" th:each="company : ${savedCompanies}">
                    <button type="button" class="favorite-btn active" th:data-company-id="${company.companyId}" aria-label="관심 기업 해제"><i class="fa-solid fa-heart"></i></button>
                    <div class="company-header">
                        <div class="company-logo" th:if="${company.logoUrl != null and !company.logoUrl.isBlank()}"><img th:src="${company.logoUrl}" th:alt="${company.companyName}"></div>
                        <div class="company-logo" th:unless="${company.logoUrl != null and !company.logoUrl.isBlank()}" th:text="${#strings.substring(company.companyName, 0, 1)}">기</div>
                        <div class="company-info">
                            <h3 th:text="${company.companyName}">기업명</h3>
                            <span th:text="|${company.industryName ?: '업종 정보 없음'} · ${company.companySize ?: '규모 정보 없음'}|">업종 · 규모</span>
                            <p th:text="|진행 공고 ${company.jobPostingCount}건|">진행 공고 0건</p>
                        </div>
                    </div>
                    <a class="btn-outline company-detail-btn" th:href="@{/company/detail(companyId=${company.companyId})}">기업 상세 보기</a>
                </div>
                <p th:if="${#lists.isEmpty(savedCompanies)}">등록한 관심 기업이 없습니다.</p>
            </div>

            <div class="pagination" th:if="${pageHandler.lastPage > 0}">
                <a th:if="${pageHandler.currentPage > 1}" th:href="@{/my/saved-companies(sort=${sort},page=${pageHandler.currentPage - 1})}">&lt;</a>
                <a th:each="pageNo : ${#numbers.sequence(pageHandler.startPage, pageHandler.endPage)}" th:classappend="${pageNo == pageHandler.currentPage} ? ' active'" th:text="${pageNo}" th:href="@{/my/saved-companies(sort=${sort},page=${pageNo})}">1</a>
                <a th:if="${pageHandler.currentPage < pageHandler.lastPage}" th:href="@{/my/saved-companies(sort=${sort},page=${pageHandler.currentPage + 1})}">&gt;</a>
            </div>
        </section>
    </div></div>
</main>
<div th:replace="~{modal/common/confirm-modal :: confirmModal}"></div>
<footer th:replace="~{common/footer :: footer}"></footer>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
