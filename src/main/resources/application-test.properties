# 테스트용 MySQL 대체 DB
spring.datasource.url=jdbc:h2:mem:firstday_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# contextLoads에서는 테이블 생성이나 SQL 실행 불필요
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# 테스트용 임시 AWS 설정값
# 실제 AWS 접속에는 사용되지 않음
aws.region=ap-northeast-2
aws.s3.public-bucket=test-public-bucket
aws.s3.private-bucket=test-private-bucket
aws.cloudfront.domain=test.example.com

management.endpoints.web.exposure.include=health

# 테스트용 Mail 설정
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@example.com
spring.mail.password=test
app.mail.from=test@example.com

app.auth.email-verification.expiration=5m
app.auth.email-verification.resend-cooldown=60s
app.auth.email-verification.verified-validity=30m
app.auth.email-verification.max-attempts=5
