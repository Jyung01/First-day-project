spring.application.name=First-day-project

# ==================================================
# MySQL - 일반 업무 데이터
# ==================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}

# ==================================================
# PostgreSQL - PGvector 전용 보조 DataSource
# ==================================================
app.datasource.postgres.driver-class-name=org.postgresql.Driver
app.datasource.postgres.url=${POSTGRES_URL}
app.datasource.postgres.username=${POSTGRES_USERNAME}
app.datasource.postgres.password=${POSTGRES_PASSWORD}

# PGvector 설정
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.schema-validation=true
spring.ai.vectorstore.pgvector.max-document-batch-size=1000

# MySQL을 PGvector DB로 잘못 사용하는 자동 설정만 제외
# PostgreSQL PgVectorStore는 별도 Config에서 직접 등록
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

# ==================================================
# JPA
# ==================================================
spring.jpa.database=mysql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================================================
# MyBatis
# ==================================================
mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.type-aliases-package=kr.co.firstdayproject
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.jdbc-type-for-null=NULL

# ==================================================
# Thymeleaf
# ==================================================
spring.thymeleaf.cache=false

# ==================================================
# Ollama
# ==================================================
spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama

spring.ai.ollama.base-url=${OLLAMA_BASE_URL}

spring.ai.ollama.chat.model=qwen3.5:9b
spring.ai.ollama.chat.think=false
spring.ai.ollama.chat.temperature=0.3
spring.ai.ollama.chat.num-ctx=8192

spring.ai.ollama.embedding.model=qwen3-embedding:0.6b
spring.ai.ollama.init.pull-model-strategy=never

# ==================================================
# AWS S3 / CloudFront
# ==================================================
app.aws.region=${AWS_REGION}
app.aws.s3.public-bucket=${AWS_S3_PUBLIC_BUCKET}
app.aws.s3.private-bucket=${AWS_S3_PRIVATE_BUCKET}
app.aws.cloudfront.domain=${AWS_CLOUDFRONT_DOMAIN}

# ==================================================
# 로그
# ==================================================
logging.level.root=INFO
logging.level.kr.co.firstday=DEBUG
logging.level.org.mybatis=DEBUG
logging.level.org.springframework.security=INFO

# ==================================================
# Actuator 설정
# ==================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never