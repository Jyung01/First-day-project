spring.application.name=First-day-project

# ==================================================
# Reverse proxy / HTTPS
# ==================================================
# Cloudflare -> Apache -> Spring Boot 구조에서 전달되는 X-Forwarded-* 헤더를
# 톰캣이 해석하도록 한다. 로컬에서 프록시 헤더가 없으면 기존 HTTP 동작을 유지한다.
server.forward-headers-strategy=NATIVE

# 운영 EC2에서는 APP_SESSION_COOKIE_SECURE=true로 설정한다.
# 기본값 false를 유지해 로컬 HTTP 개발 환경에서도 세션 로그인이 가능하게 한다.
server.servlet.session.cookie.secure=${APP_SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# ==================================================
# MySQL - 일반 업무 데이터
# ==================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}

# ==================================================
# PostgreSQL - PGvector 전용 보조 DataSource
# ==================================================
app.datasource.postgres.driver-class-name=org.postgresql.Driver
app.datasource.postgres.url=${POSTGRES_URL}
app.datasource.postgres.username=${POSTGRES_USERNAME}
app.datasource.postgres.password=${POSTGRES_PASSWORD}

# PGvector 설정
# 실제 PgVectorStore 생성은 PgVectorConfig.java에서 직접 처리
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.schema-name=ai
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.schema-validation=true
spring.ai.vectorstore.pgvector.max-document-batch-size=1000

# MySQL을 PGvector DB로 잘못 사용하는 자동 설정 제외
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

# ==================================================
# OpenAI - Chat / Embedding
# ==================================================
spring.ai.model.chat=openai
spring.ai.model.embedding=openai

spring.ai.openai.api-key=${OPENAI_API_KEY}

# RAG 첨삭 결과 생성 모델
# max-completion-tokens는 추론 모델의 내부 추론 토큰까지 함께 소진하는 예산이라, 눈에 보이는
# 첨삭 결과 길이만 보고 잡으면 안 된다. 3000에서는 같은 입력에도 문항 첨삭이 간헐적으로
# 실패했다 — 추론이 길어진 호출에서 출력이 잘려 구조화 응답(JSON) 파싱이 깨진 것이다.
# 실제 과금은 소비한 토큰 기준이므로, 상한을 올려도 평소 호출 비용은 그대로다.
spring.ai.openai.chat.model=gpt-5-mini
spring.ai.openai.chat.max-completion-tokens=8000

# RAG 검색용 임베딩 모델
spring.ai.openai.embedding.model=text-embedding-3-small
spring.ai.openai.embedding.dimensions=1024
# ==================================================
# JPA
# ==================================================
spring.jpa.database=mysql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================================================
# MyBatis
# ==================================================
mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.type-aliases-package=kr.co.firstdayproject
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.jdbc-type-for-null=NULL

# ==================================================
# Thymeleaf
# ==================================================
spring.thymeleaf.cache=false

# ==================================================
# AWS S3 / CloudFront
# ==================================================
app.aws.region=${AWS_REGION}
app.aws.s3.public-bucket=${AWS_S3_PUBLIC_BUCKET}
app.aws.s3.private-bucket=${AWS_S3_PRIVATE_BUCKET}
app.aws.cloudfront.domain=${AWS_CLOUDFRONT_DOMAIN}

# ==================================================
# 로그
# ==================================================
logging.level.root=INFO
logging.level.kr.co.firstdayproject=INFO
# CSRF 전환 작업용 조사 로그. csrf().disable() 제거 후 CsrfAuditFilter와 함께 삭제한다.
logging.level.CSRF_AUDIT=WARN
logging.level.org.mybatis=DEBUG
logging.level.org.springframework.security=INFO

# ==================================================
# Actuator 설정
# ==================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}

# ==================================================
# 업로드 파일 크기 제한
# ==================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==================================================
# Gmail SMTP
# ==================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 서비스에서 발신 주소로 사용
app.mail.from=${MAIL_USERNAME}

# 이메일 인증번호 정책
app.auth.email-verification.expiration=5m
app.auth.email-verification.resend-cooldown=60s
app.auth.email-verification.verified-validity=30m
app.auth.email-verification.max-attempts=5
# ==================================================
# CSRF (전환 작업 중)
# ==================================================
# 기본값 false. 로컬에서 true로 켜고 CsrfAuditFilter의 MISSING 로그로 누락 호출부를 찾는다.
# 전환이 끝나면 이 속성과 SecurityConfig의 분기를 제거하고 항상 켜진 상태로 둔다.
app.security.csrf.enabled=${APP_SECURITY_CSRF_ENABLED:false}
