name: FirstDay CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: firstday-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Test and build
        run: ./gradlew clean build

      - name: Prepare deploy JAR
        run: |
          JAR_FILE=$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-plain.jar" \
            | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "실행 가능한 JAR 파일을 찾지 못했습니다."
            exit 1
          fi

          cp "$JAR_FILE" firstday-new.jar

          ls -l firstday-new.jar

      - name: Upload new JAR to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "firstday-new.jar"
          target: "/home/ec2-user/firstday"

      - name: Deploy application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            chmod +x /home/ec2-user/firstday/deploy.sh
            /home/ec2-user/firstday/deploy.sh
