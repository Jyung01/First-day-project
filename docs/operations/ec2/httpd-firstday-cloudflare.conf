# /etc/httpd/conf.d/firstday-cloudflare.conf
# 수집일: 2026-08-24
#
# 서버 전역 설정(vhost 밖)이라 모든 vhost에 적용된다.
# 참조 파일은 사본을 두지 않는다 — 재구축 시 공식 목록에서 새로 받는다:
#   curl -fsS https://www.cloudflare.com/ips-v4 -o /etc/httpd/conf/cloudflare-ips-v4.txt

RemoteIPHeader CF-Connecting-IP
RemoteIPTrustedProxyList /etc/httpd/conf/cloudflare-ips-v4.txt
