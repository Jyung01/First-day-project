# /etc/httpd/conf.d/firstday-ssl.conf
# 수집일: 2026-08-24
#
# 실제 리버스 프록시가 여기에 있다. ssl.conf에는 프록시 설정이 없다.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName firstdayproject.site
    ServerAlias www.firstdayproject.site

    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/firstdayproject-origin.pem
    SSLCertificateKeyFile /etc/pki/tls/private/firstdayproject-origin.key

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass        / http://127.0.0.1:8080/ retry=0 timeout=60
    ProxyPassReverse / http://127.0.0.1:8080/

    ErrorLog  /var/log/httpd/firstday-ssl-error.log
    CustomLog /var/log/httpd/firstday-ssl-access.log combined
</VirtualHost>
</IfModule>
